    import unittest
    from bowling import BowlingGame

    def play(rolls):
        g = BowlingGame()
        for r in rolls:
            g.roll(r)
        return g

    class FramesTest(unittest.TestCase):
        def test_empty(self):
            self.assertEqual(play([]).frames(), [])
        def test_open_frames(self):
            self.assertEqual(play([3, 4, 5, 2]).frames(), [[3, 4], [5, 2]])
        def test_strike_is_single_roll_frame(self):
            self.assertEqual(play([10, 3, 4]).frames(), [[10], [3, 4]])
        def test_partial_frame(self):
            self.assertEqual(play([3]).frames(), [[3]])
        def test_perfect_game(self):
            self.assertEqual(play([10] * 12).frames(), [[10]] * 9 + [[10, 10, 10]])
        def test_tenth_frame_spare(self):
            self.assertEqual(play([0] * 18 + [5, 5, 7]).frames(), [[0, 0]] * 9 + [[5, 5, 7]])
        def test_returns_copies(self):
            g = play([3, 4])
            g.frames()[0].append(9)
            self.assertEqual(g.frames(), [[3, 4]])
  hidden_scores_test.py: |
    import unittest
    from bowling import BowlingGame

    def play(rolls):
        g = BowlingGame()
        for r in rolls:
            g.roll(r)
        return g

    class FrameScoresTest(unittest.TestCase):
        def test_empty(self):
            self.assertEqual(play([]).frame_scores(), [])
        def test_open(self):
            self.assertEqual(play([3, 4, 5, 2]).frame_scores(), [7, 14])
        def test_strike_needs_two_more_rolls(self):
            self.assertEqual(play([10]).frame_scores(), [])
            self.assertEqual(play([10, 3]).frame_scores(), [])
            self.assertEqual(play([10, 3, 4]).frame_scores(), [17, 24])
        def test_spare_needs_one_more_roll(self):
            self.assertEqual(play([5, 5]).frame_scores(), [])
            self.assertEqual(play([5, 5, 3]).frame_scores(), [13])
        def test_consecutive_strikes(self):
            self.assertEqual(play([10, 10]).frame_scores(), [])
            self.assertEqual(play([10, 10, 10]).frame_scores(), [30])
        def test_perfect_game(self):
            self.assertEqual(play([10] * 12).frame_scores(), list(range(30, 301, 30)))
        def test_last_equals_score_when_complete(self):
            g = play([10] * 12)
            self.assertEqual(g.frame_scores()[-1], g.score())
  hidden_types_test.py: |
    import unittest
    from bowling import BowlingGame

    class TypeValidationTest(unittest.TestCase):
        def test_non_int_raises_type_error(self):
            for bad in ("x", 3.5, None, True, [1]):
                with self.subTest(bad=bad):
                    with self.assertRaises(TypeError):
                        BowlingGame().roll(bad)
        def test_negative_still_value_error(self):
            with self.assertRaises(ValueError):
                BowlingGame().roll(-1)
        def test_bad_roll_does_not_corrupt_state(self):
            g = BowlingGame()
            g.roll(3)
            with self.assertRaises(TypeError):
                g.roll("x")
            g.roll(4)
            for _ in range(18):
                g.roll(0)
            self.assertEqual(g.score(), 7)
