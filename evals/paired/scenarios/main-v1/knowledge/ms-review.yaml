    patches/plural_cleanup.diff: |
      --- a/src/index.ts
      +++ b/src/index.ts
      @@ -239,6 +239,6 @@
         n: number,
         name: string,
       ): StringValue {
      -  const isPlural = msAbs >= n * 1.5;
