task_type: mixed
language: python
split: main
source:
  desc: 'Two pinned requirements files, license table and policy: exact diff JSON, review queue, report, revision after a security pin, reusable
    script.'
  kind: self-authored deterministic workspace
  adapted_from: [~/dev/amplifier-agent/.amplifier/evaluation/tasks/benchmark/git-changelog-generator/task.yaml (categorise a diff between two
