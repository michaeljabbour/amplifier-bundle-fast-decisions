      attrs==22.1.0
      httpx==0.25.2
      tomli==2.0.1
      readline-plus==1.0.0
    licenses.csv: |
      name,license
      attrs,MIT
      black,MIT
      certifi,MPL-2.0
      click,BSD-3-Clause
      flask,BSD-3-Clause
      httpx,BSD-3-Clause
      jinja2,BSD-3-Clause
      numpy,BSD-3-Clause
      pandas,BSD-3-Clause
