workspace:
  kind: inline
  files:
    README.md: |
      # Dependency audit

      Compare `requirements.old.txt` (current) with `requirements.new.txt` (proposed). `licenses.csv` maps each package to its license; rules are in `policy.md`. Versions are semantic (major.minor.patch).
