  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t6
    hidden: [_grade.py]
    timeout: 60
- prompt: Write INVOICE_NOTES.md with level-2 sections Method, Assumptions and Exceptions; under Exceptions list the date of every row that was
