    all: ['(?<![\d.])72.5(?:\.0)?(?![\d])']
- prompt: 'Create invoices/acme.csv with the header consultant,hours,rate,amount and one row per consultant who billed acme (sorted by name):
    total hours, hourly rate from config/rates.json and amount = hours x rate.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t2
    hidden: [_grade.py]
    timeout: 60
