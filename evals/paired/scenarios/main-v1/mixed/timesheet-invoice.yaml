hidden_files:
  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'ac_lines': [('Ivy Chen', 30.0, 140.0, 4200.0), ('Omar Reyes', 8.0, 125.0, 1000.0), ('Priya Nair', 20.0, 160.0, 3200.0), ('Sam Okafor', 14.5, 110.0, 1595.0)], 'ac': {'subtotal': 9995.0, 'discount': 999.5, 'tax': 742.13, 'total': 9737.63}, 'all': {'acme': {'subtotal': 9995.0, 'discount': 999.5, 'tax': 742.13, 'total': 9737.63}, 'bluebird': {'subtotal': 11900.0, 'discount': 0.0, 'tax': 714.0, 'total': 12614.0}, 'cobalt': {'subtotal': 11575.0, 'discount': 578.75, 'tax': 0.0, 'total': 10996.25}}, 'cap': {'acme': {'subtotal': 9715.0, 'discount': 971.5, 'tax': 721.34, 'total': 9464.84}, 'bluebird': {'subtotal': 11735.0, 'discount': 0.0, 'tax': 704.1, 'total': 12439.1}, 'cobalt': {'subtotal': 11575.0, 'discount': 578.75, 'tax': 0.0, 'total': 10996.25}}, 'dates': ['2025-03-14', '2025-03-26'], 'ac_hours': 72.5}

    def t2():
        p = W / "invoices/acme.csv"; need(p.exists(), "missing invoices/acme.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0].keys()) == ["consultant", "hours", "rate", "amount"], "bad header")
        need([r["consultant"] for r in rd] == [l[0] for l in EXP["ac_lines"]], "rows must be one per consultant, sorted by name")
        for r, l in zip(rd, EXP["ac_lines"]):
            need(close(r["hours"], l[1], 0.001) and close(r["rate"], l[2]) and close(r["amount"], l[3]), "bad line " + r["consultant"])

    def _inv(c, e):
        d = load_json(f"invoices/{c}.json")
        for k in ("subtotal", "discount", "tax", "total"): need(k in d and close(d[k], e[k], 0.011), f"{c}.{k}: {d.get(k)} != {e[k]}")
    def t3(): _inv("acme", EXP["ac"])
    def t4():
        for c, e in EXP["all"].items(): _inv(c, e)
    def t6():
        for c, e in EXP["cap"].items(): _inv(c, e)
    def t7():
        txt = read("INVOICE_NOTES.md")
        for d in EXP["dates"]: need(d in txt, d + " missing from notes")
    def t8():
        need((W / "scripts/invoice.py").exists(), "missing scripts/invoice.py")
        for c, e in EXP["cap"].items():
            rc, out, err = run(f"python3 scripts/invoice.py {c}"); need(rc == 0, "script failed for " + c + ": " + err[-200:])
            d = json.loads(out)
            for k in ("subtotal", "discount", "tax", "total"): need(close(d.get(k), e[k]), f"{c}.{k}")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
