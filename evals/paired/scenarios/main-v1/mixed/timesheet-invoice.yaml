    timeout: 60
- prompt: Create scripts/invoice.py taking a client name as its only argument and printing that client's invoice JSON (the four keys, with the
    12-hour cap applied) to stdout, reading everything from data/ and config/. Run it for each client to check it matches invoices/*.json.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t8
    hidden: [_grade.py]
    timeout: 60
