    and the acme settings in config/clients.json.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t3
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Do the same for every client: write invoices/<client>.json (same four keys) for acme, bluebird and cobalt.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t4
    hidden: [_grade.py]
    timeout: 60
- prompt: Are there any rows in data/timesheets.csv with more than 12 hours on a single line? List their dates. Do not change any files.
  checks:
