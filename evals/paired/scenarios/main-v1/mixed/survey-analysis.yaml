  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'all': {'responses': 72, 'nps': -38.9, 'avg_ease': 3.12, 'avg_support': 2.94, 'avg_value': 2.71}, 'post': {'responses': 51, 'nps': -37.3, 'avg_ease': 2.98, 'avg_support': 3.06, 'avg_value': 2.47}, 'bs': {'Enterprise': {'responses': 25, 'promoters': 6, 'passives': 3, 'detractors': 16, 'nps': -40.0}, 'SMB': {'responses': 23, 'promoters': 6, 'passives': 5, 'detractors': 12, 'nps': -26.1}, 'Consumer': {'responses': 24, 'promoters': 2, 'passives': 8, 'detractors': 14, 'nps': -50.0}}, 'price': ['R001', 'R005', 'R008', 'R011', 'R014', 'R016', 'R021', 'R026', 'R028', 'R029', 'R032', 'R033', 'R036', 'R038', 'R039', 'R043', 'R044', 'R056', 'R057', 'R058', 'R062', 'R063', 'R067', 'R068', 'R071'], 'small': ['SMB', 16]}

    def _kp(rel, e):
        d = load_json(rel)
        for k in ("responses", "nps", "avg_ease", "avg_support", "avg_value"): need(k in d and close(d[k], e[k], 0.011), f"{rel} {k}: {d.get(k)} != {e[k]}")
    def t3(): _kp("out/kpis.json", EXP["all"])
    def t10(): _kp("out/kpis_excl_pilot.json", EXP["post"])
    def t5():
        p = W / "out/nps_by_segment.csv"; need(p.exists(), "missing out/nps_by_segment.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0]) == ["segment", "responses", "promoters", "passives", "detractors", "nps"], "bad header")
        need([r["segment"] for r in rd] == sorted(EXP["bs"]), "segments must be sorted, one per row")
        for r in rd:
            e = EXP["bs"][r["segment"]]
            need(all(int(r[k]) == e[k] for k in ("responses", "promoters", "passives", "detractors")) and close(r["nps"], e["nps"], 0.051), "bad row " + r["segment"])
    def t7():
        rows = md_rows("report.md", "results"); need(rows, "no table under Results")
        got = {r[0].strip("* `"): num(r[1]) for r in rows if len(r) >= 2 and num(r[1]) is not None}
        for g, e in EXP["bs"].items(): need(g in got and close(got[g], e["nps"], 0.051), f"{g}: {got.get(g)} != {e['nps']}")
    def t9():
        p = W / "out/price_comments.txt"; need(p.exists(), "missing out/price_comments.txt")
        got = [l.strip() for l in p.read_text(encoding="utf-8").splitlines() if l.strip()]; need(got == EXP["price"], f"ids differ: {len(got)} vs {len(EXP['price'])}")
    def t12():
        txt = read("report.md"); need("2025-02-01" in txt and re.search(r"pilot|exclu", txt, re.I), "Method must mention the 2025-02-01 exclusion")
        need(re.search('-(?<![\\d.,])37\\.30?(?!\\d)', txt), "new NPS missing"); need(re.search(r"(?<!\d)%d(?!\d)" % EXP["post"]["responses"], txt), "new response count missing")
    def t13():
        need((W / "scripts/survey_stats.py").exists(), "missing scripts/survey_stats.py")
        for cmd, e in (("python3 scripts/survey_stats.py", EXP["all"]), ("python3 scripts/survey_stats.py --since 2025-02-01", EXP["post"])):
            rc, out, err = run(cmd); need(rc == 0, "script failed: " + err[-200:]); d = json.loads(out)
            for k in ("responses", "nps", "avg_ease", "avg_support", "avg_value"): need(close(d.get(k), e[k], 0.011), f"{cmd}: {k}")
    def t15():
        txt = read("report.md"); m = re.search(r"^#+\s*Limitations\s*\n(.*?)(?=^#|\Z)", txt, re.M | re.S | re.I); need(m, "no Limitations section")
        b = m.group(1); s, n = EXP["small"]; need(re.search(s, b) and re.search(r"(?<!\d)%d(?!\d)" % n, b), "must name smallest segment and its count")
        need(re.search(r"(?<!\d)%d(?!\d)" % EXP["post"]["responses"], b), "must state the remaining sample size")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
