      """Layered configuration store."""
      import json
      import os

      DEFAULTS = {"retries": 5, "timeout": 30, "format": "json"}
      _MISSING = object()


      class ConfigError(Exception):
          """Raised for unreadable or invalid configuration."""


      class Config:
          """A small key/value configuration."""

          def __init__(self, defaults=None):
              self._data = dict(DEFAULTS)
              self._data.update(defaults or {})
              self._validators = []

          def get(self, key, default=_MISSING):
              """Return the value for `key`, or `default` when given."""
              if key in self._data:
                  return self._data[key]
              if default is _MISSING:
                  raise KeyError(key)
              return default

          def set(self, key, value):
              self._data[key] = value

          def keys(self):
              """All keys."""
              return sorted(self._data)

          def load(self, path):
              """Merge a JSON object from `path` over the current values."""
              try:
                  with open(path, encoding="utf-8") as fh:
                      data = json.load(fh)
              except FileNotFoundError as exc:
                  raise ConfigError(f"config file not found: {path}") from exc
              if not isinstance(data, dict):
                  raise ConfigError("top-level JSON must be an object")
              self._data.update(data)

          def apply_env(self, prefix="TINY_"):
              for name, value in os.environ.items():
                  if name.startswith(prefix):
                      self._data[name[len(prefix):].lower()] = value

          def add_validator(self, name, func):
              self._validators.append((name, func))

          def validate(self):
              """Run every validator in the order it was added; raise ConfigError listing all failures."""
              errors = []
              for name, func in self._validators:
                  msg = func(self._data)
                  if msg:
                      errors.append(f"{name}: {msg}")
              if errors:
                  raise ConfigError("; ".join(errors))
    tinycfg/cli.py: |
      """Command line entry: `python3 -m tinycfg show FILE`."""
      import argparse
      import json
      import sys

      from .config import Config, ConfigError


      def build_parser():
          p = argparse.ArgumentParser(prog="tinycfg")
          sub = p.add_subparsers(dest="cmd", required=True)
          show = sub.add_parser("show", help="print a config file merged over the defaults")
          show.add_argument("file")
          show.add_argument("--format", choices=["json", "env"], default="json")
          return p


      def main(argv=None):
          """Run the CLI and return an exit status."""
          args = build_parser().parse_args(argv)
          cfg = Config()
          try:
              cfg.load(args.file)
          except ConfigError as exc:
              print(f"error: {exc}", file=sys.stderr)
              return 2
          if args.format == "json":
              print(json.dumps({k: cfg.get(k) for k in cfg.keys()}, indent=2))
          else:
              for k in cfg.keys():
                  print(f"{k.upper()}={cfg.get(k)}")
          return 0
