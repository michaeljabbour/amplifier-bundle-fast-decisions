        for k, pats in D.items():
            for p in pats: need(re.search(p, txt), f"discrepancy '{k}' not described")
    def t6():
        txt = read("README.md"); need(not re.search(r"returns\s+`?None`?", txt, re.I), "README still claims get returns None"); need("KeyError" in txt, "README must mention KeyError")
