    def t9():
        p = W / "tests/test_docs.py"; need(p.exists(), "missing tests/test_docs.py")
        rc, out, err = run("python3 -m unittest discover -s tests -p 'test_docs.py' -v 2>&1"); need(rc == 0, "tests fail: " + (out + err)[-300:])
        m = re.search(r"Ran (\d+) tests?", out + err); need(m and int(m.group(1)) >= 5, "need >= 5 tests")
        src = (W / SRC).read_text(encoding="utf-8"); applied = 0
