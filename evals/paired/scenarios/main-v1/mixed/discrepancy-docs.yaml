    README.md: |
      # tinycfg

      A tiny layered configuration store for scripts.

      ## Quick start

      ```python
      from tinycfg import Config
      cfg = Config()
      cfg.load("settings.json")
      cfg.get("timeout")
      ```

      `Config.get(key)` returns `None` when the key is missing; pass a second argument to get a different fallback.

      See docs/usage.md for the full reference and docs/env.md for environment overrides.
    CHANGELOG.md: |
      # Changelog

      ## Unreleased
    docs/usage.md: |
      # Usage

      ## Reading values

      `get(key, default)` returns `default` when it is given and raises `KeyError` otherwise.
      `keys()` returns the keys in insertion order.

      ## Loading files

      `load(path)` merges a JSON object over the current values. A missing file is silently ignored.

      ## Defaults

      `retries` is 3, `timeout` is 30 seconds and `format` is `json`.

      ## Validators

      `add_validator(name, func)` registers a check. `validate()` runs the validators in the order they were added and raises `ConfigError` listing every failure.

      ## CLI

      `python3 -m tinycfg show FILE [--format json|env]` prints the merged configuration.
    docs/env.md: |
      # Environment overrides

      `apply_env(prefix="TINY_")` copies every environment variable that starts with the prefix into the configuration. The prefix is stripped and the name is lower-cased.

      Values are converted automatically: numeric strings become ints and `true` / `false` become booleans.
    config/sample.json: |
      {
        "timeout": 10,
        "name": "demo",
        "debug": true
      }
