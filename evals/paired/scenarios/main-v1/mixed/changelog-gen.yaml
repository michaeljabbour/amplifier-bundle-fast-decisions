    README.md: |
      # release-tools

      `tools/changelog.py` turns `commits.log` and `tags.txt` into release notes.

      Log format: `hash|date|author|subject`, newest first. Subjects follow `type(scope)!: description`.
      Categories: `feat` -> Features, `fix` -> Bug Fixes, everything else -> Other. A trailing `!` (or the words BREAKING CHANGE) marks a breaking change.
      Entry format: `- <description> (<hash>)`.
