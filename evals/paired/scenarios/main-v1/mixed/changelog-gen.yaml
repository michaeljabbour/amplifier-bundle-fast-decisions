  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'rng': ['c086152', 'cef0ca5', '65a912e', '9ca7464', 'd38741b', 'f56c83d', '4a031fd', '7f945ac', 'bbd135e', '9547e6c', '16beafd', 'a855802', 'd1dec2f', 'fa81122', 'beb57a5', '22eb0f4', '55885b8'], 'cat': {'Features': ['c086152', '65a912e', '9ca7464', '7f945ac', '9547e6c', 'fa81122', '22eb0f4', '55885b8'], 'Bug Fixes': ['cef0ca5', 'd38741b', '16beafd', 'a855802', 'd1dec2f', 'beb57a5'], 'Other': ['f56c83d', '4a031fd', 'bbd135e']}, 'brk': ['9ca7464', 'a855802'], 'sample': ['ea417ba|2025-04-07|Rhea Park|fix(cli): handle empty input again'], 'top': '55885b8'}

    def _sections(txt):
        out, cur = {}, None
        for ln in txt.splitlines():
            m = re.match(r"^#{2,4}\s+(.*?)\s*$", ln)
            if m: cur = m.group(1); out[cur] = []; continue
            if cur: out[cur].append(ln)
        return {k: "\n".join(v) for k, v in out.items()}
    def _hash_sections(txt, cats):
        sec = _sections(txt)
        for k, hs in cats.items():
            need(k in sec, "missing section " + k); body = sec[k]
            for h in hs: need(h in body, f"{h} missing under {k}")
            for k2, hs2 in cats.items():
                if k2 != k:
                    for h in hs2: need(h not in body, f"{h} wrongly under {k}")
    def t3():
        txt = read("CHANGELOG.md"); need(re.search(r"^##\s+v1\.2\.0", txt, re.M), "need a '## v1.2.0' heading")
        _hash_sections(txt, EXP["cat"])
    def t5():
        txt = read("CHANGELOG.md"); sec = _sections(txt); need("Breaking Changes" in sec, "missing Breaking Changes")
        for h in EXP["brk"]: need(h in sec["Breaking Changes"], h + " missing under Breaking Changes")
        need(txt.index("Breaking Changes") < txt.index("Features"), "Breaking Changes must come before Features")
        cats = {k: v for k, v in EXP["cat"].items()}
        for k, hs in cats.items():
            for h in hs: need(h in sec[k], h + " must stay under " + k)
    def t6():
        import importlib; sys.path.insert(0, str(W / "tools"))
        m = importlib.import_module("changelog")
        c = m.parse_commit("abc1234|2025-02-03|Ann Lee|feat(api)!: drop v1 routes")
        need(c.get("hash") == "abc1234" and c.get("author") == "Ann Lee" and c.get("type") == "feat" and c.get("scope") == "api" and c.get("breaking") is True and c.get("description") == "drop v1 routes", f"parse_commit wrong: {c}")
        c = m.parse_commit("def5678|2025-02-04|Bo|fix: handle empty input")
        need(c.get("scope") == "" and c.get("breaking") is False and c.get("type") == "fix", f"parse_commit plain wrong: {c}")
        c = m.parse_commit("0011223|2025-02-05|Cy|chore: tidy BREAKING CHANGE notes")
        need(c.get("breaking") is True, "BREAKING CHANGE in subject must be breaking")
        got = [x["hash"] for x in m.commits_between("v1.1.0", "v1.2.0")]
        need(got == list(reversed(EXP["rng"])), f"commits_between wrong ({len(got)} commits)")
    def t7():
        need((W / "tools/changelog.py").exists(), "missing tools/changelog.py")
        rc, out, err = run("python3 tools/changelog.py v1.1.0 v1.2.0"); need(rc == 0, "cli failed: " + err[-200:])
        need(re.search(r"^##\s+v1\.2\.0", out, re.M), "output needs a '## v1.2.0' heading")
        cats = {k: list(v) for k, v in EXP["cat"].items()}; cats["Breaking Changes"] = EXP["brk"]
        sec = _sections(out)
        for k, hs in EXP["cat"].items():
            need(k in sec, "missing section " + k)
            for h in hs: need(h in sec[k], f"{h} missing under {k}")
        need("Breaking Changes" in sec and all(h in sec["Breaking Changes"] for h in EXP["brk"]), "Breaking Changes section wrong")
    def t8():
        rc, out, err = run("python3 tools/changelog.py v9.9.9 v1.2.0"); need(rc == 2, f"unknown ref must exit 2, got {rc}")
        need(re.search(r"unknown", err, re.I) and "v9.9.9" in err, "stderr must say unknown ref and name it")
    def t9():
        rc, out, err = run("python3 tools/changelog.py v1.2.0 v1.2.0"); need(rc == 0, "empty range must exit 0")
        need(re.search(r"No changes\.", out), "stdout must say 'No changes.'")
    def t12():
        txt = read("RELEASE_NOTES.md"); need(re.search(r"^#+\s*Highlights", txt, re.M | re.I), "missing Highlights")
        nf, nb = len(EXP["cat"]["Features"]), len(EXP["cat"]["Bug Fixes"])
        need(re.search(r"(?<!\d)%d(?!\d)\s+(new\s+)?features?" % nf, txt, re.I), f"must state {nf} features")
        need(re.search(r"(?<!\d)%d(?!\d)\s+(bug\s*)?fix" % nb, txt, re.I), f"must state {nb} bug fixes")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
