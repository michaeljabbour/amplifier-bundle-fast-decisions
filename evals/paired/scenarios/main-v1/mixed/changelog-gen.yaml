    tools/changelog.py: |
      """Changelog generator: reads commits.log (newest first, `hash|date|author|subject`) and tags.txt (`tag hash`)."""
      import sys

      LOG, TAGS = "commits.log", "tags.txt"


      def load_tags(path=TAGS):
          out = {}
          for ln in open(path, encoding="utf-8"):
              if ln.strip():
                  tag, h = ln.split()
                  out[tag] = h
          return out


      def load_log(path=LOG):
          """Raw log lines, newest first."""
          return [ln.rstrip("\n") for ln in open(path, encoding="utf-8") if ln.strip()]


      def parse_commit(line):
          """Return {hash, date, author, type, scope, breaking, description} for one log line.

          Subject format: `type(scope)!: description`; scope and `!` are optional (scope -> "" when absent).
          A subject containing "BREAKING CHANGE" is also breaking.
          """
          raise NotImplementedError


      def commits_between(old, new):
          """Parsed commits after tag `old` up to and including tag `new`, newest first."""
          raise NotImplementedError


      def render(commits, name):
          """Markdown for one release section (see README.md)."""
          raise NotImplementedError


      def main(argv):
          raise NotImplementedError


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))
