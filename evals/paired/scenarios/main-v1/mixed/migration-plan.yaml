turns:
- prompt: Read docs/requirements_v2.md. Which tables are affected by the v2 schema, and how many numbered requirements does it list? Do not change
    any files.
  checks:
  - kind: keyed_facts
    all: [customers, orders, order_items, '(?<!\d)4(?!\d)|four']
- prompt: 'Look at db/seed_v1.sql: which customer emails collide when compared case-insensitively? Give the lower-cased emails. Do not change
    any files.'
  checks:
  - kind: keyed_facts
    all: [bob@example\.com, eve@example\.com]
- prompt: How many orders in the seed data belong to the customers that will be merged away (the higher id of each duplicate pair)? Do not change
    any files.
  checks:
  - kind: keyed_facts
    all: ['(?<!\d)4(?!\d)']
- prompt: Write MIGRATION_PLAN.md with level-2 sections Scope, Steps, Risks, Rollback and Verification. Steps must be a numbered list of at least
    five steps; the plan must cover duplicate emails and PRAGMA user_version.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t4
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Create migrate.py (stdlib sqlite3) taking a database path: `python3 migrate.py DB`. In this first step implement only requirements
    1 and 2 (customers split, lower-cased unique emails, merge duplicates and re-point their orders). Run it on a scratch copy built from db/schema_v1.sql
    and db/seed_v1.sql, not on anything checked in.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t5
    hidden: [_grade.py]
    timeout: 60
  gap_before_s: 420
- prompt: Extend migrate.py with requirements 3 and 4 (order_items table, orders.status with its CHECK, drop orders.items) and set PRAGMA user_version
    = 2. Keep everything in one transaction.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t6
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Make migrate.py idempotent: if the database is already at user_version 2 print `already migrated` and exit 0 without touching it.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t7
    hidden: [_grade.py]
    timeout: 60
- prompt: For the seed data, how many order_items rows does the migration produce, and which surviving customer id owns the most orders afterwards
    (and how many)? Run the migration on a scratch copy to confirm. Do not change checked-in files.
  checks:
  - kind: keyed_facts
    all: ['(?<!\d)25(?!\d)', '(?<!\d)3(?!\d)', '(?<!\d)5(?!\d)']
- prompt: 'Add a `--dry-run` flag: migrate an in-memory copy and print `dry run: nothing written` plus the lines `customers: <before> -> <after>`,
    `orders: <before> -> <after>` and `order_items: 0 -> <n>`; the database file must stay untouched.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t9
    hidden: [_grade.py]
    timeout: 60
  gap_before_s: 420
- prompt: 'Add tests/test_migrate.py (unittest, building a temporary database from db/schema_v1.sql and db/seed_v1.sql) with at least four tests:
    duplicate merge, single-word name, order_items content, idempotence or dry run. Run them.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t10
    hidden: [_grade.py]
    timeout: 60
- prompt: Update the Verification section of MIGRATION_PLAN.md with the exact expected counts for the seed data (customers, orders and order_items
    rows) and the expected user_version.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t11
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Run the migration on a scratch copy of the seed database and write out/migration_report.json with keys customers_before, customers_after,
    merged_customers (a list of {"removed": id, "kept": id}), orders, order_items and user_version.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t12
    hidden: [_grade.py]
    timeout: 60
