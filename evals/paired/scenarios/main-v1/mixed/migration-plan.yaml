    README.md: |
      # taskshop DB

      `db/schema_v1.sql` and `db/seed_v1.sql` define the current database; `docs/requirements_v2.md` describes the target schema.
    db/schema_v1.sql: |
      PRAGMA user_version = 1;
      CREATE TABLE customers (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL,
        email TEXT NOT NULL,
        created_at TEXT NOT NULL
      );
      CREATE TABLE orders (
        id INTEGER PRIMARY KEY,
        customer_id INTEGER NOT NULL REFERENCES customers(id),
        total_cents INTEGER NOT NULL,
        items TEXT NOT NULL
      );
    db/seed_v1.sql: |
