    docs/requirements_v2.md: |
      # Schema v2 requirements

      Target: SQLite, `PRAGMA user_version = 2`.

      1. **customers**: replace `name` with `first_name` and `last_name`. Split the old name at the first space; a one-word name puts the word in `first_name` and an empty string in `last_name`. Columns become `(id, first_name, last_name, email, created_at)`.
      2. **customers.email** is stored lower-cased and must be unique. Rows whose emails collide case-insensitively are one person: keep the lowest id and re-point that person's orders to it.
      3. **order_items**: new table `(order_id, sku, qty)` with primary key `(order_id, sku)`, filled from the old `orders.items` text (`sku:qty;sku:qty`, empty string means no items). `orders.items` is dropped.
      4. **orders.status**: new `TEXT NOT NULL DEFAULT 'paid'` column restricted to `paid`, `refunded` or `pending`. Existing orders become `paid`. Order columns become `(id, customer_id, total_cents, status)`.
    app/queries.py: |
      """Application queries written against schema v1."""


      def customer_name(con, cid):
          return con.execute("SELECT name FROM customers WHERE id = ?", (cid,)).fetchone()[0]


      def order_skus(con, order_id):
          raw = con.execute("SELECT items FROM orders WHERE id = ?", (order_id,)).fetchone()[0]
          return [part.split(":")[0] for part in raw.split(";") if part]
    tests/__init__.py: ''
protected: [db/schema_v1.sql, db/seed_v1.sql, docs/requirements_v2.md]
