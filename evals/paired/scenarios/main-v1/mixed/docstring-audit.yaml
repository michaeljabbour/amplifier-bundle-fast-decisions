    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = ['clamp', 'mean', 'normalize', 'chunk', 'percentile', 'round_half_up']
    import sys, importlib, ast, doctest
    def _u():
        sys.path.insert(0, str(W)); import mathx.utils as m; importlib.reload(m); return m
    def _docs():
        tree = ast.parse(read("mathx/utils.py")); return {n.name: (ast.get_docstring(n) or "") for n in tree.body if isinstance(n, ast.FunctionDef)}
    def t3():
        d = load_json("out/discrepancies.json"); need(isinstance(d, list) and 6 <= len(d) <= 8, f"expected 6-8 entries, got {len(d) if isinstance(d, list) else d}")
        for i, x in enumerate(d):
            need(isinstance(x, dict) and all(isinstance(x.get(k), str) and x[k].strip() for k in ("function", "docstring_claim", "actual_behavior")), f"entry {i} needs function, docstring_claim and actual_behavior strings")
        names = {x["function"].strip() for x in d}; need(set(EXP) <= names, f"missing: {sorted(set(EXP) - names)}")
        need(names <= set(EXP), f"unknown functions flagged (accurate docstrings are not discrepancies): {sorted(names - set(EXP))}")
    def t5():
        m = _u(); docs = _docs()
        need(m.clamp(15, 10, 0) == 10 and m.chunk([1, 2, 3], 2) == [[1, 2], [3]] and m.percentile([10, 20, 30, 40], 50) == 20 and m.round_half_up(2.5) == 2 and m.normalize([2, 4, 8]) == [0.25, 0.5, 1.0], "behaviour must not change")
        try: m.mean([]); fail("mean([]) must still raise in this step")
        except ZeroDivisionError: pass
        need(re.search(r"swap", docs["clamp"], re.I) and not re.search(r"raises ValueError", docs["clamp"], re.I), "clamp docstring")
        need("ZeroDivisionError" in docs["mean"] and "0.0" not in docs["mean"], "mean docstring")
        need(re.search(r"max", docs["normalize"], re.I) and not re.search(r"minimum and (the )?maximum", docs["normalize"], re.I), "normalize docstring")
        need(re.search(r"kept|keep|shorter|partial", docs["chunk"], re.I) and not re.search(r"dropped", docs["chunk"], re.I), "chunk docstring")
        need(re.search(r"0\s*(-|to|and)\s*100|100", docs["percentile"]) and not re.search(r"between 0 and 1\b", docs["percentile"]), "percentile docstring")
        need(re.search(r"even|banker", docs["round_half_up"], re.I) and not re.search(r"halves rounded up", docs["round_half_up"], re.I), "round_half_up docstring")
    def t6():
        docs = _docs(); need(all(">>>" in docs[f] for f in EXP), "every function needs a >>> example: " + ", ".join(f for f in EXP if ">>>" not in docs[f]))
        rc, out, err = run("python3 -m doctest mathx/utils.py"); need(rc == 0, "doctest failed: " + (out + err)[-300:])
        m = _u(); r = doctest.testmod(m, verbose=False); need(r.attempted >= 6 and r.failed == 0, f"doctest attempted={r.attempted} failed={r.failed}")
    def t7():
        m = _u(); need(m.mean([]) == 0.0 and m.mean([1, 2, 3]) == 2.0, "mean must return 0.0 for [] and still average"); docs = _docs()
        need("ZeroDivisionError" not in docs["mean"] and "0.0" in docs["mean"], "mean docstring must now say it returns 0.0")
        rc, out, err = run("python3 -m doctest mathx/utils.py"); need(rc == 0, "doctest failed after the change")
    def t9():
        m = _u(); r = m.normalize([2, 4, 8]); need(all(abs(a - b) < 1e-9 for a, b in zip(r, [0.0, 1 / 3, 1.0])) and len(r) == 3, f"normalize([2,4,8]) wrong: {r}")
        need(m.normalize([5, 5]) == [0.0, 0.0], "constant list must give zeros"); docs = _docs(); need(re.search(r"min", docs["normalize"], re.I), "normalize docstring must mention the minimum")
        rc, out, err = run("python3 -m doctest mathx/utils.py"); need(rc == 0, "doctest failed after normalize change")
    def t11():
        m = _u(); need(sorted(getattr(m, "__all__", [])) == sorted(EXP), f"__all__ wrong: {getattr(m, '__all__', None)}")
    def t12():
        p = W / "tests/test_utils.py"; need(p.exists(), "missing tests/test_utils.py"); need(len(re.findall(r"def test_", p.read_text(encoding="utf-8"))) >= 6, "need >= 6 tests")
        rc, out, err = run("python3 -m unittest discover -s tests -p 'test_utils.py' 2>&1"); need(rc == 0, "tests fail: " + out[-300:])


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
