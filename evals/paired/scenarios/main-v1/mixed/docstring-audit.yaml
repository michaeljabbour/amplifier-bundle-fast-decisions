      """Numeric helpers."""
      import math


      def clamp(x, lo, hi):
          """Clamp x into [lo, hi]. Raises ValueError if lo > hi."""
          if lo > hi:
              lo, hi = hi, lo
          return max(lo, min(x, hi))


      def mean(values):
          """Arithmetic mean. Returns 0.0 for an empty list."""
          return sum(values) / len(values)


      def normalize(values):
          """Scale values linearly to the range [0, 1] using the minimum and the maximum."""
          top = max(values)
          return [v / top for v in values]


      def chunk(seq, n):
          """Split seq into chunks of length n; a final chunk shorter than n is dropped."""
          return [seq[i:i + n] for i in range(0, len(seq), n)]


      def percentile(values, p):
          """Return the p-th percentile (p between 0 and 1) using nearest rank."""
          ordered = sorted(values)
          k = max(1, math.ceil(p / 100 * len(ordered)))
          return ordered[k - 1]


      def round_half_up(x):
          """Round to the nearest integer, with halves rounded up (2.5 -> 3)."""
          return round(x)
