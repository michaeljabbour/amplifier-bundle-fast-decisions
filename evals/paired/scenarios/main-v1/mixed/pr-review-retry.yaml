    all: [max_attempts, backoff|multipl, raise|propagat]
- prompt: patches/retry_v2.diff is a proposed rewrite of retry.py that adds `retry_on` and `max_delay`. Review it critically and list the defects,
    saying how each would show up at runtime. Do not apply it.
  checks:
  - kind: keyed_facts
    any: ['off.by.one|one (fewer|less)|max_attempts - 1|range\(1, max_attempts\)', BaseException|KeyboardInterrupt, 'returns? None|never re-?raise|swallow',
      wraps|__name__]
    min_any: 3
- prompt: 'Write out/findings.json: a JSON array of objects with keys file, line (positive integer), severity (high|medium|low), issue and suggestion,
    one per defect you found (schemas/findings.schema.json describes the shape). Use line numbers from the diff''s new file.'
