      """Retry decorator with exponential backoff."""
      import functools
      import time


      def retry(max_attempts=3, delay=1.0, backoff=2.0, sleep=time.sleep):
          """Call the wrapped function up to `max_attempts` times, sleeping `delay` (times `backoff` each round) between tries."""

          def deco(fn):
              @functools.wraps(fn)
              def wrapper(*args, **kwargs):
                  d = delay
                  for attempt in range(1, max_attempts + 1):
                      try:
                          return fn(*args, **kwargs)
                      except Exception:
                          if attempt == max_attempts:
                              raise
                          sleep(d)
                          d *= backoff

              return wrapper

          return deco
