  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'deps': {'models': [], 'storage': ['models'], 'render': [], 'commands': ['models', 'render', 'storage'], 'cli': ['commands', 'storage']}, 'mods': ['models', 'storage', 'render', 'commands', 'cli']}
    import shutil, tempfile
    def _t(*args, store="data/sample_store.json", cwd=None):
        env = dict(os.environ, TASKR_FILE=store); p = subprocess.run([sys.executable, "-m", "taskr", *args], cwd=W, env=env, capture_output=True, text=True, timeout=30); return p.returncode, p.stdout, p.stderr
    def _tmpstore():
        shutil.copy(W / "data/sample_store.json", W / "tmp_store.json"); return "tmp_store.json"
    def t4():
        txt = read("docs/ARCHITECTURE.md")
        for m in EXP["mods"]: need(re.search(r"\b%s(\.py)?\b" % m, txt), m + " not described")
    def t5():
        rows = md_rows("docs/ARCHITECTURE.md", "modules"); need(len(rows) >= 5, "need a module table under Modules")
        for m in EXP["mods"]:
            r = [r for r in rows if r and re.search(r"\b%s(\.py)?\b" % m, r[0])]; need(r, "no row for " + m); cells = r[0]; need(len(cells) >= 3, "table needs >=3 columns")
            got = {x for x in EXP["mods"] if x != m and re.search(r"\b%s(\.py)?\b" % x, cells[-1])}; need(got == set(EXP["deps"][m]), f"{m}: depends-on {sorted(got)} != {EXP['deps'][m]}")
    def t7():
        rc, out, err = _t("list", "--json"); need(rc == 0, "list --json failed: " + err[-200:])
        d = json.loads(out); need(isinstance(d, list) and len(d) == 7 and [x["id"] for x in d] == list(range(1, 8)) and d[0]["title"] == "Write spec" and d[0]["done"] is True, "list --json output wrong")
        rc, out, err = _t("list"); need(rc == 0 and "Review budget" in out, "plain list must still work")
    def t8():
        need(re.search(r"--json", read("README.md")) or re.search(r"--json", read("docs/ARCHITECTURE.md")), "document --json in README.md or docs/ARCHITECTURE.md")
    def t10():
        s = _tmpstore()
        try:
            rc, out, err = _t("remove", "2", store=s); need(rc == 0, "remove failed: " + err[-200:])
            rc, out, err = _t("list", "--json", store=s); ids = [x["id"] for x in json.loads(out)]; need(ids == [1, 3, 4, 5, 6, 7], f"ids after remove: {ids}")
            rc, out, err = _t("remove", "99", store=s); need(rc == 2 and re.search(r"no such task", err), f"unknown id must exit 2 with 'no such task' (rc={rc})")
        finally: os.remove(W / s)
    def t11():
        p = W / "tests/test_remove.py"; need(p.exists(), "missing tests/test_remove.py"); need(len(re.findall(r"def test_", p.read_text(encoding="utf-8"))) >= 3, "need >= 3 tests")
        rc, out, err = run("python3 -m unittest discover -s tests -p 'test_remove.py' 2>&1"); need(rc == 0, "tests fail: " + out[-300:])
    def t12():
        txt = read("docs/ARCHITECTURE.md"); need(re.search(r"remove", txt), "ARCHITECTURE.md must mention remove")
        m = re.search(r"^#+\s*Error handling\s*\n(.*?)(?=^#|\Z)", txt, re.M | re.S | re.I); need(m and re.search(r"remove|no such task", m.group(1), re.I), "Error handling must cover remove / unknown ids")
    def t14():
        s = _tmpstore()
        try:
            rc, out, err = _t("add", "Pay rent", "--due", "2025-05-01", store=s); need(rc == 0, "add --due failed: " + err[-200:])
            rc, out, err = _t("list", "--json", store=s); d = json.loads(out); need(d[-1]["title"] == "Pay rent" and d[-1].get("due") == "2025-05-01", "due missing in JSON")
            need(all(x.get("due") is None for x in d[:-1]), "old tasks must load with due == null")
            rc, out, err = _t("list", store=s); need(rc == 0 and "2025-05-01" in out and re.search(r"\bDUE\b", out), "text list must show a DUE column")
        finally: os.remove(W / s)
        rc, out, err = _t("list", "--json"); need(rc == 0 and len(json.loads(out)) == 7, "sample store must still load")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
