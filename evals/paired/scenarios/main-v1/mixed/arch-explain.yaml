    taskr/storage.py: |
      """JSON file persistence."""
      import json
      import os

      from .models import Task


      class StorageError(Exception):
          """The store file exists but cannot be parsed."""


      def path():
          return os.environ.get("TASKR_FILE") or os.path.expanduser("~/.taskr.json")


      def load():
          p = path()
          if not os.path.exists(p):
              return []
          try:
              with open(p, encoding="utf-8") as fh:
                  raw = json.load(fh)
          except json.JSONDecodeError as exc:
              raise StorageError(f"corrupt store: {p}") from exc
          return [Task.from_dict(d) for d in raw]


      def save(tasks):
          with open(path(), "w", encoding="utf-8") as fh:
              json.dump([t.to_dict() for t in tasks], fh, indent=2)
    taskr/models.py: |
      """Task model."""
      from dataclasses import asdict, dataclass


      @dataclass
      class Task:
          id: int
          title: str
          done: bool = False

          def to_dict(self):
              return asdict(self)

          @classmethod
          def from_dict(cls, d):
              return cls(id=d["id"], title=d["title"], done=d.get("done", False))
    taskr/render.py: |
      """Plain-text rendering."""


      def table(tasks):
          lines = [f"{'ID':>3}  {'DONE':<4}  TITLE"]
          for t in tasks:
              lines.append(f"{t.id:>3}  {'yes' if t.done else 'no':<4}  {t.title}")
          return "\n".join(lines)
    taskr/commands.py: |
      """Command implementations."""

      from . import storage
      from .models import Task
      from .render import table


      def add(title):
          tasks = storage.load()
          nid = max([t.id for t in tasks], default=0) + 1
          tasks.append(Task(nid, title))
          storage.save(tasks)
          return nid


      def list_tasks():
          return table(storage.load())


      def done(task_id):
          tasks = storage.load()
          for t in tasks:
              if t.id == task_id:
                  t.done = True
                  storage.save(tasks)
                  return
          raise LookupError(f"no such task: {task_id}")


      def stats():
          tasks = storage.load()
          n = len(tasks)
          d = sum(1 for t in tasks if t.done)
          pct = round(100 * d / n, 1) if n else 0.0
          return f"done {d}/{n} ({pct}%)"
    taskr/cli.py: |
      """Argument parsing and dispatch."""
      import argparse
      import sys

      from . import commands
      from .storage import StorageError


      def main(argv=None):
          p = argparse.ArgumentParser(prog="taskr")
          sub = p.add_subparsers(dest="cmd", required=True)
          a = sub.add_parser("add")
          a.add_argument("title")
          l = sub.add_parser("list")
          d = sub.add_parser("done")
          d.add_argument("id", type=int)
          sub.add_parser("stats")
          args = p.parse_args(argv)
          try:
              if args.cmd == "add":
                  print(f"added {commands.add(args.title)}")
              elif args.cmd == "list":
                  print(commands.list_tasks())
              elif args.cmd == "done":
                  commands.done(args.id)
                  print(f"done {args.id}")
              else:
                  print(commands.stats())
          except StorageError as exc:
              print(f"error: {exc}", file=sys.stderr)
              return 3
          except LookupError as exc:
              print(f"error: {exc}", file=sys.stderr)
              return 2
          return 0
