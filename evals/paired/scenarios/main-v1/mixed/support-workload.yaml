  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'wl': {'Mina': (22, 36.6), 'Jonas': (24, 37.4), 'Lucia': (24, 28.7), 'Tariq': (28, 25.3), 'Hana': (22, 26.7)}, 'wk': {'2025-W08': 32, '2025-W09': 29, '2025-W06': 27, '2025-W07': 32}, 'fc': 31.0, 'br': {'T0007': (9.6, 8, 'high'), 'T0012': (30.2, 24, 'medium'), 'T0014': (29.3, 24, 'medium'), 'T0017': (79.0, 72, 'low'), 'T0018': (79.4, 72, 'low'), 'T0019': (24.6, 24, 'medium'), 'T0023': (75.4, 72, 'low'), 'T0028': (11.3, 8, 'high'), 'T0030': (30.8, 24, 'medium'), 'T0032': (27.5, 24, 'medium'), 'T0038': (11.3, 8, 'high'), 'T0044': (10.1, 8, 'high'), 'T0046': (78.7, 72, 'low'), 'T0049': (28.0, 24, 'medium'), 'T0059': (25.1, 24, 'medium'), 'T0067': (10.8, 8, 'high'), 'T0069': (74.7, 72, 'low'), 'T0073': (79.7, 72, 'low'), 'T0075': (80.5, 72, 'low'), 'T0081': (8.5, 8, 'high'), 'T0082': (24.7, 24, 'medium'), 'T0092': (8.1, 8, 'high'), 'T0095': (27.9, 24, 'medium'), 'T0103': (29.0, 24, 'medium'), 'T0105': (9.3, 8, 'high'), 'T0108': (30.5, 24, 'medium'), 'T0109': (24.6, 24, 'medium'), 'T0117': (72.1, 72, 'low')}}

    def t2():
        p = W / "out/workload.csv"; need(p.exists(), "missing out/workload.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0]) == ["agent", "tickets", "avg_resolution_hours"], "bad header")
        need(sorted(r["agent"] for r in rd) == sorted(EXP["wl"]), "agents differ")
        for r in rd:
            t, a = EXP["wl"][r["agent"]]; need(int(r["tickets"]) == t and close(r["avg_resolution_hours"], a, 0.051), "bad row " + r["agent"])
    def t4():
        d = load_json("out/weekly.json"); need(d == EXP["wk"], f"weekly counts differ: {d}")
    def t5():
        d = load_json("out/forecast.json"); need(d.get("week") == "2025-W10", "week must be 2025-W10")
        need(close(d.get("forecast_tickets"), EXP["fc"], 0.051), f"forecast {d.get('forecast_tickets')} != {EXP['fc']}")
    def t7():
        p = W / "out/sla_breaches.csv"; need(p.exists(), "missing out/sla_breaches.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0]) == ["ticket_id", "priority", "hours_to_close", "limit_hours"], "bad header")
        need(sorted(r["ticket_id"] for r in rd) == sorted(EXP["br"]), "breach set differs")
        for r in rd:
            h, l, p_ = EXP["br"][r["ticket_id"]]; need(close(r["hours_to_close"], h, 0.051) and int(r["limit_hours"]) == l and r["priority"] == p_, "bad row " + r["ticket_id"])


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
