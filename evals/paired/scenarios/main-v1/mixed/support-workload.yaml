      # Support desk export

      `data/tickets.csv`: opened/closed are local timestamps (`YYYY-MM-DD HH:MM`); an empty `closed` means the ticket is still open. Open tickets count toward ticket totals but are excluded from resolution averages and SLA checks.
      ISO weeks (Monday start) are used for weekly counts.
