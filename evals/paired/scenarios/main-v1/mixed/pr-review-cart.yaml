  _buggy_cart.py: |
    """Shopping cart with exact money arithmetic."""
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")
    COUPONS = {"SAVE10": ("pct", 10), "FIVEOFF": ("flat", 5)}


    def money(value):
        """Quantize to cents using ROUND_HALF_UP."""
        return Decimal(value).quantize(CENT, rounding=ROUND_HALF_UP)


    class Cart:
        """A list of line items; all money is Decimal."""

        def __init__(self, coupons=[]):
            self.items = []
            self.coupons = coupons

        def apply_coupon(self, code):
            self.coupons.append(COUPONS[code])

        def add(self, sku, unit_price, qty=1):
            if qty <= 0:
                raise ValueError("qty must be positive")
            self.items.append((sku, money(unit_price), qty))

        def subtotal(self):
            return money(sum((p * q for _, p, q in self.items), Decimal("0")))

        def total(self, shipping=Decimal("0")):
            total = self.subtotal() + Decimal(shipping)
            for kind, value in self.coupons:
                if kind == "pct":
                    total = total * (1 - value / 100)
                else:
                    total = total - Decimal(value)
            return money(total)
