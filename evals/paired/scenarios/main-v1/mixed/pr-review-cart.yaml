      """Shopping cart with exact money arithmetic."""
      from decimal import Decimal, ROUND_HALF_UP

      CENT = Decimal("0.01")


      def money(value):
          """Quantize to cents using ROUND_HALF_UP."""
          return Decimal(value).quantize(CENT, rounding=ROUND_HALF_UP)


      class Cart:
          """A list of line items; all money is Decimal."""

          def __init__(self):
              self.items = []

          def add(self, sku, unit_price, qty=1):
              if qty <= 0:
                  raise ValueError("qty must be positive")
              self.items.append((sku, money(unit_price), qty))

          def subtotal(self):
              return money(sum((p * q for _, p, q in self.items), Decimal("0")))

          def total(self, shipping=Decimal("0")):
              return money(self.subtotal() + Decimal(shipping))
    tests/test_cart.py: |
      import unittest
      from decimal import Decimal

      from shop.cart import Cart


      class CartTests(unittest.TestCase):
          def test_subtotal(self):
              c = Cart()
              c.add("A", Decimal("2.50"), 2)
              c.add("B", Decimal("1.00"))
              self.assertEqual(c.subtotal(), Decimal("6.00"))

          def test_qty_must_be_positive(self):
              with self.assertRaises(ValueError):
                  Cart().add("A", Decimal("1.00"), 0)

          def test_total_with_shipping(self):
              c = Cart()
              c.add("A", Decimal("10.00"))
              self.assertEqual(c.total(Decimal("4.99")), Decimal("14.99"))

          def test_half_up_rounding(self):
              c = Cart()
              c.add("A", Decimal("0.125"), 1)
              self.assertEqual(c.subtotal(), Decimal("0.13"))


      if __name__ == "__main__":
          unittest.main()
