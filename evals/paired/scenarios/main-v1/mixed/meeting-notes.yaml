  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'rows': [('2025-03-24', 'Dana', 'Draft the vendor shortlist', '2025-04-02'), ('2025-03-27', 'Farah', 'Review the pricing sheet', '2025-04-04'), ('2025-04-01', 'Farah', 'Write the launch checklist', '2025-04-07'), ('2025-03-24', 'Gus', 'Book the demo room', '2025-04-09'), ('2025-04-01', 'Dana', 'Interview two customers', '2025-04-11'), ('2025-04-08', 'Gus', 'Collect security questionnaire answers', '2025-04-14'), ('2025-04-01', 'Eli', 'Prototype the onboarding flow', '2025-04-16'), ('2025-03-27', 'Dana', 'Update the risk register', '2025-04-18'), ('2025-04-08', 'Dana', 'Prepare the board update', '2025-04-23'), ('2025-04-08', 'Eli', 'Estimate migration effort', '2025-04-25')], 're': [('2025-03-24', 'Eli', 'Draft the vendor shortlist', '2025-04-02'), ('2025-03-27', 'Farah', 'Review the pricing sheet', '2025-04-04'), ('2025-04-01', 'Farah', 'Write the launch checklist', '2025-04-07'), ('2025-03-24', 'Gus', 'Book the demo room', '2025-04-09'), ('2025-04-01', 'Eli', 'Interview two customers', '2025-04-11'), ('2025-04-08', 'Gus', 'Collect security questionnaire answers', '2025-04-14'), ('2025-04-01', 'Eli', 'Prototype the onboarding flow', '2025-04-16'), ('2025-03-27', 'Eli', 'Update the risk register', '2025-04-18'), ('2025-04-08', 'Eli', 'Prepare the board update', '2025-04-23'), ('2025-04-08', 'Eli', 'Estimate migration effort', '2025-04-25')], 'by': {'Dana': [('Draft the vendor shortlist', '2025-04-02'), ('Interview two customers', '2025-04-11'), ('Update the risk register', '2025-04-18'), ('Prepare the board update', '2025-04-23')], 'Gus': [('Book the demo room', '2025-04-09'), ('Collect security questionnaire answers', '2025-04-14')], 'Farah': [('Review the pricing sheet', '2025-04-04'), ('Write the launch checklist', '2025-04-07')], 'Eli': [('Prototype the onboarding flow', '2025-04-16'), ('Estimate migration effort', '2025-04-25')]}}

    def _rows(key):
        p = W / "actions.csv"; need(p.exists(), "missing actions.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0]) == ["owner", "due", "meeting_date", "item"], "bad header")
        got = sorted((r["owner"], r["due"], r["meeting_date"], r["item"].strip()) for r in rd)
        exp = sorted((o, due, m, t) for m, o, t, due in EXP[key]); need(got == exp, f"rows differ ({len(got)} vs {len(exp)})")
        need([(r["due"], r["owner"]) for r in rd] == sorted((r["due"], r["owner"]) for r in rd), "rows must be sorted by due date then owner")
    def t2(): _rows("rows")
    def t6(): _rows("re")
    def t5():
        txt = read("actions_by_owner.md"); parts = re.split(r"^##\s+", txt, flags=re.M)[1:]
        sec = {p.split("\n", 1)[0].strip(): p for p in parts}; need(set(sec) == set(EXP["by"]), f"one section per owner needed, got {sorted(sec)}")
        for o, its in EXP["by"].items():
            for t, due in its: need(t in sec[o] and due in sec[o], f"{o}: missing {t}")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
