    cmd: python3 _grade.py t8
    hidden: [_grade.py]
    timeout: 60
- prompt: Create scripts/flag.py that applies rules R1-R4 to data/expenses.csv, reads the category limits from config/limits.json, and prints
    the flags as JSON (same list format as out/flags.json) to stdout.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t9
    hidden: [_grade.py]
    timeout: 60
  gap_before_s: 420
- prompt: Finance raised the Meals limit from 75 to 90. Update it in config/limits.json and in policy.md, then regenerate out/flags.json.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t10
    hidden: [_grade.py]
    timeout: 60
  - {kind: file_regex, path: policy.md, pattern: Meals 90}
- prompt: Compared with the 75 limit, which expense ids lost their flag because of the Meals change? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [E007, E019]
- prompt: 'Create out/summary.csv with the header rule,count,total_amount and exactly four rows (R1, R2, R3, R4, in that order): number of flags
