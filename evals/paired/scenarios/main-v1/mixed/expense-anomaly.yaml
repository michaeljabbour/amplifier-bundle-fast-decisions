  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'f3': [('E002', 'R2'), ('E007', 'R1'), ('E013', 'R3'), ('E019', 'R1'), ('E023', 'R1'), ('E031', 'R1'), ('E037', 'R1'), ('E041', 'R3'), ('E044', 'R1'), ('E058', 'R1'), ('E064', 'R2'), ('E071', 'R3')], 'f4': [('E002', 'R2'), ('E005', 'R4'), ('E007', 'R1'), ('E013', 'R3'), ('E019', 'R1'), ('E023', 'R1'), ('E027', 'R4'), ('E031', 'R1'), ('E037', 'R1'), ('E041', 'R3'), ('E044', 'R1'), ('E058', 'R1'), ('E064', 'R2'), ('E066', 'R4'), ('E071', 'R3')], 'f5': [('E002', 'R2'), ('E005', 'R4'), ('E013', 'R3'), ('E023', 'R1'), ('E027', 'R4'), ('E031', 'R1'), ('E037', 'R1'), ('E041', 'R3'), ('E044', 'R1'), ('E058', 'R1'), ('E064', 'R2'), ('E066', 'R4'), ('E071', 'R3')], 'lim90': {'Meals': 90, 'Travel': 600, 'Software': 300, 'Office': 150, 'Entertainment': 250}, 'tot3': 12, 'csv': {'R1': (5, 1834.0), 'R2': (2, 311.0), 'R3': (3, 397.0), 'R4': (3, 110.0)}}

    def _flags():
        d = load_json("out/flags.json"); need(isinstance(d, list), "flags.json must be a list")
        return sorted((x.get("id"), x.get("rule")) for x in d)

    def t2(): need(_flags() == [tuple(x) for x in EXP["f3"]], "flag set differs (R1-R3)")
    def t6(): need(_flags() == [tuple(x) for x in EXP["f4"]], "flag set differs (R1-R4)")
    def t10():
        lim = load_json("config/limits.json"); need(lim.get("Meals") == 90, "Meals limit must be 90 in config/limits.json")
        need(_flags() == [tuple(x) for x in EXP["f5"]], "flag set differs after Meals=90")
    def _rev(key):
        txt = read("review.md")
        for i, r in EXP[key]: need(i in txt, i + " missing from review.md")
        m = re.search(r"^#+\s*Summary\s*\n(.*?)(?=^#|\Z)", txt, re.M | re.S | re.I); need(m, "no Summary")
        n = len({i for i, _ in EXP[key]}); need(re.search(r"(?<!\d)%d(?!\d)" % n, m.group(1)), "distinct flagged count missing from Summary")
    def t5(): _rev("f3")
    def t8(): _rev("f4")
    def t9():
        need((W / "scripts/flag.py").exists(), "missing scripts/flag.py")
        rc, out, err = run("python3 scripts/flag.py"); need(rc == 0, "script failed " + err[-200:])
        got = sorted((x["id"], x["rule"]) for x in json.loads(out)); need(got == [tuple(x) for x in EXP["f4"]], "script output differs (limits 75)")
        lim = json.loads((W / "config/limits.json").read_text()); lim["Meals"] = 90
        (W / "config/limits.json").write_text(json.dumps(lim)); rc, out, err = run("python3 scripts/flag.py")
        need(rc == 0, "script failed after limit edit")
        got = sorted((x["id"], x["rule"]) for x in json.loads(out)); need(got == [tuple(x) for x in EXP["f5"]], "script must read config/limits.json")
    def t12():
        rows = list(csv.DictReader(open(W / "out/summary.csv", encoding="utf-8"))) if (W / "out/summary.csv").exists() else fail("missing out/summary.csv")
        need([r["rule"] for r in rows] == ["R1", "R2", "R3", "R4"], "rows must be R1..R4 in order")
        for r in rows:
            c, a = EXP["csv"][r["rule"]]; need(int(r["count"]) == c and close(r["total_amount"], a, 0.011), "bad row " + r["rule"])


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
