      # Expense audit

      `data/expenses.csv` holds March 2025 claims. `policy.md` lists the rules; per-category limits live in `config/limits.json`.
    policy.md: |
      # Expense policy

      All amounts in USD. Evaluate every row of data/expenses.csv.

      | Rule | Description |
      |---|---|
      | R1 | Amount is above the category limit in config/limits.json (Meals 75, Travel 600, Software 300, Office 150, Entertainment 250). |
      | R2 | Amount above 25 with receipt = no. |
      | R3 | Duplicate: same employee, vendor, amount and date as an earlier row; flag the later row only. |

      A row can trigger several rules; each (expense_id, rule) pair is one flag.
    config/limits.json: |
      {
        "Meals": 75,
        "Travel": 600,
        "Software": 300,
        "Office": 150,
        "Entertainment": 250
      }
