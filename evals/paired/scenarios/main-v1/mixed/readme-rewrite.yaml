    README.md: |
      unitconv
      =======

      tiny unit converter!!

      install: copy the folder. no deps.

      usage:

          from unitconv import convert
          convert(1, "lb", "kg")   # 0.5
          convert(32, "f", "c")    # 0.0

      units: m km cm mi ft kg g lb oz c f k

      if you pass something it doesnt know you get a KeyError

      tests: `python -m unittest`
    unitconv/__init__.py: |
      """unitconv."""
      from .core import convert, supported_units

      __all__ = ["convert", "supported_units"]
    unitconv/core.py: |
      """Unit conversion helpers."""

      LENGTH = {"m": 1.0, "km": 1000.0, "cm": 0.01, "mi": 1609.344, "ft": 0.3048}
      MASS = {"kg": 1.0, "g": 0.001, "lb": 0.45359237}
      TEMP = ("c", "f", "k")


      def supported_units():
          """Sorted list of every unit symbol that `convert` accepts."""
          return sorted(list(LENGTH) + list(MASS) + list(TEMP))


      def _to_kelvin(value, unit):
          if unit == "c":
              return value + 273.15
          if unit == "f":
              return (value - 32) * 5 / 9 + 273.15
          return value


      def _from_kelvin(value, unit):
          if unit == "c":
              return value - 273.15
          if unit == "f":
              return (value - 273.15) * 9 / 5 + 32
          return value


      def convert(value, src, dst):
          """Convert `value` from unit `src` to unit `dst` (both lower-case symbols of the same kind)."""
          if src in LENGTH and dst in LENGTH:
              return value * LENGTH[src] / LENGTH[dst]
          if src in MASS and dst in MASS:
              return value * MASS[src] / MASS[dst]
          if src in TEMP and dst in TEMP:
              return _from_kelvin(_to_kelvin(value, src), dst)
          raise ValueError(f"cannot convert {src} to {dst}")
    tests/test_core.py: |
      import unittest

      from unitconv import convert, supported_units


      class CoreTests(unittest.TestCase):
          def test_length(self):
              self.assertAlmostEqual(convert(1, "mi", "km"), 1.609344)

          def test_temperature(self):
              self.assertAlmostEqual(convert(100, "c", "f"), 212.0)

          def test_units_listed(self):
              self.assertIn("lb", supported_units())


      if __name__ == "__main__":
          unittest.main()
    tests/__init__.py: ''
protected: [unitconv/core.py, unitconv/__init__.py, tests/test_core.py]
