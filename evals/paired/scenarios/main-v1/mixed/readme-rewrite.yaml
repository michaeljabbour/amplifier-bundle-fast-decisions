    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'units': ['cm', 'c', 'f', 'ft', 'g', 'k', 'kg', 'km', 'lb', 'm', 'mi'], 'calls': [[1, 'mi', 'km'], [100, 'c', 'f'], [1, 'lb', 'kg'], [250, 'g', 'lb'], [0, 'k', 'c']], 'res': [1.609344, 212.0, 0.45359237, 0.5511556554621939, -273.15], 'len': {'m': 1.0, 'km': 1000.0, 'cm': 0.01, 'mi': 1609.344, 'ft': 0.3048}, 'mass': {'kg': 1.0, 'g': 0.001, 'lb': 0.45359237}}
    def t3():
        txt = read("README.md")
        for h in ("Overview", "Installation", "Quick start", "Supported units", "Errors", "Development"): need(re.search(r"^##\s+" + h, txt, re.M | re.I), "missing section " + h)
        need(len(re.findall(r"^```", txt, re.M)) >= 2, "need at least one fenced code block")
        sec = re.search(r"^##\s+Supported units\s*\n(.*?)(?=^##|\Z)", txt, re.M | re.S | re.I).group(1)
        for u in EXP["units"]: need(re.search(r"(?<![A-Za-z])%s(?![A-Za-z])" % re.escape(u), sec), f"unit {u} missing from Supported units")
        need(not re.search(r"(?<![A-Za-z])oz(?![A-Za-z])", txt), "oz is not supported and must not appear"); need("ValueError" in txt and "KeyError" not in txt, "errors section must say ValueError, never KeyError")
    def t4():
        rows = md_rows("README.md", "quick start"); got = {}
        for r in rows:
            m = re.search(r"convert\(\s*(-?[\d.]+)\s*,\s*[\"']([a-z]+)[\"']\s*,\s*[\"']([a-z]+)[\"']\s*\)", r[0]) if r else None
            if m and len(r) >= 2 and num(r[1]) is not None: got[(float(m.group(1)), m.group(2), m.group(3))] = num(r[1])
        for c, e in zip(EXP["calls"], EXP["res"]):
            k = (float(c[0]), c[1], c[2]); need(k in got, f"row for convert{tuple(c)} missing"); need(abs(got[k] - e) <= 0.00051, f"{k}: {got[k]} != {e:.4f}")
    def t6():
        txt = read("CONTRIBUTING.md")
        for h in ("Setup", "Running tests", "Style"): need(re.search(r"^##\s+" + h, txt, re.M | re.I), "missing section " + h)
        need(re.search(r"python3? -m unittest", txt), "must give the unittest command")
        rc, out, err = run("python3 -m unittest discover -s tests 2>&1"); need(rc == 0, "the documented test command does not pass")
    def t8():
        rows = md_rows("docs/units.md"); got = {r[0].strip("* `"): r for r in rows if len(r) >= 3}
        for u, f in {**EXP["len"], **EXP["mass"]}.items():
            need(u in got and num(got[u][-1]) is not None and abs(num(got[u][-1]) - f) <= 1e-9 * max(1, f), f"{u}: factor wrong or missing")
        for u in ("c", "f", "k"): need(u in got, f"temperature unit {u} missing")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
