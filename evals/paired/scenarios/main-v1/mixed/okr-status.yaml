  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'m6': {'2025-W10': (118, 52, 9, 31), '2025-W11': (131, 55, 11, 33), '2025-W12': (127, 61, 8, 36), '2025-W13': (149, 64, 12, 35), '2025-W14': (160, 68, 7, 39), '2025-W15': (172, 71, 10, 41)}, 'm7': {'2025-W10': (118, 52, 9, 31), '2025-W11': (131, 55, 11, 33), '2025-W12': (127, 61, 8, 36), '2025-W13': (149, 64, 12, 35), '2025-W14': (160, 68, 7, 39), '2025-W15': (172, 71, 10, 41), '2025-W16': (181, 77, 6, 43)}, 'prog': {'KR1': 86.0, 'KR2': 78.9, 'KR3': 82.0}, 'krs': {'KR1': ('signups', 200), 'KR2': ('activations', 90), 'KR3': ('nps', 50)}, 'latest': (172, 71, 10, 41), 'rec': ['Pending legal review', 'Vendor API rate limits'], 'on': 2}
    def _csv(key):
        p = W / "out/metrics.csv"; need(p.exists(), "missing out/metrics.csv")
        rd = list(csv.DictReader(open(p, encoding="utf-8"))); need(rd and list(rd[0]) == ["week", "signups", "activations", "churned", "nps"], "bad header")
        e = EXP[key]; need([r["week"] for r in rd] == sorted(e), f"weeks wrong: {[r['week'] for r in rd]}")
        for r in rd: need(tuple(int(r[k]) for k in ("signups", "activations", "churned", "nps")) == tuple(e[r["week"]]), "bad row " + r["week"])
    def t3(): _csv("m6")
    def t5():
        d = load_json("out/okr_progress.json"); need(set(d) == set(EXP["prog"]), f"keys must be the KR ids: {sorted(d)}")
        for k, v in EXP["prog"].items(): need(close(d[k], v, 0.051), f"{k}: {d[k]} != {v}")
    def t6():
        txt = read("status.md")
        for h in ("Highlights", "Metrics", "OKR progress", "Risks"): need(re.search(r"^##\s+" + h, txt, re.M | re.I), "missing section " + h)
        rows = md_rows("status.md", "metrics"); got = {r[0].strip("* `").lower(): num(r[-1]) for r in rows if len(r) >= 2 and num(r[-1]) is not None}
        for name, i in (("signups", 0), ("activations", 1), ("churned", 2), ("nps", 3)): need(got.get(name) == EXP["latest"][i], f"{name}: {got.get(name)} != {EXP['latest'][i]}")
    def t8():
        rows = md_rows("status.md", "okr"); got = {r[0].strip("* `"): r for r in rows if r and re.match(r"KR\d", r[0].strip("* `"))}
        for k, (m, t) in EXP["krs"].items():
            need(k in got, k + " missing from the OKR table"); need(any(re.fullmatch(r"\s*%d\s*/\s*%d\s*" % (EXP["latest"][{"signups": 0, "activations": 1, "churned": 2, "nps": 3}[m]], t), c) for c in got[k]), f"{k}: needs a 'latest / target' cell")
    def t10():
        txt = read("status.md"); m = re.search(r"^##\s+Risks\s*\n(.*?)(?=^##|\Z)", txt, re.M | re.S | re.I); need(m, "no Risks section")
        for b in EXP["rec"]: need(b.lower() in m.group(1).lower(), f"recurring blocker missing from Risks: {b}")
        need("hiring freeze" not in m.group(1).lower() and "staging" not in m.group(1).lower(), "only recurring blockers belong under Risks")
    def t11():
        txt = read("exec_email.md"); need(re.match(r"\s*Subject:", txt), "first line must be Subject:"); body = txt.split("\n", 1)[1]
        need(len(txt.split()) <= 120, "email over 120 words"); need(re.search(r"(?<!\d)%d(?!\d)" % EXP["latest"][0], body), "latest signups missing")
        need(re.search(r"(?<!\d)%d(?!\d)\s*(of|/)\s*3|(?<!\d)%d(?!\d)\s+key results" % (EXP["on"], EXP["on"]), body), "number of KRs on track missing")
    def t12():
        need((W / "status/2025-W16.md").exists(), "2025-W16.md must be moved into status/"); need(not (W / "incoming/2025-W16.md").exists(), "incoming/2025-W16.md must be moved, not copied")
        _csv("m7")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
