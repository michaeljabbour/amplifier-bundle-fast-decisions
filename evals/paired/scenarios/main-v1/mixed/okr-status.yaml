    all: [2025-W13, '(?<!\d)22(?!\d)']
- prompt: okrs.json lists three key results with targets. Write out/okr_progress.json mapping each key result id (KR1, KR2, KR3) to its progress
    in percent, 1 decimal, computed as the latest week's value for its metric divided by the target times 100.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t5
    hidden: [_grade.py]
    timeout: 60
- prompt: Write status.md with level-2 sections Highlights, Metrics, OKR progress and Risks. Under Metrics put a table of the latest week's numbers
    (metric in the first column, value in the last); under OKR progress put a table of KR id and progress percent.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t6
    hidden: [_grade.py]
    timeout: 60
- prompt: Which key results are on track, meaning progress of at least 80%? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [KR1, KR3]
- prompt: 'The execs want to see the raw numbers too: add a second table under OKR progress with the columns KR and `Latest / Target` (cells like
    `172 / 200`) for each key result.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t8
    hidden: [_grade.py]
    timeout: 60
- prompt: Which blockers show up in more than one week? List them. Do not change any files.
  checks:
  - kind: keyed_facts
    all: [Pending\ legal\ review, Vendor\ API\ rate\ limits]
- prompt: Replace the placeholder under Risks in status.md with one bullet per recurring blocker (only those, using the wording from the status
    files).
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t10
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Write exec_email.md of at most 120 words: first line `Subject: ...`, then a short body that states the latest signups and how many
    of the three key results are on track.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t11
    hidden: [_grade.py]
    timeout: 60
- prompt: 'A late submission arrived: move incoming/2025-W16.md into status/ (move, do not copy) and regenerate out/metrics.csv so it includes
    that week too.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t12
    hidden: [_grade.py]
    timeout: 60
