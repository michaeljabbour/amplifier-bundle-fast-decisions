      # bookapi

      A tiny in-memory book catalogue. Code lives in `bookapi/` (`router.py` has the route table, `handlers.py` the handlers).
    bookapi/__init__.py: ''
    bookapi/handlers.py: |
      """Request handlers: each takes (params, body) and returns (status, payload)."""

      BOOKS = {
          1: {"id": 1, "title": "Dune", "author": "Frank Herbert", "year": 1965},
          2: {"id": 2, "title": "Emma", "author": "Jane Austen", "year": 1815},
          3: {"id": 3, "title": "Persuasion", "author": "Jane Austen", "year": 1817},
      }
      _state = {"next_id": 4}


      def health(params, body):
          """Liveness probe."""
          return 200, {"status": "ok"}


      def list_books(params, body):
          """List books, optionally filtered by author."""
          items = sorted(BOOKS.values(), key=lambda b: b["id"])
          author = params.get("author")
          if author:
              items = [b for b in items if b["author"].lower() == author.lower()]
          return 200, items


      def create_book(params, body):
          """Create a book."""
          if not body or "title" not in body or "author" not in body:
              return 400, {"message": "title and author required"}
          book = {"id": _state["next_id"], "title": body["title"], "author": body["author"], "year": body.get("year")}
          BOOKS[book["id"]] = book
          _state["next_id"] += 1
          return 201, book


      def search_books(params, body):
          """Search books by title."""
          q = params.get("q", "").lower()
          if not q:
              return 400, "q is required"
          return 200, [b for b in sorted(BOOKS.values(), key=lambda b: b["id"]) if q in b["title"].lower()]


      def get_book(params, body):
          """Fetch one book by id."""
          book = BOOKS.get(int(params["id"]))
          if not book:
              return 404, "not found"
          return 200, book


      def delete_book(params, body):
          """Delete a book by id."""
          if int(params["id"]) not in BOOKS:
              return 404, "not found"
          del BOOKS[int(params["id"])]
          return 204, None


      def legacy_export(params, body):
          """Old pipe-separated export (unused)."""
          return 200, "|".join(b["title"] for b in BOOKS.values())
    bookapi/router.py: |
      """Route table and dispatcher."""
      import re
      from collections import namedtuple

      from . import handlers

      Route = namedtuple("Route", "method path handler query body ok")

      ROUTES = [
          Route("GET", "/books", handlers.list_books, ("author",), (), 200),
          Route("POST", "/books", handlers.create_book, (), ("title", "author"), 201),
          Route("GET", "/books/search", handlers.search_books, ("q",), (), 200),
          Route("GET", "/books/{id}", handlers.get_book, (), (), 200),
          Route("DELETE", "/books/{id}", handlers.delete_book, (), (), 204),
          Route("GET", "/health", handlers.health, (), (), 200),
      ]


      def _regex(path):
          return re.compile("^" + re.sub(r"\{(\w+)\}", r"(?P<\1>[^/]+)", path) + "$")


      def dispatch(method, path, query=None, body=None):
          """Find the route for (method, path) and call its handler; returns (status, payload)."""
          params = dict(query or {})
          path_matched = False
          for r in ROUTES:
              m = _regex(r.path).match(path)
              if not m:
                  continue
              if r.method == method:
                  params.update(m.groupdict())
                  return r.handler(params, body)
              path_matched = True
          return (405, "method not allowed") if path_matched else (404, "no such route")
    tests/__init__.py: ''
