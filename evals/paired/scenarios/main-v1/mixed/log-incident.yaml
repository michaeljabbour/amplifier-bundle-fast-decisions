        txt = read("postmortem.md"); m = re.search(r"^#+\s*Action items\s*\n(.*?)(?=^#|\Z)", txt, re.M | re.S | re.I); need(m, "no Action items")
        need(len(re.findall(r"^\s*[-*]\s+\S", m.group(1), re.M)) >= 3, "need at least 3 bullet action items")
        need(re.search(r"canary|rollback|alert", m.group(1), re.I), "action items should address the cause")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
