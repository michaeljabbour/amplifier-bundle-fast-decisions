hidden_files:
  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def load_json(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        try:
            return json.loads(p.read_text(encoding="utf-8"))
        except Exception as e:  # noqa: BLE001
            fail(f"{rel} is not valid JSON: {e}")


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def md_rows(rel, under=None):
        """Table rows (lists of cells) of a markdown file; with `under`, only rows inside the first heading matching it."""
        lines = read(rel).splitlines()
        if under:
            out, on, lvl = [], False, 0
            for ln in lines:
                m = re.match(r"^(#+)\s+(.*)", ln)
                if m:
                    if on and len(m.group(1)) <= lvl:
                        break
                    if not on and re.search(under, m.group(2), re.I):
                        on, lvl = True, len(m.group(1))
                    continue
                if on:
                    out.append(ln)
            lines = out
        rows = []
        for ln in lines:
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout)
        return p.returncode, p.stdout, p.stderr

    EXP = {'s1': {'total_revenue': 6597.0, 'orders_counted': 53, 'cancelled_orders': 7, 'revenue_by_region': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}}, 's2': {'total_revenue': 6597.0, 'orders_counted': 53, 'cancelled_orders': 7, 'revenue_by_region': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}, 'gross_margin_pct': 48.0}, 's3': {'total_revenue': 6597.0, 'orders_counted': 53, 'cancelled_orders': 7, 'revenue_by_region': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}, 'gross_margin_pct': 48.0, 'total_revenue_incl_extra': 7492.5}, 's4': {'total_revenue': 6597.0, 'orders_counted': 53, 'cancelled_orders': 7, 'revenue_by_region': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}, 'gross_margin_pct': 48.0, 'total_revenue_incl_extra': 7492.5, 'total_revenue_dedup': 7393.5}, 'cli': {'total_revenue': 6597.0, 'orders_counted': 53, 'cancelled_orders': 7, 'revenue_by_region': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}, 'gross_margin_pct': 48.0}, 'reg': {'North': 1476.0, 'South': 994.5, 'East': 2884.5, 'West': 1242.0}, 'months': {'2025-01': 1984.5, '2025-02': 2218.5, '2025-03': 2394.0}}

    def _summ(key, extra=()):
        d = load_json("out/summary.json"); e = EXP[key]
        for k in ("total_revenue", "orders_counted", "cancelled_orders") + tuple(extra):
            need(k in d and close(d[k], e[k], 0.051), f"{k}: {d.get(k)} != {e[k]}")
        need(isinstance(d.get("revenue_by_region"), dict), "revenue_by_region must be an object")
        for g, v in e["revenue_by_region"].items():
            need(g in d["revenue_by_region"] and close(d["revenue_by_region"][g], v, 0.051), f"region {g}")

    def t3(): _summ("s1")
    def t7(): _summ("s2", ("gross_margin_pct",))
    def t9(): _summ("s3", ("gross_margin_pct", "total_revenue_incl_extra"))
    def t11(): _summ("s4", ("gross_margin_pct", "total_revenue_incl_extra", "total_revenue_dedup"))

    def _table(under, exp):
        rows = md_rows("report.md", under); need(rows, "no table under " + under)
        got = {r[0].strip("* `"): num(r[1]) for r in rows if len(r) >= 2 and num(r[1]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, 0.051), f"{k}: {got.get(k)} != {v}")

    def t6(): _table("region", EXP["reg"])
    def t12(): _table("month", EXP["months"])

    def t13():
        need((W / "scripts/summarize.py").exists(), "missing scripts/summarize.py")
        rc, out, err = run("python3 scripts/summarize.py"); need(rc == 0, "script failed: " + err[-200:])
        try: d = json.loads(out)
        except Exception as e: fail("stdout is not JSON: " + str(e))
        e = EXP["cli"]
        for k in ("total_revenue", "orders_counted", "cancelled_orders", "gross_margin_pct"):
            need(k in d and close(d[k], e[k], 0.051), f"{k}: {d.get(k)} != {e[k]}")
        for g, v in e["revenue_by_region"].items(): need(close(d["revenue_by_region"].get(g), v, 0.051), g)

    def t15():
        txt = read("report.md"); m = re.search(r"^#+\s*Executive summary\s*\n(.*?)(?=^#|\Z)", txt, re.M | re.S | re.I)
        need(m, "no Executive summary section"); body = m.group(1)
        need(len(body.split()) <= 120, "summary over 120 words"); need(len(body.split()) >= 15, "summary too short")
        need(re.search('East', body), "top region missing")
        need(any(close(num(x), EXP["s1"]["total_revenue"], 0.51) for x in re.findall(r"\d[\d,]*\.?\d*", body)), "total revenue missing")
        need(txt.index(m.group(0)) < txt.lower().index("## overview"), "Executive summary must come first")


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn), "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
turns:
- prompt: Using data/orders.csv (revenue = qty * unit_price, cancelled orders excluded), which region has the highest total revenue, and what
    is that figure? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [East, '(?<![\d.,])2,?8,?8,?4\.50?(?!\d)']
- prompt: Which product sold the most units across non-cancelled orders in data/orders.csv, and how many units? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [Widget, '(?<!\d)90(?!\d)']
- prompt: Create out/summary.json with the keys total_revenue, orders_counted, cancelled_orders and revenue_by_region (an object keyed by region
    name). Revenue figures are numbers rounded to 2 decimals, computed from data/orders.csv with cancelled orders excluded.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t3
    hidden: [_grade.py]
    timeout: 60
- prompt: How many orders in data/orders.csv are cancelled, and what percentage of all orders is that (one decimal)? Do not change any files.
  checks:
  - kind: keyed_facts
    all: ['(?<!\d)7(?!\d)', '(?<![\d.,])11\.70?(?!\d)']
- prompt: Write report.md with level-2 sections Overview, Revenue by region, Top products and Caveats. Keep it factual and short.
  checks:
  - kind: doc_sections
    path: report.md
    headings: [Overview, Revenue by region, Top products, Caveats]
- prompt: Under the Revenue by region section of report.md add a markdown table with one row per region (region name in the first column, revenue
    in the second) using the same figures as out/summary.json.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t6
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Add a gross_margin_pct key to out/summary.json: overall gross margin in percent, rounded to 1 decimal, where margin = (revenue - cost)
    / revenue and cost = qty * unit_cost from data/products.csv, over non-cancelled orders. Keep the existing keys.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t7
    hidden: [_grade.py]
    timeout: 60
- prompt: Which product category (from data/products.csv) has the lowest gross margin percentage over non-cancelled orders, and what is it to
    one decimal? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [Hardware, '(?<![\d.,])46(?:\.0+)?(?!\d)']
- prompt: 'data/orders_extra.csv is a late export. Add total_revenue_incl_extra to out/summary.json: total revenue when every non-cancelled row
    of data/orders_extra.csv is added to the orders.csv total. Keep all existing keys unchanged.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t9
    hidden: [_grade.py]
    timeout: 60
- prompt: Do any order_id values in data/orders_extra.csv also appear in data/orders.csv? List each shared id. Do not change any files.
  checks:
  - kind: keyed_facts
    all: [A1004, A1018, A1042]
- prompt: 'Those shared ids are double counts. Add total_revenue_dedup to out/summary.json: the orders.csv total plus only the non-cancelled rows
    of data/orders_extra.csv whose order_id is not already in orders.csv. Keep every other key.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t11
    hidden: [_grade.py]
    timeout: 60
- prompt: 'Management wants a monthly view: add a level-2 section Revenue by month to report.md with a table of month (rows labelled 2025-01,
    2025-02, 2025-03) and revenue from data/orders.csv, non-cancelled orders only.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t12
    hidden: [_grade.py]
    timeout: 60
- prompt: Create scripts/summarize.py that reads data/orders.csv and data/products.csv (paths relative to the repository root) and prints to stdout
    the JSON object with total_revenue, orders_counted, cancelled_orders, revenue_by_region and gross_margin_pct. Run it to check it matches out/summary.json.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t13
    hidden: [_grade.py]
    timeout: 60
- prompt: In which month of data/orders.csv was non-cancelled revenue highest, and by what percentage (one decimal) does it exceed the lowest
    month? Do not change any files.
  checks:
  - kind: keyed_facts
    all: [2025-03, '(?<![\d.,])20\.60?(?!\d)']
- prompt: Put a level-2 section named Executive summary at the very top of report.md (before Overview), at most 120 words, stating the total revenue
    and which region led.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t15
    hidden: [_grade.py]
    timeout: 60
- prompt: Update README.md with a Usage section explaining how to run scripts/summarize.py and where report.md and out/summary.json come from.
  checks:
  - kind: doc_sections
    path: README.md
    headings: [Usage]
  - {kind: file_regex, path: README.md, pattern: scripts/summarize\.py}
  - {kind: file_regex, path: README.md, pattern: out/summary\.json}
