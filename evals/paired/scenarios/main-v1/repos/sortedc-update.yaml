    from operator import neg

    from sortedcontainers import SortedKeyList, SortedList


    def test_rmul_honours_key():
        skl = SortedKeyList([3, 2, 1], key=neg)
        assert list(2 * skl) == [3, 3, 2, 2, 1, 1]
        assert (2 * skl).key is neg


    def test_rmul_equals_mul():
        skl = SortedKeyList([(0, 'a'), (0, 'b'), (1, 'c')], key=lambda t: t[0])
        assert list(3 * skl) == list(skl * 3)
        assert type(3 * skl) is SortedKeyList


    def test_rmul_zero_and_original_untouched():
        skl = SortedKeyList([1, 2], key=neg)
        assert list(0 * skl) == []
        assert list(skl) == [2, 1]


    def test_plain_sorted_list_unchanged():
        sl = SortedList([3, 1, 2])
        assert list(2 * sl) == [1, 1, 2, 2, 3, 3]
        assert list(sl * 2) == [1, 1, 2, 2, 3, 3]
  tests/test_count_between_hidden.py: |
    from operator import neg

    from sortedcontainers import SortedKeyList, SortedList


    def test_inclusive_bounds_and_duplicates():
        sl = SortedList([1, 2, 2, 3, 5])
        assert sl.count_between(2, 3) == 3
        assert sl.count_between(1, 5) == 5
        assert sl.count_between(4, 4) == 0
        assert sl.count_between(5, 5) == 1


    def test_reversed_bounds_are_zero():
        assert SortedList([1, 2, 3]).count_between(3, 1) == 0


    def test_outside_range_and_empty():
        assert SortedList([1, 2, 3]).count_between(-10, 100) == 3
        assert SortedList().count_between(0, 1) == 0


    def test_key_list_uses_key_order():
        skl = SortedKeyList([1, 2, 3, 4], key=neg)
        assert skl.count_between(4, 2) == 3
        assert skl.count_between(2, 4) == 0
turns:
  - prompt: >-
      `SortedKeyList.update()` and `add()` disagree about the order of elements that compare equal under
      the key. With `key=lambda t: t[0]` and items like `(0, 'a')`, `(0, 'b')`, adding the items one by
      one with `add()` keeps equal-key items in insertion order (new items go after existing ones), but
      `update()` with a large enough iterable (the code path that rebuilds the list) puts the NEW items
      before the existing equal ones. The same thing happens in `SortedList.update()` for equal-comparing
      objects. `update()` must give exactly what repeated `add()` calls give. Please find the cause in
      sortedcontainers/sortedlist.py and fix it for both classes. Run the tests from this directory with
      `python3 -m pytest -q tests`.
