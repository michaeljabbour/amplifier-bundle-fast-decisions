  test_wrong_key_optional_hidden.py: |
    from pytest import raises

    from schema import And, Optional, Regex, Schema, SchemaWrongKeyError


    def test_optional_wrapped_regex_error_surfaces():
        with raises(SchemaWrongKeyError) as exc:
            Schema({Optional(Regex(r"^[A-Z]", error="must start upper")): int}).validate({"bar": 1})
        assert exc.value.code == "must start upper"


    def test_optional_wrapped_and_error_surfaces_with_valid_neighbour():
        schema = Schema({Optional(And(str, str.isupper, error="must be upper")): int})
        assert schema.validate({"FOO": 1}) == {"FOO": 1}
        with raises(SchemaWrongKeyError) as exc:
            schema.validate({"FOO": 1, "bar": 2})
        assert exc.value.code == "must be upper"


    def test_optional_without_custom_error_keeps_default():
        with raises(SchemaWrongKeyError) as exc:
            Schema({Optional(Regex(r"^[A-Z]")): int}).validate({"bar": 1})
        assert exc.value.code == "Wrong key 'bar' in {'bar': 1}"


    def test_optional_with_own_error_still_works():
        with raises(SchemaWrongKeyError) as exc:
            Schema({Optional(Regex(r"^[A-Z]"), error="optional says no"): int}).validate({"bar": 1})
        assert exc.value.code == "optional says no"
  test_wrong_keys_attr_hidden.py: |
    from pytest import raises

    from schema import Regex, Schema, SchemaWrongKeyError


    def test_attribute_filled_and_sorted():
        with raises(SchemaWrongKeyError) as exc:
            Schema({"a": int}).validate({"a": 1, "z": 2, "b": 3})
        assert exc.value.wrong_keys == ["b", "z"]


    def test_mixed_key_types_sorted_by_repr():
        with raises(SchemaWrongKeyError) as exc:
            Schema({"a": int}).validate({"a": 1, 2: 1, "b": 2})
        assert exc.value.wrong_keys == sorted([2, "b"], key=repr)


    def test_manual_construction_defaults_to_empty():
        err = SchemaWrongKeyError("msg")
        assert err.wrong_keys == []
        assert SchemaWrongKeyError("msg", None, wrong_keys=["x"]).wrong_keys == ["x"]


    def test_code_unchanged_with_custom_error():
        with raises(SchemaWrongKeyError) as exc:
            Schema({Regex(r"^[A-Z]", error="custom"): int}).validate({"A": 1, "b": 2})
        assert exc.value.code == "custom"
        assert exc.value.wrong_keys == ["b"]


    def test_default_code_unchanged():
        with raises(SchemaWrongKeyError) as exc:
            Schema({"a": int}).validate({"a": 1, "z": 2})
        assert exc.value.code == "Wrong key 'z' in {'a': 1, 'z': 2}"
