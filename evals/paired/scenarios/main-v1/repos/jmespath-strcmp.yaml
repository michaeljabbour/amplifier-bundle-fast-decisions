    import unittest

    import jmespath


    class TestMixedTypeOrdering(unittest.TestCase):
        def test_string_vs_number_is_null_not_an_error(self):
            data = {'a': 'x', 'b': 1}
            for op in ('<', '<=', '>', '>='):
                self.assertIsNone(jmespath.search('a %s b' % op, data), op)
                self.assertIsNone(jmespath.search('b %s a' % op, data), op)

        def test_numbers_and_strings_still_order(self):
            self.assertTrue(jmespath.search('a < b', {'a': 1, 'b': 2}))
            self.assertTrue(jmespath.search('a >= b', {'a': 'b', 'b': 'a'}))
            self.assertFalse(jmespath.search('a > b', {'a': 'a', 'b': 'b'}))

        def test_filter_skips_mixed_comparisons(self):
            data = [{'a': 'x'}, {'a': 5}, {'a': 9}]
            self.assertEqual(jmespath.search('[?a > `6`]', data), [{'a': 9}])
turns:
- prompt: >-
    Since jmespath 0.9.1, ordering comparisons between strings no longer work: `jmespath.search('a < b',
    {'a': '2016', 'b': '2017'})` returns None where 0.9.0 returned True. People rely on this. Find out
    why in jmespath/visitor.py and fix it. Run tests from this directory with `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
    python3 -m pytest -q tests/test_search.py` (the other test modules in tests/ are stale on this Python
    version, so ignore them).
  checks:
  - kind: tests
    runner: python
    files:
    - tests/test_search.py
    hidden:
    - tests/test_search.py
- prompt: >-
    In three to five sentences explain the root cause: which function in visitor.py decides whether an
    ordering comparison is evaluated, and what condition made string operands return None. Do not change
    any files.
  checks:
  - kind: keyed_facts
    all:
    - visit_comparator|_is_actual_number
    - string|str
    any:
    - number
    - None
    - 'null'
    - numeric
    min_any: 1
- prompt: >-
    Add a regression test file `tests/test_search_strings.py` with at least three test methods that check
    string ordering through the public `jmespath.search()` call (use `<`, `>=` and a filter expression),
    and run it.
