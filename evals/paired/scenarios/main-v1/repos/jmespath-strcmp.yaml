  - kind: file_regex
    path: tests/test_search_strings.py
    pattern: ^\s*def test_
    min_count: 3
  - kind: tests
    runner: python
    files:
    - tests/test_search_strings.py
- prompt: >-
    Edge case: after this fix, comparing a string with a number, e.g. `jmespath.search('a < b', {'a':
    'x', 'b': 1})`, raises a Python TypeError. It must return None for all four ordering operators (`<`,
    `<=`, `>`, `>=`), in either operand order, and a filter such as `[?a > `6`]` over rows with mixed
    string and number values must just skip the non-comparable rows. Numbers vs numbers and strings vs
    strings must keep working. Fix it and add a test for it to tests/test_search_strings.py.
  checks:
  - kind: file_regex
    path: tests/test_search_strings.py
    pattern: (?i)mixed|number
  - kind: tests
    runner: python
    files:
    - tests/test_search.py
    - tests/test_search_strings.py
