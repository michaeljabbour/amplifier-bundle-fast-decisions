  tests/test_ichunked_edge_hidden.py: |
    from unittest import TestCase

    import more_itertools as mi


    class IchunkedEdgeTests(TestCase):
        def test_negative_raises(self):
            with self.assertRaisesRegex(ValueError, 'n must be at least 0'):
                list(mi.ichunked('ABCDE', -1))

        def test_zero_yields_no_chunks(self):
            self.assertEqual(list(mi.ichunked('ABCDE', 0)), [])
            self.assertEqual(list(mi.ichunked([], 0)), [])

        def test_matches_chunked_for_n_zero(self):
            self.assertEqual([list(c) for c in mi.ichunked('ABC', 0)], list(mi.chunked('ABC', 0)))

        def test_normal_use_unchanged(self):
            self.assertEqual([list(c) for c in mi.ichunked('ABCDE', 2)], [['A', 'B'], ['C', 'D'], ['E']])
  tests/test_chunked_drop_last_hidden.py: |
    from unittest import TestCase

    import more_itertools as mi


    class DropLastTests(TestCase):
        def test_short_tail_dropped(self):
            self.assertEqual(list(mi.chunked('ABCDEFG', 3, drop_last=True)), [['A', 'B', 'C'], ['D', 'E', 'F']])

        def test_exact_multiple_unchanged(self):
            self.assertEqual(list(mi.chunked('ABCDEF', 3, drop_last=True)), [['A', 'B', 'C'], ['D', 'E', 'F']])

        def test_shorter_than_n_yields_nothing(self):
            self.assertEqual(list(mi.chunked('AB', 3, drop_last=True)), [])

        def test_none_keeps_single_chunk(self):
            self.assertEqual(list(mi.chunked('ABC', None, drop_last=True)), [['A', 'B', 'C']])

        def test_strict_and_drop_last_conflict_at_call_time(self):
            with self.assertRaisesRegex(ValueError, 'mutually exclusive'):
                mi.chunked('ABC', 2, strict=True, drop_last=True)

        def test_default_keeps_tail(self):
            self.assertEqual(list(mi.chunked('ABCDEFG', 3)), [['A', 'B', 'C'], ['D', 'E', 'F'], ['G']])
