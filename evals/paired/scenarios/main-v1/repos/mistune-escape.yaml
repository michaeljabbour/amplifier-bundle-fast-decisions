  tests/test_shared_renderer_hidden.py: |
    import mistune


    def test_caller_renderer_is_not_mutated():
        r = mistune.HTMLRenderer(escape=True)
        unescaped = mistune.create_markdown(renderer=r, escape=False)
        assert unescaped("<b>hi</b>").strip() == "<p><b>hi</b></p>"
        again = mistune.create_markdown(renderer=r)
        assert again("<b>hi</b>").strip() == "<p>&lt;b&gt;hi&lt;/b&gt;</p>"


    def test_other_settings_survive_the_copy():
        class Marked(mistune.HTMLRenderer):
            def paragraph(self, text):
                return "[" + text + "]"

        r = Marked(escape=True)
        md = mistune.create_markdown(renderer=r, escape=False)
        assert md("<b>x</b>").strip() == "[<b>x</b>]"
        assert mistune.create_markdown(renderer=r)("<b>x</b>").strip() == "[&lt;b&gt;x&lt;/b&gt;]"


    def test_same_flag_returns_working_instance():
        r = mistune.HTMLRenderer(escape=False)
        assert mistune.create_markdown(renderer=r, escape=False)("<i>a</i>").strip() == "<p><i>a</i></p>"
  tests/test_allow_harmful_hidden.py: |
    import mistune

    LINK = "[x](javascript:alert(1))"


    def test_default_blocks_harmful_protocol():
        assert 'href="#harmful-link"' in mistune.create_markdown()(LINK)


    def test_true_allows_it_for_built_renderer():
        assert 'href="javascript:alert(1)"' in mistune.create_markdown(allow_harmful_protocols=True)(LINK)


    def test_list_allows_only_listed_protocols():
        md = mistune.create_markdown(allow_harmful_protocols=["javascript:"])
        out = md(LINK + " [y](vbscript:z)")
        assert 'href="javascript:alert(1)"' in out and 'href="#harmful-link"' in out


    def test_applies_to_instance_copy():
        r = mistune.HTMLRenderer()
        md = mistune.create_markdown(renderer=r, allow_harmful_protocols=True)
        assert 'href="javascript:alert(1)"' in md(LINK)
        assert 'href="#harmful-link"' in mistune.create_markdown(renderer=r)(LINK)


    def test_none_keeps_instance_setting():
        r = mistune.HTMLRenderer(allow_harmful_protocols=True)
        assert 'href="javascript:alert(1)"' in mistune.create_markdown(renderer=r)(LINK)
