    import unittest

    from lark import Tree
    from lark.tree_templates import Template, translate


    def var(name):
        return Tree('var', ['$' + name])


    class RepeatedVariableTests(unittest.TestCase):
        def setUp(self):
            self.template = Template(Tree('add', [var('x'), var('x')]))

        def test_equal_subtrees_match(self):
            tree = Tree('add', [Tree('a', []), Tree('a', [])])
            self.assertEqual(self.template.match(tree), {'x': Tree('a', [])})

        def test_different_subtrees_do_not_match(self):
            self.assertIsNone(self.template.match(Tree('add', [Tree('a', []), Tree('b', [])])))

        def test_nested_equal_subtrees(self):
            sub = Tree('mul', [Tree('c', []), Tree('d', [])])
            self.assertEqual(self.template.match(Tree('add', [sub, Tree('mul', [Tree('c', []), Tree('d', [])])])), {'x': sub})

        def test_distinct_variables_still_match_anything(self):
            t = Template(Tree('add', [var('x'), var('y')]))
            self.assertEqual(t.match(Tree('add', [Tree('a', []), Tree('b', [])])), {'x': Tree('a', []), 'y': Tree('b', [])})

        def test_search_and_translate_respect_it(self):
            tree = Tree('r', [Tree('add', [Tree('a', []), Tree('a', [])]), Tree('add', [Tree('a', []), Tree('b', [])])])
            self.assertEqual(len(list(self.template.search(tree))), 1)
            out = translate(self.template, Template(Tree('double', [var('x')])), tree)
            self.assertEqual(out, Tree('r', [Tree('double', [Tree('a', [])]), Tree('add', [Tree('a', []), Tree('b', [])])]))
  tests/test_template_count_hidden.py: |
    import unittest

    from lark import Tree
    from lark.tree_templates import Template


    class CountTests(unittest.TestCase):
        def test_count_variable_free(self):
            tree = Tree('r', [Tree('a', []), Tree('b', [Tree('a', [])])])
            self.assertEqual(Template(Tree('a', [])).count(tree), 2)

        def test_count_with_variables(self):
            tree = Tree('r', [Tree('f', [Tree('a', [])]), Tree('g', [Tree('f', [Tree('b', [])])])])
            self.assertEqual(Template(Tree('f', [Tree('var', ['$x'])])).count(tree), 2)

        def test_count_zero_is_int(self):
            n = Template(Tree('nope', [])).count(Tree('r', []))
            self.assertEqual(n, 0)
            self.assertIsInstance(n, int)

        def test_count_matches_search(self):
            tree = Tree('r', [Tree('a', []), Tree('a', [])])
            t = Template(Tree('a', []))
            self.assertEqual(t.count(tree), len(list(t.search(tree))))
