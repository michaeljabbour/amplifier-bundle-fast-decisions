    import pytest

    from toolz import take_nth


    def test_zero_raises_at_call_time():
        with pytest.raises(ValueError, match='n must be a positive integer'):
            take_nth(0, [1, 2, 3])


    def test_negative_raises():
        with pytest.raises(ValueError, match='n must be a positive integer'):
            take_nth(-2, iter([1, 2, 3]))


    def test_positive_unchanged():
        assert list(take_nth(2, [10, 20, 30, 40, 50])) == [10, 30, 50]
        assert list(take_nth(1, 'abc')) == ['a', 'b', 'c']
        assert list(take_nth(5, [])) == []
  toolz/tests/test_interpose_trailing_hidden.py: |
    import itertools

    import toolz
    from toolz import interpose
    from toolz.curried import interpose as cinterpose


    def test_trailing_separator():
        assert list(interpose('a', [1, 2, 3], trailing=True)) == [1, 'a', 2, 'a', 3, 'a']


    def test_trailing_edge_cases():
        assert list(interpose('a', [], trailing=True)) == []
        assert list(interpose('a', [1], trailing=True)) == [1, 'a']


    def test_trailing_is_lazy():
        out = interpose('-', itertools.count(), trailing=True)
        assert list(itertools.islice(out, 5)) == [0, '-', 1, '-', 2]


    def test_default_and_curried_unchanged():
        assert list(interpose('a', [1, 2, 3])) == [1, 'a', 2, 'a', 3]
        assert list(cinterpose('a')([1, 2])) == [1, 'a', 2]
        assert list(toolz.interpose('a', [1, 2], trailing=False)) == [1, 'a', 2]
