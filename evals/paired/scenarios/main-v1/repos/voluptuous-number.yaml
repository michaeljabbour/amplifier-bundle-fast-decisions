    import pytest

    from voluptuous import MultipleInvalid, Number, Schema


    def test_positive_exponent_counts_trailing_zeros():
        assert Schema(Number(precision=3, scale=0))("1E+2") == "1E+2"
        assert Schema(Number(precision=4, scale=0))("12e2") == "12e2"


    def test_positive_exponent_wrong_precision_still_rejected():
        with pytest.raises(MultipleInvalid) as exc:
            Schema(Number(precision=1, scale=0))("1E+2")
        assert "Precision must be equal to 1" in str(exc.value)


    def test_scale_is_never_negative():
        with pytest.raises(MultipleInvalid) as exc:
            Schema(Number(scale=1))("1E+2")
        assert "Scale must be equal to 1" in str(exc.value)
        assert Schema(Number(scale=0))("1E+2") == "1E+2"


    def test_ordinary_numbers_unchanged():
        assert Schema(Number(precision=6, scale=2))("1234.01") == "1234.01"
        assert Schema(Number(precision=2, scale=3))("1.5E-2") == "1.5E-2"
        assert Schema(Number(precision=3, scale=0))("100") == "100"
  voluptuous/tests/test_number_yield_float_hidden.py: |
    import pytest

    from voluptuous import Invalid, MultipleInvalid, Number, Schema


    def test_yield_float_returns_float():
        out = Schema(Number(precision=6, scale=2, yield_float=True))("1234.01")
        assert out == 1234.01 and isinstance(out, float)


    def test_yield_float_still_validates():
        with pytest.raises(MultipleInvalid):
            Schema(Number(precision=6, scale=2, yield_float=True))("12.3")
        with pytest.raises(MultipleInvalid):
            Schema(Number(precision=6, scale=2, yield_float=True))("Infinity")


    def test_both_yield_flags_conflict():
        with pytest.raises(ValueError, match="mutually exclusive"):
            Number(yield_decimal=True, yield_float=True)


    def test_defaults_unchanged():
        assert Schema(Number(precision=6, scale=2))("1234.01") == "1234.01"
        from decimal import Decimal
        assert Schema(Number(precision=6, scale=2, yield_decimal=True))("1234.01") == Decimal("1234.01")


    def test_validator_called_directly():
        assert Number(yield_float=True)("2.5") == 2.5
