    import os
    import pathlib
    import unittest

    from pathspec import PathSpec


    class BytesPathsTest(unittest.TestCase):
    	def setUp(self):
    		self.spec = PathSpec.from_lines('gitwildmatch', ['*.txt'])

    	def test_match_file_bytes(self):
    		self.assertIs(self.spec.match_file(b'a.txt'), True)
    		self.assertIs(self.spec.match_file(b'src/a.py'), False)

    	def test_match_file_bytes_nested_and_leading_slash(self):
    		self.assertIs(self.spec.match_file(b'/dir/b.txt'), True)

    	def test_match_files_yields_originals(self):
    		files = [b'a.txt', b'b.py', 'c.txt', pathlib.PurePosixPath('d.txt')]
    		self.assertEqual(list(self.spec.match_files(files)), [b'a.txt', 'c.txt', pathlib.PurePosixPath('d.txt')])

    	def test_non_path_still_type_error(self):
    		for bad in (None, 3):
    			with self.assertRaises(TypeError):
    				self.spec.match_file(bad)

    	def test_fsencoded_roundtrip(self):
    		self.assertIs(self.spec.match_file(os.fsencode('sub/x.txt')), True)
  tests/test_partition_hidden.py: |
    import pathlib
    import unittest

    from pathspec import PathSpec


    class PartitionTest(unittest.TestCase):
    	def test_partition_keeps_order(self):
    		spec = PathSpec.from_lines('gitwildmatch', ['*.txt', '!keep.txt'])
    		matched, unmatched = spec.partition(['b.txt', 'a.py', 'keep.txt', 'c.txt', 'd.md'])
    		self.assertEqual(matched, ['b.txt', 'c.txt'])
    		self.assertEqual(unmatched, ['a.py', 'keep.txt', 'd.md'])

    	def test_partition_returns_lists_and_originals(self):
    		spec = PathSpec.from_lines('gitwildmatch', ['*.txt'])
    		p = pathlib.PurePosixPath('x.txt')
    		matched, unmatched = spec.partition(iter([p, b'y.py']))
    		self.assertIsInstance(matched, list)
    		self.assertIsInstance(unmatched, list)
    		self.assertEqual(matched, [p])
    		self.assertEqual(unmatched, [b'y.py'])

    	def test_partition_empty(self):
    		self.assertEqual(PathSpec([]).partition([]), ([], []))
    		self.assertEqual(PathSpec([]).partition(['a']), ([], ['a']))
