  tests/test_syntax/extensions/test_toc_hidden_edge.py: |
    from markdown.test_tools import TestCase
    from markdown.extensions.toc import TocExtension


    class TestTocClassEdge(TestCase):

        def test_empty_toc_class_omits_the_attribute(self):
            self.assertMarkdownRenders(
                '[TOC]\n# Header',
                '<div>\n<ul>\n<li><a href="#header">Header</a></li>\n</ul>\n</div>\n<h1 id="header">Header</h1>',
                extensions=[TocExtension(toc_class='')]
            )

        def test_default_class_is_unchanged(self):
            self.assertMarkdownRenders(
                '[TOC]\n# Header',
                '<div class="toc">\n<ul>\n<li><a href="#header">Header</a></li>\n</ul>\n</div>\n<h1 id="header">Header</h1>',
                extensions=[TocExtension()]
            )
turns:
- prompt: >-
    The Table of Contents extension (`markdown/extensions/toc.py`) always wraps the generated table in
    `<div class="toc">`. Add a configuration option `toc_class` (default `toc`) so users can choose the
    CSS class(es) of that div, for example `TocExtension(toc_class='custom1 custom2')` renders `<div class="custom1
    custom2">`. Run tests from this directory with `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest
    -q tests/test_syntax/extensions/test_toc.py` (the full tests/ tree has an unrelated collection error
    on this Python version).
  checks:
  - kind: tests
    runner: python
    files:
    - tests/test_syntax/extensions/test_toc.py
    hidden:
    - tests/test_syntax/extensions/test_toc.py
- prompt: >-
    In three to five sentences explain how the new option travels from the user to the rendered HTML:
    which class declares the default, where the value is read and stored, and which method uses it. Do
    not change any files.
  checks:
