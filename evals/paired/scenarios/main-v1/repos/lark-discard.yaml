    import copy
    import unittest

    from lark import Discard, Token, Tree, Transformer
    from lark.visitors import Transformer_InPlace, Transformer_InPlaceRecursive, Transformer_NonRecursive

    BASES = (Transformer, Transformer_InPlace, Transformer_NonRecursive, Transformer_InPlaceRecursive)


    class RootDiscardTests(unittest.TestCase):
        def test_root_discard_is_none_everywhere(self):
            for base in BASES:
                class T(base):
                    def drop(self, children):
                        return Discard

                for tree in (Tree('drop', []), Tree('drop', [Tree('a', []), Token('T', 'x')])):
                    with self.subTest(base=base.__name__):
                        self.assertIsNone(T().transform(copy.deepcopy(tree)))

        def test_in_place_does_not_leak_marker(self):
            class T(Transformer_InPlace):
                def drop(self, children):
                    return Discard

            self.assertIsNot(T().transform(Tree('drop', [])), Discard)

        def test_non_root_behaviour_unchanged(self):
            class T(Transformer_InPlace):
                def drop(self, children):
                    return Discard

            out = T().transform(Tree('s', [Tree('a', []), Tree('drop', [])]))
            self.assertEqual(out, Tree('s', [Tree('a', [])]))
            class U(Transformer_InPlace):
                def s(self, children):
                    return len(children)

            self.assertEqual(U().transform(Tree('s', [Tree('a', []), Tree('b', [])])), 2)
  tests/test_tree_depth_hidden.py: |
    import unittest

    from lark import Token, Tree


    class DepthTests(unittest.TestCase):
        def test_leaf_tree(self):
            self.assertEqual(Tree('a', []).depth(), 1)
            self.assertEqual(Tree('a', [Token('T', 'x'), Token('U', 'y')]).depth(), 1)

        def test_nested(self):
            self.assertEqual(Tree('a', [Tree('b', [Tree('c', [])])]).depth(), 3)

        def test_uses_longest_branch(self):
            t = Tree('r', [Tree('a', []), Tree('b', [Tree('c', [Tree('d', [])])]), Token('T', 'x')])
            self.assertEqual(t.depth(), 4)

        def test_very_deep_chain_is_not_recursive(self):
            t = Tree('a', [])
            for _ in range(19999):
                t = Tree('a', [t])
            self.assertEqual(t.depth(), 20000)
