hidden_files:
  test/test_output.py:
    from_git:
      repo: https://github.com/astanin/python-tabulate.git
      sha: 8014ec66820c89307005b26f878119baa5bf6932
      path: test/test_output.py
      local_hint: ~/dev/afast-paired-src/python-tabulate
  test/test_pipe_escape_hidden.py: |
    from tabulate import tabulate


    def test_github_escapes_pipe_in_cells_and_headers():
        out = tabulate([["a|b", 1]], ["x|y", "n"], tablefmt="github")
        assert out == "\n".join([
            "| x\\|y   |   n |",
            "|:------|----:|",
            "| a\\|b   |   1 |",
        ])


    def test_pipe_format_escapes_too():
        assert tabulate([["a|b"]], tablefmt="pipe") == "\n".join(["|:----|", "| a\\|b |"])


    def test_plain_text_without_pipes_unchanged():
        out = tabulate([["spam", 1]], ["item", "qty"], tablefmt="github")
        assert out == "\n".join(["| item   |   qty |", "|:-------|------:|", "| spam   |     1 |"])


    def test_other_formats_not_escaped():
        assert "\\|" not in tabulate([["a|b", 1]], ["x|y", "n"], tablefmt="orgtbl")
        assert "\\|" not in tabulate([["a|b", 1]], ["x|y", "n"], tablefmt="simple")
  test/test_gfm_hidden.py: |
    from tabulate import tabulate, tabulate_formats

    ROWS = [["a|b", 1], ["line1\nline2", 22.5]]


    def test_gfm_is_listed():
        assert "gfm" in tabulate_formats
        assert "github" in tabulate_formats


    def test_gfm_equals_github():
        for kwargs in ({}, {"colalign": ("center", "right")}, {"headers": ["h1", "h2"]}):
            assert tabulate(ROWS, tablefmt="gfm", **kwargs) == tabulate(ROWS, tablefmt="github", **kwargs)


    def test_gfm_multiline_uses_multiline_path():
        out = tabulate([["line1\nline2", 1]], ["x", "n"], tablefmt="gfm")
        assert "line1" in out and "line2" in out
        assert len(out.splitlines()) == 4
turns:
  - prompt: >-
      `tablefmt="github"` loses the column alignment: for a table with a text column and a number column
      it prints the separator row as `|-----------|-----------|`, so GitHub renders every column
      left-aligned, although numbers are right-aligned in the cell text. The `pipe` format already emits
      the alignment colons (`|:----------|----------:|`) and GitHub Flavored Markdown understands them.
      `github` should produce the same separator row as `pipe` (also with an explicit `colalign`, in
      headerless tables and with multiline cells). Please find the cause in tabulate/__init__.py and fix
      it. Run the tests from this directory with `python3 -m pytest -q test`.
    checks:
      - {kind: tests, runner: python, files: [test, test/test_output.py], restore: [test/common.py, test/test_api.py, test/test_cli.py, test/test_grapheme_clusters.py, test/test_input.py, test/test_internal.py, test/test_output.py, test/test_regression.py, test/test_textwrapper.py], hidden: [test/test_output.py]}
  - prompt: >-
      In three to five sentences explain the root cause: how the "github" and "pipe" entries of
      `_table_formats` differed, and which helper produces the colons. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [github, pipe, _pipe_line_with_colons|colons], any: [Line\(|linebelowheader|lineabove, TableFormat]}
  - prompt: >-
      Add a regression test file `test/test_github_alignment.py` (pytest style, plain asserts) with at
      least three test functions: a text and a number column (colons on both sides as appropriate), an
      explicit `colalign=("center", "right")`, and `github` output being identical to `pipe` output for
      the same input. Run it.
    checks:
      - {kind: file_regex, path: test/test_github_alignment.py, pattern: ^\s*def test_, min_count: 3}
      - {kind: tests, runner: python, files: [test/test_github_alignment.py]}
  - prompt: >-
      Now cells and headers containing a literal pipe. `tabulate([['a|b', 1]], ['x|y', 'n'],
      tablefmt='github')` emits the `|` unescaped, which breaks the table in Markdown. For the `github`
      and `pipe` formats a literal `|` in a header or cell must be written as `\|`. Padding and the
      separator row are still computed from the original text (so the row with the escaped cell is simply
      one character longer per escaped pipe); the column delimiters themselves stay `|`. Other formats
      must be unaffected. Fix it and add a test to test/test_github_alignment.py.
    checks:
      - {kind: tests, runner: python, files: [test/test_pipe_escape_hidden.py], restore: [test/common.py, test/test_api.py, test/test_cli.py, test/test_grapheme_clusters.py, test/test_input.py, test/test_internal.py, test/test_output.py, test/test_regression.py, test/test_textwrapper.py], hidden: [test/test_pipe_escape_hidden.py]}
      - {kind: tests, runner: python, files: [test, test/test_output.py, test/test_pipe_escape_hidden.py], restore: [test/common.py, test/test_api.py, test/test_cli.py, test/test_grapheme_clusters.py, test/test_input.py, test/test_internal.py, test/test_output.py, test/test_regression.py, test/test_textwrapper.py], hidden: [test/test_output.py, test/test_pipe_escape_hidden.py]}
      - {kind: file_regex, path: test/test_github_alignment.py, pattern: a\\\\\|b}
  - prompt: >-
      Quick question about this library: when I don't pass `numalign`/`stralign`, which alignment does
      each kind of column get for the normal formats, and how do numbers with decimals line up? Answer
      from the code. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [numalign, stralign], any: [decimal, left, right]}
  - prompt: >-
      README.md still says the `github` format corresponds to `pipe` "without alignment colons" and shows
      a separator row without colons. Fix that paragraph (the sentence should say it corresponds to the
      `pipe` format with the same alignment colons) and the example output below it.
    checks:
      - {kind: file_regex, path: README.md, pattern: without alignment colons, absent: true}
      - {kind: file_regex, path: README.md, pattern: same alignment colons}
  - prompt: >-
      Small feature: add `gfm` as another name for the `github` format. `tabulate(..., tablefmt="gfm")`
      must give exactly the same output as `github` (including multiline cells and escaping), `"gfm"` must
