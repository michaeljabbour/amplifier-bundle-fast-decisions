      - {kind: tests, runner: python, files: [test, test/test_output.py, test/test_pipe_escape_hidden.py, test/test_gfm_hidden.py], restore: [test/common.py, test/test_api.py, test/test_cli.py, test/test_grapheme_clusters.py, test/test_input.py, test/test_internal.py, test/test_output.py, test/test_regression.py, test/test_textwrapper.py], hidden: [test/test_output.py, test/test_pipe_escape_hidden.py, test/test_gfm_hidden.py]}
