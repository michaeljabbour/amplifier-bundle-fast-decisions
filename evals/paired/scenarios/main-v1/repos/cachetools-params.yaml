    import unittest

    import cachetools.func


    class NegativeMaxsizeTest(unittest.TestCase):

        def test_negative_maxsize_is_clamped_like_functools(self):
            for deco in (cachetools.func.lfu_cache, cachetools.func.lru_cache,
                         cachetools.func.rr_cache, cachetools.func.ttl_cache):
                cached = deco(maxsize=-5)(lambda n: n)
                self.assertEqual(cached.cache_parameters(), {'maxsize': 0, 'typed': False})
                self.assertEqual(cached.cache_info(), (0, 0, 0, 0))
                self.assertEqual(cached(1), 1)
                self.assertEqual(cached.cache_info(), (0, 1, 0, 0))

        def test_zero_and_none_are_unchanged(self):
            self.assertEqual(cachetools.func.lru_cache(maxsize=0)(len).cache_parameters()['maxsize'], 0)
            self.assertIsNone(cachetools.func.ttl_cache(maxsize=None)(len).cache_parameters()['maxsize'])
