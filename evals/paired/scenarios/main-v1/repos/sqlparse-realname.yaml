    import sqlparse
    from sqlparse import sql


    def _ident(query):
        stmt = sqlparse.parse(query)[0]
        return next(t for t in stmt.tokens if isinstance(t, sql.Identifier))


    def test_spaced_dots_have_no_alias():
        ident = _ident("select a . b . c from t")
        assert ident.get_alias() is None
        assert ident.get_real_name() == 'c'
        assert ident.get_parent_name() == 'a'


    def test_spaced_dots_with_real_alias():
        ident = _ident("select a . b . c x from t")
        assert ident.get_alias() == 'x'
        assert ident.get_real_name() == 'c'


    def test_spaced_dots_with_as_alias():
        ident = _ident("select a . b as z from t")
        assert ident.get_alias() == 'z'
        assert ident.get_real_name() == 'b'


    def test_plain_dotted_name_still_has_no_alias():
        assert _ident("select a.b.c from t").get_alias() is None
        assert _ident("select a.b.c y from t").get_alias() == 'y'
  tests/test_name_parts_hidden.py: |
    import sqlparse
    from sqlparse import sql


    def _ident(query):
        stmt = sqlparse.parse(query)[0]
        return next(t for t in stmt.tokens if isinstance(t, sql.Identifier))


    def test_dotted_parts():
        assert _ident("select db.schema.tbl.col from t").get_name_parts() == ['db', 'schema', 'tbl', 'col']


    def test_quoted_parts():
        assert _ident('select "a"."b" from t').get_name_parts() == ['a', 'b']


    def test_wildcard_and_plain():
        assert _ident("select t.* from t").get_name_parts() == ['t', '*']
        assert _ident("select x from t").get_name_parts() == ['x']


    def test_spaced_and_alias_excluded():
        assert _ident("select a . b from t").get_name_parts() == ['a', 'b']
        assert _ident("select a.b AS z from t").get_name_parts() == ['a', 'b']
        assert _ident("select a.b z from t").get_name_parts() == ['a', 'b']
turns:
  - prompt: >-
      sqlparse returns the wrong object name for fully-qualified identifiers with more than two parts. For
      `ident = sqlparse.parse("db.schema.tbl.col")[0].tokens[0]`, `ident.get_real_name()` gives 'schema',
      but it should be 'col' (the component after the last dot) and `get_name()` should agree. For
      two-part names like `a.b` it is fine, and `get_parent_name()` should keep returning the first
      component ('db'). An aliased name like `x.y.z AS w` must give real name 'z' and alias 'w'. Please
      find the cause in sqlparse/sql.py and fix it. Run the tests from this directory with `python3 -m
      pytest -q tests`.
