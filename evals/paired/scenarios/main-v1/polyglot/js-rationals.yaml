      - {kind: tests, runner: cmd, cmd: sed "s#from './rational-numbers'#from './rational-numbers.js'#" rational-numbers.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_zero.test.mjs, expect_regex: '# fail 0', restore: [rational-numbers.spec.js], hidden: [jest_shim.mjs, hidden_zero.test.mjs], timeout: 120}
  - prompt: >-
      Add a `toString()` method that prints the reduced fraction as `n/d` ("1/2", "-3/4"); when the
      reduced denominator is 1 it prints just the integer ("2", "0"), and the sign is always on the
      numerator.
    gap_before_s: 420
    checks:
      - {kind: tests, runner: cmd, cmd: sed "s#from './rational-numbers'#from './rational-numbers.js'#" rational-numbers.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_zero.test.mjs hidden_string.test.mjs, expect_regex: '# fail 0', restore: [rational-numbers.spec.js], hidden: [jest_shim.mjs, hidden_zero.test.mjs, hidden_string.test.mjs], timeout: 120}
  - prompt: >-
      Add a static `Rational.fromString(text)`: it accepts an optionally negative integer numerator,
