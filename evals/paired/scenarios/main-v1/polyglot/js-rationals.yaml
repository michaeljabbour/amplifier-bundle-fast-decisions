      - {kind: tests, runner: cmd, cmd: sed "s#from './rational-numbers'#from './rational-numbers.js'#" rational-numbers.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_zero.test.mjs hidden_string.test.mjs hidden_fromstring.test.mjs, expect_regex: '# fail 0', restore: [rational-numbers.spec.js], hidden: [jest_shim.mjs, hidden_zero.test.mjs, hidden_string.test.mjs, hidden_fromstring.test.mjs], timeout: 120}
  - prompt: >-
