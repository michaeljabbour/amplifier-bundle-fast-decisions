    package dominoes

    import "testing"

    func TestHdSingleStoneDoesNotAliasInput(t *testing.T) {
        input := []Domino{{1, 1}}
        chain, ok := MakeChain(input)
        if !ok || len(chain) != 1 {
            t.Fatalf("MakeChain(%v) = %v, %v", input, chain, ok)
        }
        chain[0][0] = 9
        if input[0] != (Domino{1, 1}) {
            t.Fatalf("input was modified through the result: %v", input)
        }
    }

    func TestHdInputIsNotModified(t *testing.T) {
        input := []Domino{{1, 2}, {3, 1}, {2, 3}}
        want := []Domino{{1, 2}, {3, 1}, {2, 3}}
        chain, ok := MakeChain(input)
        if !ok {
            t.Fatal("expected a chain")
        }
        if len(chain) > 0 {
            chain[0] = Domino{7, 7}
        }
        for i := range input {
            if input[i] != want[i] {
                t.Fatalf("input changed: %v", input)
            }
        }
    }

    func TestHdEmptyResultIsNotNil(t *testing.T) {
        for _, in := range [][]Domino{nil, {}} {
            chain, ok := MakeChain(in)
            if !ok || chain == nil || len(chain) != 0 {
                t.Fatalf("MakeChain(%v) = %#v, %v; want empty non-nil chain and true", in, chain, ok)
            }
        }
    }

    func TestHdDuplicateStones(t *testing.T) {
        input := []Domino{{1, 2}, {1, 2}}
        chain, ok := MakeChain(input)
        if !ok {
            t.Fatal("two identical stones form a chain")
        }
        hdCheck(t, input, chain)
    }
  hidden_00_perf_test.go: |
    package dominoes

    import (
        "fmt"
        "os"
        "runtime"
        "testing"
        "time"
    )

    var hdSlow bool

    // hdBounded runs MakeChain in a goroutine and watches it. A solution that tries every ordering of the stones
    // materialises n! permutations; on 10 stones that is ~0.7 GB and on 13 stones over a terabyte. The goroutine cannot be
    // cancelled, so a runaway search ends the whole test binary (after printing the failure line `go test -json` turns into
    // a failed TestHd...) instead of eating the machine's memory. Limits: 400 MB of live heap or 2 s.
    func hdBounded(t *testing.T, input []Domino) ([]Domino, bool) {
        type res struct {
            chain []Domino
            ok    bool
        }
        done := make(chan res, 1)
        go func() {
            c, ok := MakeChain(input)
            done <- res{c, ok}
        }()
        tick := time.NewTicker(5 * time.Millisecond)
        defer tick.Stop()
        deadline := time.After(2 * time.Second)
        var ms runtime.MemStats
        for {
            select {
            case r := <-done:
                return r.chain, r.ok
            case <-tick.C:
                runtime.ReadMemStats(&ms)
                if ms.HeapAlloc > 400<<20 {
                    hdAbort(t, "live heap above 400 MB: the search is factorial")
                }
            case <-deadline:
                hdAbort(t, "MakeChain ran for more than 2 s")
            }
        }
    }

    func hdAbort(t *testing.T, why string) {
        fmt.Printf("--- FAIL: %s (0.00s)\n    runaway MakeChain: %s\nFAIL\n", t.Name(), why)
        os.Exit(1)
    }

    func hdRing(n int) []Domino {
        ds := make([]Domino, n)
        for i := range ds {
            ds[i] = Domino{i, (i + 1) % n}
        }
        seed := uint32(12345)
        for i := n - 1; i > 0; i-- {
            seed = seed*1664525 + 1013904223
            j := int(seed>>8) % (i + 1)
            ds[i], ds[j] = ds[j], ds[i]
        }
        for i := range ds {
            seed = seed*1664525 + 1013904223
            if seed&0x10000 != 0 {
                ds[i][0], ds[i][1] = ds[i][1], ds[i][0]
            }
        }
        return ds
    }

    func hdGate(t *testing.T) {
        if hdSlow {
            t.Fatal("not run: the stone-ordering search is still factorial (see TestHdAGate)")
        }
    }

    // TestHdAGate must stay first: a brute-force ordering search needs ~0.2 s and ~0.7 GB for these 10 stones, an Euler
    // circuit search microseconds. It is memory-bounded (hdBounded) so even a factorial solution cannot run away.
    func TestHdAGate(t *testing.T) {
        var input []Domino
        for i := 0; i < 5; i++ {
            for j := i + 1; j < 5; j++ {
                input = append(input, Domino{i, j})
            }
        }
        start := time.Now()
        chain, ok := hdBounded(t, input)
        elapsed := time.Since(start)
        if elapsed > 100*time.Millisecond {
            hdSlow = true
            t.Fatalf("MakeChain on 10 stones took %v", elapsed)
        }
        if !ok {
            t.Fatal("the complete graph on 5 numbers has an Euler circuit")
        }
        hdCheck(t, input, chain)
    }

    func TestHdLargeRing(t *testing.T) {
        hdGate(t)
        input := hdRing(300)
        start := time.Now()
        chain, ok := hdBounded(t, input)
        if !ok {
            t.Fatal("a ring of stones must chain")
        }
        hdCheck(t, input, chain)
        if time.Since(start) > time.Second {
            t.Fatalf("too slow: %v", time.Since(start))
        }
    }

    func TestHdOddDegreeIsRejectedQuickly(t *testing.T) {
        hdGate(t)
        input := append(hdRing(12), Domino{0, 5})
        if chain, ok := hdBounded(t, input); ok {
            t.Fatalf("unexpected chain %v", chain)
        }
    }

    func TestHdDisconnectedRingsAreRejected(t *testing.T) {
        hdGate(t)
        var input []Domino
        for i := 0; i < 6; i++ {
            input = append(input, Domino{i, (i + 1) % 6}, Domino{10 + i, 10 + (i+1)%6})
        }
        if chain, ok := hdBounded(t, input); ok {
            t.Fatalf("unexpected chain %v", chain)
        }
    }

    func TestHdDoublesAndRepeats(t *testing.T) {
        hdGate(t)
        input := []Domino{{0, 0}, {0, 1}, {1, 1}, {1, 2}, {2, 0}, {2, 2}, {0, 0}, {3, 3}, {3, 3}}
        if _, ok := hdBounded(t, input); ok {
            t.Fatal("stone 3|3 is isolated, no chain expected")
        }
        input = input[:7]
        chain, ok := hdBounded(t, input)
        if !ok {
            t.Fatal("expected a chain")
        }
        hdCheck(t, input, chain)
    }
  hidden_string_test.go: |
    package dominoes

    import (
        "fmt"
        "testing"
    )

    func TestHdStringer(t *testing.T) {
        if got := fmt.Sprint(Domino{1, 2}); got != "[1|2]" {
            t.Errorf("got %q", got)
        }
        if got := (Domino{0, 6}).String(); got != "[0|6]" {
            t.Errorf("got %q", got)
        }
    }

    func TestHdFormatChain(t *testing.T) {
        cases := []struct {
            in   []Domino
            want string
        }{
            {nil, ""},
            {[]Domino{}, ""},
            {[]Domino{{1, 1}}, "[1|1]"},
            {[]Domino{{1, 2}, {2, 3}, {3, 1}}, "[1|2] [2|3] [3|1]"},
        }
        for _, tc := range cases {
            if got := FormatChain(tc.in); got != tc.want {
                t.Errorf("FormatChain(%v) = %q, want %q", tc.in, got, tc.want)
            }
        }
    }

    func TestHdFormatChainOfAChain(t *testing.T) {
        chain, ok := MakeChain([]Domino{{2, 1}, {2, 3}, {1, 3}})
        if !ok {
            t.Fatal("expected chain")
        }
        if got := FormatChain(chain); len(got) != len("[1|2] [2|3] [3|1]") {
            t.Errorf("unexpected format %q", got)
        }
    }
  hidden_parse_test.go: |
    package dominoes

    import "testing"

    func TestHdParseDominoes(t *testing.T) {
        cases := map[string][]Domino{
            "":                    {},
            "   ":                 {},
            "[1|2]":               {{1, 2}},
            "[1|2] [2|3] [3|1]":   {{1, 2}, {2, 3}, {3, 1}},
            "1|2 2|3":             {{1, 2}, {2, 3}},
            "  [0|6]   [6|6]  ":   {{0, 6}, {6, 6}},
        }
        for in, want := range cases {
            got, err := ParseDominoes(in)
            if err != nil {
                t.Errorf("ParseDominoes(%q) error: %v", in, err)
                continue
            }
            if len(got) != len(want) {
                t.Errorf("ParseDominoes(%q) = %v, want %v", in, got, want)
                continue
            }
            for i := range want {
                if got[i] != want[i] {
                    t.Errorf("ParseDominoes(%q) = %v, want %v", in, got, want)
                }
            }
        }
    }

    func TestHdParseDominoesErrors(t *testing.T) {
        for _, in := range []string{"[1|2", "1|", "|2", "a|b", "1|2|3", "12", "[1,2]", "1 2"} {
            if got, err := ParseDominoes(in); err == nil {
                t.Errorf("ParseDominoes(%q) = %v, want an error", in, got)
            }
        }
    }

    func TestHdParseFormatRoundTrip(t *testing.T) {
        in := []Domino{{5, 4}, {4, 4}, {4, 0}, {0, 5}}
        got, err := ParseDominoes(FormatChain(in))
        if err != nil || len(got) != len(in) {
            t.Fatalf("round trip failed: %v %v", got, err)
        }
        for i := range in {
            if got[i] != in[i] {
                t.Fatalf("round trip changed stone %d: %v", i, got)
            }
        }
    }
  hidden_from_test.go: |
    package dominoes

    import "testing"

    func TestHdMakeChainFrom(t *testing.T) {
        input := []Domino{{1, 2}, {2, 3}, {3, 1}}
        for _, start := range []int{1, 2, 3} {
            chain, ok := MakeChainFrom(start, input)
            if !ok {
                t.Fatalf("MakeChainFrom(%d) failed", start)
            }
            if chain[0][0] != start {
                t.Errorf("MakeChainFrom(%d) starts with %v", start, chain[0])
            }
            hdCheck(t, input, chain)
        }
    }

    func TestHdMakeChainFromMissingNumber(t *testing.T) {
        if chain, ok := MakeChainFrom(9, []Domino{{1, 2}, {2, 3}, {3, 1}}); ok {
            t.Errorf("unexpected chain %v", chain)
        }
    }

    func TestHdMakeChainFromEmptyAndInvalid(t *testing.T) {
        if chain, ok := MakeChainFrom(5, nil); !ok || len(chain) != 0 {
            t.Errorf("empty input: %v %v", chain, ok)
        }
        if _, ok := MakeChainFrom(1, []Domino{{1, 2}}); ok {
            t.Error("a single non-double stone cannot chain")
        }
    }

    func TestHdMakeChainFromWithDoubles(t *testing.T) {
        input := []Domino{{1, 1}, {1, 2}, {2, 1}, {2, 2}}
        chain, ok := MakeChainFrom(2, input)
        if !ok || chain[0][0] != 2 {
            t.Fatalf("got %v %v", chain, ok)
        }
        hdCheck(t, input, chain)
    }
  hidden_first_test.go: |
    package dominoes

    import (
        "reflect"
        "testing"
    )

    func TestHdChainStartsWithFirstInputStone(t *testing.T) {
        hdGate(t)
        inputs := [][]Domino{
            {{1, 2}, {2, 3}, {3, 1}},
            {{3, 1}, {2, 3}, {1, 2}},
            {{1, 2}, {1, 3}, {2, 3}},
            {{5, 4}, {4, 4}, {4, 0}, {0, 5}},
            {{1, 1}},
            {{1, 2}, {2, 1}},
            {{0, 1}, {1, 2}, {2, 0}, {0, 3}, {3, 4}, {4, 0}},
            hdRing(40),
        }
        for _, input := range inputs {
            chain, ok := MakeChain(input)
            if !ok {
                t.Fatalf("expected a chain for %v", input)
            }
            if chain[0] != input[0] {
                t.Errorf("chain %v does not start with the first stone %v as given", chain, input[0])
            }
            hdCheck(t, input, chain)
        }
    }

    func TestHdChainIsDeterministic(t *testing.T) {
        hdGate(t)
        input := hdRing(60)
        first, _ := MakeChain(input)
        for i := 0; i < 5; i++ {
            again, _ := MakeChain(input)
            if !reflect.DeepEqual(first, again) {
                t.Fatal("MakeChain returned different chains for the same input")
            }
        }
    }
  hidden_check_helper_test.go: |
    package dominoes

    import "testing"

    // hdCheck verifies that chain is a legal chain made from exactly the stones in input.
    func hdCheck(t *testing.T, input, chain []Domino) {
        t.Helper()
        if len(chain) != len(input) {
            t.Fatalf("chain has %d stones, input has %d", len(chain), len(input))
        }
        count := map[Domino]int{}
        for _, d := range input {
            if d[0] > d[1] {
                d = Domino{d[1], d[0]}
            }
            count[d]++
        }
        for _, d := range chain {
            if d[0] > d[1] {
                d = Domino{d[1], d[0]}
            }
            count[d]--
        }
        for d, c := range count {
            if c != 0 {
                t.Fatalf("stones differ at %v", d)
            }
        }
        for i := 0; i+1 < len(chain); i++ {
            if chain[i][1] != chain[i+1][0] {
                t.Fatalf("stones %d and %d do not match: %v %v", i, i+1, chain[i], chain[i+1])
            }
        }
        if len(chain) > 0 && chain[0][0] != chain[len(chain)-1][1] {
            t.Fatalf("ends do not match: %v ... %v", chain[0], chain[len(chain)-1])
        }
    }
