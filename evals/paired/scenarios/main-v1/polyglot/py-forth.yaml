    import unittest
    from forth import evaluate


    class InputIsNotMutatedTest(unittest.TestCase):
        def test_definitions_stay_in_the_callers_list(self):
            lines = [": foo 5 ;", "foo foo"]
            self.assertEqual(evaluate(lines), [5, 5])
            self.assertEqual(lines, [": foo 5 ;", "foo foo"])

        def test_same_list_can_be_evaluated_twice(self):
            lines = [": double dup + ;", "4 double"]
            self.assertEqual(evaluate(lines), [8])
            self.assertEqual(evaluate(lines), [8])

        def test_single_line_input(self):
            lines = ["1 2 +"]
            evaluate(lines)
            self.assertEqual(lines, ["1 2 +"])

        def test_empty_input(self):
            self.assertEqual(evaluate([]), [])
  hidden_bigdiv_test.py: |
    import unittest
    from forth import evaluate


    class BigIntegerDivisionTest(unittest.TestCase):
        def test_exact_big_division(self):
            self.assertEqual(evaluate(["100000000000000000001 3 /"]), [33333333333333333333])

        def test_big_division_truncates_toward_zero(self):
            self.assertEqual(evaluate(["-100000000000000000001 3 /"]), [-33333333333333333333])

        def test_negative_divisor(self):
            self.assertEqual(evaluate(["7 -2 /"]), [-3])

        def test_both_negative(self):
            self.assertEqual(evaluate(["-7 -2 /"]), [3])

        def test_small_values_unchanged(self):
            self.assertEqual(evaluate(["8 2 /"]), [4])

        def test_divide_by_zero_still_raises(self):
            with self.assertRaises(ZeroDivisionError):
                evaluate(["4 0 /"])

        def test_big_multiplication(self):
            self.assertEqual(evaluate(["99999999999 99999999999 *"]), [9999999999800000000001])
  hidden_malformed_test.py: |
    import unittest
    from forth import evaluate


    class MalformedDefinitionTest(unittest.TestCase):
        def test_missing_semicolon(self):
            with self.assertRaises(ValueError):
                evaluate([": foo 1 2", "foo"])

        def test_empty_definition_without_name(self):
            with self.assertRaises(ValueError):
                evaluate([":", "1"])

        def test_number_cannot_be_redefined(self):
            with self.assertRaises(ValueError):
                evaluate([": 1 2 ;", "1"])

        def test_well_formed_definition_still_works(self):
            self.assertEqual(evaluate([": foo 1 2 ;", "foo foo"]), [1, 2, 1, 2])

        def test_empty_body_is_allowed(self):
            self.assertEqual(evaluate([": noop ;", "5 noop 6"]), [5, 6])
  hidden_words_test.py: |
    import unittest
    from forth import evaluate, StackUnderflowError


    class RotAndDepthTest(unittest.TestCase):
        def test_rot(self):
            self.assertEqual(evaluate(["1 2 3 rot"]), [2, 3, 1])

        def test_rot_with_extra_values(self):
            self.assertEqual(evaluate(["9 1 2 3 rot"]), [9, 2, 3, 1])

        def test_rot_is_case_insensitive(self):
            self.assertEqual(evaluate(["1 2 3 ROT"]), [2, 3, 1])

        def test_rot_underflow(self):
            with self.assertRaises(StackUnderflowError):
                evaluate(["1 2 rot"])

        def test_depth(self):
            self.assertEqual(evaluate(["depth"]), [0])
            self.assertEqual(evaluate(["7 8 9 depth"]), [7, 8, 9, 3])

        def test_words_in_definitions(self):
            self.assertEqual(evaluate([": r3 rot rot rot ;", "1 2 3 r3"]), [1, 2, 3])
            self.assertEqual(evaluate([": d depth ;", "4 5 d"]), [4, 5, 2])
  hidden_perf_test.py: |
    import time
    import unittest
    from forth import evaluate


    class LargeProgramTest(unittest.TestCase):
        def test_two_hundred_thousand_tokens(self):
            program = "1 " + "dup drop " * 100000
            start = time.perf_counter()
            self.assertEqual(evaluate([program]), [1])
            self.assertLess(time.perf_counter() - start, 2.0)

        def test_big_expansion_through_a_definition(self):
            start = time.perf_counter()
            self.assertEqual(evaluate([": dd dup drop ;", "1 " + "dd " * 100000]), [1])
            self.assertLess(time.perf_counter() - start, 2.0)

        def test_many_numbers(self):
            n = 150000
            result = evaluate([" ".join(["2"] * n)])
            self.assertEqual(len(result), n)
