    #[test]
    fn hidden_trailing_newline_is_ignored() {
        let text = format!("{}\n", draw(&["0"]));
        assert_eq!(convert(&text), Ok("0".to_string()));
    }

    #[test]
    fn hidden_crlf_line_endings() {
        let text = draw(&["12", "34"]).replace('\n', "\r\n");
        assert_eq!(convert(&text), Ok("12,34".to_string()));
        let text = format!("{}\r\n", text);
        assert_eq!(convert(&text), Ok("12,34".to_string()));
    }

    #[test]
    fn hidden_errors_still_reported() {
        assert_eq!(convert(" _ \n| |\n   \n"), Err(Error::InvalidRowCount(3)));
    }
  tests/hidden_display.rs: |
    use ocr_numbers::*;

    #[test]
    fn hidden_error_display() {
        assert_eq!(Error::InvalidRowCount(3).to_string(), "input has 3 rows, expected a multiple of 4");
        assert_eq!(Error::InvalidColumnCount(4).to_string(), "input has 4 columns, expected a multiple of 3");
    }

    #[test]
    fn hidden_error_is_std_error() {
        fn takes(_: &dyn std::error::Error) {}
        takes(&Error::InvalidRowCount(1));
        fn run() -> Result<String, Box<dyn std::error::Error>> {
            Ok(convert("   \n  |\n  |\n   ")?)
        }
        assert_eq!(run().unwrap(), "1");
    }
  tests/hidden_render.rs: |
    use ocr_numbers::*;

    const FONT: [[&str; 3]; 10] = [
        [" _ ", "| |", "|_|"],
        ["   ", "  |", "  |"],
        [" _ ", " _|", "|_ "],
        [" _ ", " _|", " _|"],
        ["   ", "|_|", "  |"],
        [" _ ", "|_ ", " _|"],
        [" _ ", "|_ ", "|_|"],
        [" _ ", "  |", "  |"],
        [" _ ", "|_|", "|_|"],
        [" _ ", "|_|", " _|"],
    ];

    fn draw(lines: &[&str]) -> String {
        let mut out: Vec<String> = Vec::new();
        for line in lines {
            let mut rows = [String::new(), String::new(), String::new(), String::from("")];
            for ch in line.chars() {
                let cell: [&str; 3] = match ch.to_digit(10) {
                    Some(d) => FONT[d as usize],
                    None => ["   ", "  _", "  |"],
                };
                for r in 0..3 {
                    rows[r].push_str(cell[r]);
                }
                rows[3].push_str("   ");
            }
            out.extend(rows);
        }
        out.join("\n")
    }

    #[test]
    fn hidden_render_known() {
        assert_eq!(render("0"), Some(" _ \n| |\n|_|\n   ".to_string()));
        assert_eq!(render("1"), Some("   \n  |\n  |\n   ".to_string()));
        assert_eq!(render("10"), Some("    _ \n  || |\n  ||_|\n      ".to_string()));
    }

    #[test]
    fn hidden_render_roundtrip() {
        for s in ["1234567890", "123,456,789", "7", "00,11"] {
            let text = render(s).unwrap();
            assert_eq!(convert(&text), Ok(s.to_string()), "roundtrip of {s}");
        }
    }

    #[test]
    fn hidden_render_matches_reference_font() {
        assert_eq!(render("123,456").unwrap(), draw(&["123", "456"]));
    }

    #[test]
    fn hidden_render_rejects_non_digits() {
        assert_eq!(render("1x"), None);
        assert_eq!(render("12 3"), None);
    }
