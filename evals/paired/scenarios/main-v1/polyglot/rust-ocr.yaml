        [" _ ", "|_|", " _|"],
    ];

    fn draw(lines: &[&str]) -> String {
        let mut out: Vec<String> = Vec::new();
        for line in lines {
            let mut rows = [String::new(), String::new(), String::new(), String::from("")];
            for ch in line.chars() {
                let cell: [&str; 3] = match ch.to_digit(10) {
                    Some(d) => FONT[d as usize],
                    None => ["   ", "  _", "  |"],
                };
                for r in 0..3 {
                    rows[r].push_str(cell[r]);
                }
                rows[3].push_str("   ");
            }
            out.extend(rows);
        }
        out.join("\n")
    }

    #[test]
    fn hidden_number_ok() {
        assert_eq!(convert_number(&draw(&["1234567890"])), Ok(1234567890));
        assert_eq!(convert_number(&draw(&["0"])), Ok(0));
        assert_eq!(convert_number(&draw(&["007"])), Ok(7));
        assert_eq!(convert_number(&draw(&["1234567890123456789"])), Ok(1234567890123456789));
    }

    #[test]
    fn hidden_number_errors() {
        assert_eq!(convert_number(&draw(&["12345678901234567890"])), Err(NumberError::TooLong));
        assert_eq!(convert_number(&draw(&["12", "34"])), Err(NumberError::Multiple));
        assert_eq!(convert_number(&draw(&["1?3"])), Err(NumberError::Garbled));
        assert_eq!(convert_number(" _ \n| |\n   "), Err(NumberError::Ocr(Error::InvalidRowCount(3))));
    }
turns:
  - prompt: >-
      Read .docs/instructions.md and implement `convert` and the `Error` enum in src/lib.rs so the
      provided tests in tests/ocr-numbers.rs pass (some are marked #[ignore]; run them all with `cargo
      test --offline -- --include-ignored`). Do not edit the provided test file.
    checks:
      - {kind: tests, runner: rust, files: [tests/ocr-numbers.rs], restore: [tests/ocr-numbers.rs]}
  - prompt: >-
      In three to five sentences, explain how `convert` recognises a digit from a 3x3 cell, and when
      it returns each of the two errors versus a `?`. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [InvalidRowCount, InvalidColumnCount, '\?', cell|pattern]}
  - prompt: >-
      Add `pub fn convert_lines(input: &str) -> Result<Vec<String>, Error>` that returns one string
      per line of digits instead of joining them with commas; it reports the same errors and keeps `?`
      for garbled cells. `convert` keeps its behaviour.
    checks:
      - {kind: tests, runner: rust, files: [tests/ocr-numbers.rs], restore: [tests/ocr-numbers.rs], hidden: [tests/hidden_lines.rs]}
  - prompt: >-
      Fix an edge case: input that has Windows line endings (\r\n) or a single trailing newline must
      be accepted and give the same result as without them. A wrong row count must still be an error.
    checks:
      - {kind: tests, runner: rust, files: [tests/ocr-numbers.rs], restore: [tests/ocr-numbers.rs], hidden: [tests/hidden_lines.rs, tests/hidden_newlines.rs]}
  - prompt: >-
      Make `Error` a proper error type: implement `std::fmt::Display` ("input has 3 rows, expected a
      multiple of 4" for `InvalidRowCount(3)`, "input has 4 columns, expected a multiple of 3" for
      `InvalidColumnCount(4)`) and `std::error::Error`.
    gap_before_s: 420
    checks:
      - {kind: tests, runner: rust, files: [tests/ocr-numbers.rs], restore: [tests/ocr-numbers.rs], hidden: [tests/hidden_lines.rs, tests/hidden_newlines.rs, tests/hidden_display.rs]}
  - prompt: >-
      Add unit tests inside src/lib.rs in a `#[cfg(test)] mod tests` block: at least four `#[test]`
      functions covering a digit, a garbled cell, both errors and `convert_lines`. Run `cargo test
      --offline`.
    checks:
      - {kind: file_regex, path: src/lib.rs, pattern: '#\[test\]', min_count: 4}
      - {kind: tests, runner: rust, files: [tests/ocr-numbers.rs], restore: [tests/ocr-numbers.rs], hidden: [tests/hidden_lines.rs, tests/hidden_newlines.rs, tests/hidden_display.rs]}
  - prompt: >-
