hidden_files:
  tests/hidden_lines.rs: |
    use ocr_numbers::*;

    const FONT: [[&str; 3]; 10] = [
        [" _ ", "| |", "|_|"],
        ["   ", "  |", "  |"],
        [" _ ", " _|", "|_ "],
        [" _ ", " _|", " _|"],
        ["   ", "|_|", "  |"],
        [" _ ", "|_ ", " _|"],
        [" _ ", "|_ ", "|_|"],
        [" _ ", "  |", "  |"],
        [" _ ", "|_|", "|_|"],
        [" _ ", "|_|", " _|"],
    ];

    fn draw(lines: &[&str]) -> String {
        let mut out: Vec<String> = Vec::new();
        for line in lines {
            let mut rows = [String::new(), String::new(), String::new(), String::from("")];
            for ch in line.chars() {
                let cell: [&str; 3] = match ch.to_digit(10) {
                    Some(d) => FONT[d as usize],
                    None => ["   ", "  _", "  |"],
                };
                for r in 0..3 {
                    rows[r].push_str(cell[r]);
                }
                rows[3].push_str("   ");
            }
            out.extend(rows);
        }
        out.join("\n")
    }

    #[test]
    fn hidden_lines_are_separate() {
        let text = draw(&["123", "456", "789"]);
        assert_eq!(convert_lines(&text), Ok(vec!["123".to_string(), "456".to_string(), "789".to_string()]));
        assert_eq!(convert(&text), Ok("123,456,789".to_string()));
    }

    #[test]
    fn hidden_single_line() {
        assert_eq!(convert_lines(&draw(&["0"])), Ok(vec!["0".to_string()]));
    }

    #[test]
    fn hidden_lines_errors_match_convert() {
        assert_eq!(convert_lines(" _ \n| |\n   "), Err(Error::InvalidRowCount(3)));
        assert_eq!(convert_lines("    \n   |\n   |\n    "), Err(Error::InvalidColumnCount(4)));
    }

    #[test]
    fn hidden_lines_keep_question_marks() {
        assert_eq!(convert_lines(&draw(&["1?3"])), Ok(vec!["1?3".to_string()]));
    }
