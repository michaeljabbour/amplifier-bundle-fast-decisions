      passes. Do not edit the provided test file.
    checks:
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go]}
  - prompt: >-
      In four to six sentences, explain how your list is laid out in memory and which of its
      operations have to walk the whole list. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [next, head, O\(n\)|linear|walk], any: [Push, Size, Pop], min_any: 2}
  - prompt: >-
      Add an exported error `ErrEmptyList`, return it from `Pop` on an empty list, and add `func (l
      *List) Peek() (int, error)` that returns the last element without removing it (and
      `ErrEmptyList` when the list is empty).
    checks:
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go]}
  - prompt: >-
      Add `func (l *List) Find(v int) int` returning the zero-based index of the first element equal
