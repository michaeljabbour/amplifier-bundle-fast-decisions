    checks:
      - {kind: file_regex, path: extra_test.go, pattern: ^func Test, min_count: 5}
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go, hidden_find_test.go]}
  - prompt: >-
      Refactor simple_linked_list.go: extract the walk to the last node into an unexported method
      `func (l *List) tail() *Element` and use it in `Push` and `Peek`. No behaviour change; keep all
      tests passing.
    checks:
