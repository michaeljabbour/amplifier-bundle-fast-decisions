      - {kind: file_regex, path: simple_linked_list.go, pattern: l\.tail\(\), min_count: 2}
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go, hidden_find_test.go]}
  - prompt: >-
      Performance change: make `Push` and `Size` O(1) (keep a tail pointer and a size counter in
      `List`) without breaking `Pop`, `Peek`, `Reverse` or `Array`. 100000 pushes interleaved with
      `Size` calls must finish in well under a second.
    checks:
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go, hidden_find_test.go, hidden_perf_test.go]}
  - prompt: >-
      Add `func (l *List) Clone() *List` that returns an independent copy: changes to either list
      afterwards must not affect the other, and cloning an empty list gives a usable empty list.
    checks:
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go, hidden_find_test.go, hidden_perf_test.go, hidden_clone_test.go]}
  - prompt: >-
      Make `*List` implement `fmt.Stringer`: `fmt.Sprint(list)` for a list holding 1, 2, 3 must give
      "[1 2 3]" and an empty list gives "[]".
    checks:
      - {kind: tests, runner: go, restore: [simple_linked_list_test.go], hidden: [hidden_err_test.go, hidden_find_test.go, hidden_perf_test.go, hidden_clone_test.go, hidden_string_test.go]}
  - prompt: >-
      New requirement: add `func (l *List) Insert(index, v int) error` that inserts v so it ends up at
      position index (0 puts it first, Size() appends). An index below 0 or above Size() returns a new
