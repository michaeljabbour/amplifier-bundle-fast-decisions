  hidden_err_test.go: |
    package linkedlist

    import (
    	"errors"
    	"testing"
    )

    func TestHErrEmptyListExported(t *testing.T) {
    	if ErrEmptyList == nil {
    		t.Fatal("ErrEmptyList must be non-nil")
    	}
    }

    func TestHPopEmptyReturnsSentinel(t *testing.T) {
    	if _, err := New(nil).Pop(); !errors.Is(err, ErrEmptyList) {
    		t.Fatalf("Pop on empty list: %v", err)
    	}
    }

    func TestHPeek(t *testing.T) {
    	l := New([]int{1, 2, 3})
    	v, err := l.Peek()
    	if err != nil || v != 3 || l.Size() != 3 {
    		t.Fatalf("Peek = %d, %v, size %d", v, err, l.Size())
    	}
    	if _, err := New([]int{}).Peek(); !errors.Is(err, ErrEmptyList) {
    		t.Fatalf("Peek on empty list: %v", err)
    	}
    }
  hidden_find_test.go: |
    package linkedlist

    import "testing"

    func TestHFind(t *testing.T) {
    	l := New([]int{5, 6, 7, 6})
    	cases := map[int]int{5: 0, 6: 1, 7: 2, 8: -1}
    	for v, want := range cases {
    		if got := l.Find(v); got != want {
    			t.Errorf("Find(%d) = %d, want %d", v, got, want)
    		}
    	}
    	if New(nil).Find(1) != -1 {
    		t.Error("Find on empty list must be -1")
    	}
    }
  hidden_perf_test.go: |
    package linkedlist

    import (
    	"reflect"
    	"testing"
    	"time"
    )

    func TestHPushAndSizeAreConstantTime(t *testing.T) {
    	const n = 100000
    	start := time.Now()
    	l := New(nil)
    	for i := 0; i < n; i++ {
    		l.Push(i)
    		_ = l.Size()
    	}
    	if elapsed := time.Since(start); elapsed > time.Second {
    		t.Fatalf("%d pushes with Size took %v; Push and Size must be O(1)", n, elapsed)
    	}
    	if l.Size() != n {
    		t.Fatalf("size %d", l.Size())
    	}
    }

    func TestHInterleavedPushPopKeepsTailAndSize(t *testing.T) {
    	l := New([]int{1, 2, 3})
    	if v, _ := l.Pop(); v != 3 || l.Size() != 2 {
    		t.Fatalf("pop %d size %d", v, l.Size())
    	}
    	l.Push(4)
    	if !reflect.DeepEqual(l.Array(), []int{1, 2, 4}) || l.Size() != 3 {
    		t.Fatalf("%v %d", l.Array(), l.Size())
    	}
    	for i := 0; i < 3; i++ {
    		if _, err := l.Pop(); err != nil {
    			t.Fatal(err)
    		}
    	}
    	if l.Size() != 0 {
    		t.Fatalf("size %d after draining", l.Size())
    	}
    	if _, err := l.Pop(); err == nil {
    		t.Fatal("expected error from empty list")
    	}
    	l.Push(9)
    	if !reflect.DeepEqual(l.Array(), []int{9}) || l.Size() != 1 {
    		t.Fatalf("%v %d", l.Array(), l.Size())
    	}
    	if v, err := l.Peek(); err != nil || v != 9 {
    		t.Fatalf("peek %d %v", v, err)
    	}
    }

    func TestHReverseKeepsSizeAndTail(t *testing.T) {
    	r := New([]int{1, 2, 3}).Reverse()
    	if r.Size() != 3 {
    		t.Fatalf("size %d", r.Size())
    	}
    	r.Push(0)
    	if !reflect.DeepEqual(r.Array(), []int{3, 2, 1, 0}) {
    		t.Fatalf("%v", r.Array())
    	}
    }
  hidden_clone_test.go: |
    package linkedlist

    import (
    	"reflect"
    	"testing"
    )

    func TestHCloneEqualAndIndependent(t *testing.T) {
    	a := New([]int{1, 2, 3})
    	b := a.Clone()
    	if !reflect.DeepEqual(a.Array(), b.Array()) || b.Size() != 3 {
    		t.Fatalf("%v vs %v", a.Array(), b.Array())
    	}
    	b.Push(4)
    	a.Pop()
    	if !reflect.DeepEqual(a.Array(), []int{1, 2}) || !reflect.DeepEqual(b.Array(), []int{1, 2, 3, 4}) {
    		t.Fatalf("not independent: %v %v", a.Array(), b.Array())
    	}
    }

    func TestHCloneEmpty(t *testing.T) {
    	c := New(nil).Clone()
    	if c == nil || c.Size() != 0 {
    		t.Fatal("clone of empty list")
    	}
    	c.Push(1)
    	if c.Size() != 1 {
    		t.Fatal("clone of empty list must accept pushes")
    	}
    }
  hidden_string_test.go: |
    package linkedlist

    import (
    	"fmt"
    	"testing"
    )

    func TestHStringer(t *testing.T) {
    	if got := fmt.Sprint(New([]int{1, 2, 3})); got != "[1 2 3]" {
    		t.Fatalf("got %q", got)
    	}
    	if got := fmt.Sprintf("%v", New(nil)); got != "[]" {
    		t.Fatalf("got %q", got)
    	}
    	if got := New([]int{7}).String(); got != "[7]" {
    		t.Fatalf("got %q", got)
    	}
    }
  hidden_insert_test.go: |
    package linkedlist

    import (
    	"errors"
    	"reflect"
    	"testing"
    )

    func TestHInsertPositions(t *testing.T) {
    	l := New([]int{1, 2, 3})
    	steps := []struct {
    		idx, v int
    		want   []int
    	}{
    		{0, 0, []int{0, 1, 2, 3}},
    		{2, 9, []int{0, 1, 9, 2, 3}},
    		{5, 4, []int{0, 1, 9, 2, 3, 4}},
    	}
    	for _, s := range steps {
    		if err := l.Insert(s.idx, s.v); err != nil {
    			t.Fatalf("Insert(%d,%d): %v", s.idx, s.v, err)
    		}
    		if got := l.Array(); !reflect.DeepEqual(got, s.want) || l.Size() != len(s.want) {
    			t.Fatalf("after Insert(%d,%d): %v size %d, want %v", s.idx, s.v, got, l.Size(), s.want)
    		}
    	}
    }

    func TestHInsertOutOfRange(t *testing.T) {
    	l := New([]int{1})
    	for _, idx := range []int{-1, 2, 100} {
    		if err := l.Insert(idx, 5); !errors.Is(err, ErrIndexOutOfRange) {
    			t.Errorf("Insert(%d): %v", idx, err)
    		}
    	}
    	if l.Size() != 1 {
    		t.Fatalf("size %d after failed inserts", l.Size())
    	}
    }

    func TestHInsertIntoEmptyAndAtEndUpdatesTail(t *testing.T) {
    	l := New(nil)
    	if err := l.Insert(0, 1); err != nil {
    		t.Fatal(err)
    	}
    	if err := l.Insert(1, 2); err != nil {
    		t.Fatal(err)
    	}
    	if v, err := l.Pop(); err != nil || v != 2 {
    		t.Fatalf("pop %d %v", v, err)
    	}
    	l.Push(3)
    	if !reflect.DeepEqual(l.Array(), []int{1, 3}) {
    		t.Fatalf("%v", l.Array())
    	}
    }
  hidden_conc_test.go: |
    package linkedlist

    import (
    	"sync"
    	"testing"
    )

    func TestHConcurrentPushAndRead(t *testing.T) {
    	l := New(nil)
    	var wg sync.WaitGroup
    	for g := 0; g < 8; g++ {
    		wg.Add(1)
    		go func(g int) {
    			defer wg.Done()
    			for i := 0; i < 500; i++ {
    				l.Push(g*1000 + i)
    				_ = l.Size()
    				if i%50 == 0 {
    					_ = l.Array()
    				}
    			}
    		}(g)
    	}
    	wg.Wait()
    	if l.Size() != 8*500 || len(l.Array()) != 8*500 {
    		t.Fatalf("size %d, array %d", l.Size(), len(l.Array()))
    	}
    }

    func TestHConcurrentPushPop(t *testing.T) {
    	l := New(nil)
    	var wg sync.WaitGroup
    	for g := 0; g < 4; g++ {
    		wg.Add(2)
    		go func() {
    			defer wg.Done()
    			for i := 0; i < 300; i++ {
    				l.Push(i)
    			}
    		}()
    		go func() {
    			defer wg.Done()
    			for i := 0; i < 300; i++ {
    				_, _ = l.Pop()
    			}
    		}()
    	}
    	wg.Wait()
    	if l.Size() != len(l.Array()) {
    		t.Fatalf("size %d does not match %d elements", l.Size(), len(l.Array()))
    	}
    }
