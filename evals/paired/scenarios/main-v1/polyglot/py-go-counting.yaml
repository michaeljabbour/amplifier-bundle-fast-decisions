    import time
    import unittest
    from go_counting import Board


    class CachedTerritoriesTest(unittest.TestCase):
        def make(self, n=80):
            rows = [" " * n for _ in range(n)]
            rows[10] = " " * 10 + "B" + " " * (n - 11)
            return Board(rows)

        def test_repeated_calls_are_fast(self):
            board = self.make()
            board.territories()
            best = None
            for _ in range(3):
                start = time.perf_counter()
                for _ in range(300):
                    board.territories()
                elapsed = time.perf_counter() - start
                best = elapsed if best is None else min(best, elapsed)
            self.assertLess(best, 0.8)

        def test_results_are_independent_copies(self):
            board = Board(["B  "])
            first = board.territories()
            first["B"].clear()
            first["W"].add((9, 9))
            again = board.territories()
            self.assertEqual(again["B"], {(1, 0), (2, 0)})
            self.assertEqual(again["W"], set())

        def test_place_invalidates_the_cache(self):
            board = Board(["B  "])
            self.assertEqual(board.territories()["B"], {(1, 0), (2, 0)})
            board.place(1, 0, "W")
            after = board.territories()
            self.assertEqual(after["B"], set())
            self.assertEqual(after["W"], {(2, 0)})
