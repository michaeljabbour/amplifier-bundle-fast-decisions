    import unittest
    from go_counting import Board


    class EdgeCaseBoardTest(unittest.TestCase):
        EMPTY = {"B": set(), "W": set(), "": set()}

        def test_board_without_rows(self):
            self.assertEqual(Board([]).territories(), self.EMPTY)

        def test_board_with_empty_rows(self):
            self.assertEqual(Board([""]).territories(), self.EMPTY)

        def test_territory_on_a_board_without_rows_is_invalid(self):
            with self.assertRaises(ValueError):
                Board([]).territory(0, 0)

        def test_ragged_rows(self):
            with self.assertRaises(ValueError):
                Board(["B ", "W"])

        def test_all_empty_board_is_neutral(self):
            result = Board(["  ", "  "]).territories()
            self.assertEqual(result[""], {(0, 0), (1, 0), (0, 1), (1, 1)})
            self.assertEqual(result["B"], set())
            self.assertEqual(result["W"], set())

        def test_single_stone_owns_everything_else(self):
            result = Board(["B  ", "   "]).territories()
            self.assertEqual(result["B"], {(1, 0), (2, 0), (0, 1), (1, 1), (2, 1)})
            self.assertEqual(result[""], set())
