    import unittest
    from go_counting import Board


    class RenderTest(unittest.TestCase):
        def test_five_by_five(self):
            board = Board(["  B  ", " B B ", "B W B", " W W ", "  W  "])
            self.assertEqual(board.render(), ["bbBbb", "bB Bb", "B W B", " WwW ", "  W  "])

        def test_empty_board(self):
            self.assertEqual(Board([]).render(), [])

        def test_neutral_stays_blank(self):
            self.assertEqual(Board(["B W"]).render(), ["B W"])

        def test_does_not_change_the_board(self):
            board = Board(["B  "])
            self.assertEqual(board.render(), ["Bbb"])
            self.assertEqual(board.territory(1, 0)[0], "B")
            self.assertEqual(board.render(), ["Bbb"])
  hidden_place_test.py: |
    import unittest
    from go_counting import Board


    class PlaceTest(unittest.TestCase):
        def test_place_changes_territory(self):
            board = Board(["B  ", "   "])
            self.assertEqual(board.territory(2, 1)[0], "B")
            board.place(2, 0, "W")
            self.assertEqual(board.territory(2, 1)[0], "")

        def test_place_a_stone_removes_empty_point_from_territory(self):
            board = Board(["B  "])
            board.place(2, 0, "B")
            self.assertEqual(board.territories()["B"], {(1, 0)})

        def test_remove_a_stone_with_space(self):
            board = Board(["BW"])
            board.place(1, 0, " ")
            self.assertEqual(board.territories()["B"], {(1, 0)})

        def test_callers_rows_are_not_modified(self):
            rows = ["B  ", "   "]
            Board(rows).place(1, 1, "W")
            self.assertEqual(rows, ["B  ", "   "])

        def test_invalid_coordinate(self):
            with self.assertRaises(ValueError):
                Board(["B "]).place(5, 0, "B")

        def test_invalid_stone(self):
            with self.assertRaises(ValueError):
                Board(["B "]).place(1, 0, "X")

        def test_render_follows_place(self):
            board = Board(["   "])
            board.place(0, 0, "B")
            self.assertEqual(board.render(), ["Bbb"])
