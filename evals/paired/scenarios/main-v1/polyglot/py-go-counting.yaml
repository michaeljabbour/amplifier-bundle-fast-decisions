    import unittest
    from go_counting import Board

    FIVE = ["  B  ", " B B ", "B W B", " W W ", "  W  "]


    class AreaScoreTest(unittest.TestCase):
        def test_five_by_five(self):
            self.assertEqual(Board(FIVE).area_scores(), {"B": 11, "W": 5})

        def test_empty_board(self):
            self.assertEqual(Board([]).area_scores(), {"B": 0, "W": 0})

        def test_open_board_scores_nothing(self):
            self.assertEqual(Board(["   ", "   "]).area_scores(), {"B": 0, "W": 0})

        def test_single_stone_owns_the_board(self):
            self.assertEqual(Board(["B  ", "   "]).area_scores(), {"B": 6, "W": 0})

        def test_neutral_points_count_for_nobody(self):
            self.assertEqual(Board(["B W"]).area_scores(), {"B": 1, "W": 1})

        def test_scores_add_up(self):
            board = Board(FIVE)
            territories = board.territories()
            self.assertEqual(sum(board.area_scores().values()), 9 + len(territories["B"]) + len(territories["W"]))
