    import unittest
    from go_counting import Board


    class InvalidCharacterTest(unittest.TestCase):
        def test_unknown_character(self):
            with self.assertRaises(ValueError):
                Board(["B x"])

        def test_lowercase_stone(self):
            with self.assertRaises(ValueError):
                Board(["b  "])

        def test_tab_is_not_an_empty_point(self):
            with self.assertRaises(ValueError):
                Board(["B\t "])

        def test_digit(self):
            with self.assertRaises(ValueError):
                Board(["B 1"])

        def test_valid_board_still_builds(self):
            self.assertEqual(Board(["B W", " B "]).territory(1, 0)[0], "")

        def test_message_mentions_the_problem(self):
            with self.assertRaises(ValueError) as ctx:
                Board(["B?"])
            self.assertTrue(ctx.exception.args)
