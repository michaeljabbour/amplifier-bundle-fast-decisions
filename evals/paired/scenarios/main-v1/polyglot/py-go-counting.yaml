    import time
    import unittest
    from go_counting import Board


    class BigBoardTest(unittest.TestCase):
        def test_large_open_board_does_not_recurse_forever(self):
            n = 150
            rows = [" " * n for _ in range(n)]
            rows[75] = " " * 75 + "W" + " " * (n - 76)
            board = Board(rows)
            start = time.perf_counter()
            owner, cells = board.territory(0, 0)
            self.assertEqual(owner, "W")
            self.assertEqual(len(cells), n * n - 1)
            self.assertLess(time.perf_counter() - start, 3.0)

        def test_territories_of_a_large_board(self):
            n = 120
            rows = ["B" + " " * (n - 2) + "W" if y == 0 else " " * n for y in range(n)]
            result = Board(rows).territories()
            self.assertEqual(len(result[""]), n * n - 2)
            self.assertEqual(result["B"], set())

        def test_snake_shaped_territory(self):
            n = 61
            rows = []
            for y in range(n):
                if y % 2 == 0:
                    rows.append(" " * n)
                else:
                    rows.append(("B" * (n - 1) + " ") if (y // 2) % 2 == 0 else (" " + "B" * (n - 1)))
            board = Board(rows)
            owner, cells = board.territory(0, 0)
            self.assertEqual(owner, "B")
            self.assertEqual(len(cells), sum(row.count(" ") for row in rows))
