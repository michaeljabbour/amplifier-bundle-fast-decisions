  tests/hidden_edge.rs: |
    use two_bucket::*;

    #[test]
    fn hidden_zero_goal_is_none() {
        assert_eq!(solve(3, 5, 0, &Bucket::One), None);
        assert_eq!(solve(3, 5, 0, &Bucket::Two), None);
    }

    #[test]
    fn hidden_zero_capacity_is_none() {
        assert_eq!(solve(0, 5, 1, &Bucket::One), None);
        assert_eq!(solve(3, 0, 1, &Bucket::Two), None);
    }

    #[test]
    fn hidden_goal_larger_than_both_is_none() {
        assert_eq!(solve(3, 5, 9, &Bucket::One), None);
    }

    #[test]
    fn hidden_normal_cases_unchanged() {
        let s = solve(3, 5, 1, &Bucket::One).unwrap();
        assert_eq!((s.moves, s.goal_bucket, s.other_bucket), (4, Bucket::One, 5));
    }
  tests/hidden_moves.rs: |
    use two_bucket::*;

    fn replay(c1: u8, c2: u8, start: &Bucket, actions: &[Action]) -> (u8, u8) {
        assert!(!actions.is_empty());
        assert_eq!(actions[0], Action::Fill(start.clone()));
        let (mut a, mut b) = (0u8, 0u8);
        for act in actions {
            match act {
                Action::Fill(Bucket::One) => a = c1,
                Action::Fill(Bucket::Two) => b = c2,
                Action::Empty(Bucket::One) => a = 0,
                Action::Empty(Bucket::Two) => b = 0,
                Action::Pour(Bucket::One) => {
                    let p = a.min(c2 - b);
                    a -= p;
                    b += p;
                }
                Action::Pour(Bucket::Two) => {
                    let p = b.min(c1 - a);
                    b -= p;
                    a += p;
                }
            }
            match start {
                Bucket::One => assert!(!(a == 0 && b == c2), "forbidden state reached"),
                Bucket::Two => assert!(!(b == 0 && a == c1), "forbidden state reached"),
            }
        }
        (a, b)
    }

    #[test]
    fn hidden_moves_are_a_valid_shortest_plan() {
        let cases = [(3, 5, 1), (7, 11, 2), (1, 3, 3), (2, 3, 3), (6, 15, 9), (5, 7, 3)];
        for (c1, c2, goal) in cases {
            for start in [Bucket::One, Bucket::Two] {
                let stats = solve(c1, c2, goal, &start);
                let plan = moves(c1, c2, goal, &start);
                match (stats, plan) {
                    (None, None) => {}
                    (Some(s), Some(p)) => {
                        assert_eq!(p.len(), s.moves as usize, "{c1} {c2} {goal}");
                        let (a, b) = replay(c1, c2, &start, &p);
                        match s.goal_bucket {
                            Bucket::One => assert_eq!((a, b), (goal, s.other_bucket)),
                            Bucket::Two => assert_eq!((b, a), (goal, s.other_bucket)),
                        }
                    }
                    other => panic!("solve and moves disagree: {other:?}"),
                }
            }
        }
    }

    #[test]
    fn hidden_moves_none_when_impossible() {
        assert_eq!(moves(2, 4, 3, &Bucket::One), None);
        assert_eq!(moves(3, 5, 0, &Bucket::One), None);
    }
  tests/hidden_api.rs: |
    use two_bucket::*;

    #[test]
    fn hidden_other() {
        assert_eq!(Bucket::One.other(), Bucket::Two);
        assert_eq!(Bucket::Two.other(), Bucket::One);
    }

    #[test]
    fn hidden_copy_semantics() {
        let b = Bucket::One;
        let c = b;
        assert_eq!(b, c);
        let s = solve(3, 5, 1, &Bucket::One).unwrap();
        let t = s;
        assert_eq!(s.moves, t.moves);
        assert_eq!(s, t);
    }
  tests/hidden_best.rs: |
    use two_bucket::*;

    #[test]
    fn hidden_best_picks_the_cheaper_start() {
        let (start, stats) = solve_best(3, 5, 1).unwrap();
        assert_eq!(start, Bucket::One);
        assert_eq!(stats.moves, 4);
        let (start, stats) = solve_best(3, 5, 5).unwrap();
        assert_eq!(start, Bucket::Two);
        assert_eq!(stats.moves, 1);
    }

    #[test]
    fn hidden_best_ties_prefer_bucket_one() {
        let (start, stats) = solve_best(4, 4, 4).unwrap();
        assert_eq!(start, Bucket::One);
        assert_eq!(stats.moves, 1);
    }

    #[test]
    fn hidden_best_agrees_with_solve() {
        for (c1, c2, g) in [(7u8, 11u8, 2u8), (6, 15, 9), (1, 3, 3), (5, 7, 3)] {
            let a = solve(c1, c2, g, &Bucket::One);
            let b = solve(c1, c2, g, &Bucket::Two);
            let best = [a, b].into_iter().flatten().map(|s| s.moves).min();
            assert_eq!(solve_best(c1, c2, g).map(|(_, s)| s.moves), best, "{c1} {c2} {g}");
        }
    }

    #[test]
    fn hidden_best_none_when_impossible() {
        assert!(solve_best(2, 4, 3).is_none());
        assert!(solve_best(3, 5, 0).is_none());
    }
turns:
  - prompt: >-
      Read .docs/instructions.md and implement `solve` in src/lib.rs so the provided tests in
      tests/two-bucket.rs pass (some are marked #[ignore]; run them all with `cargo test --offline --
      --include-ignored`). Do not edit the provided test file.
    checks:
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs]}
  - prompt: >-
      In three to five sentences, explain how your search finds the minimum number of moves and how it
      enforces the rule about the starting bucket being empty while the other is full. Do not change
      any files.
    checks:
      - {kind: keyed_facts, all: [breadth|BFS|queue, visited, start|initial|forbidden]}
  - prompt: >-
      Fix edge cases: a goal of 0, a bucket with capacity 0, or a goal larger than both capacities
      must give `None`. Normal cases keep their results.
    checks:
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs]}
  - prompt: >-
      Add `pub enum Action { Fill(Bucket), Empty(Bucket), Pour(Bucket) }` (Pour means pour that bucket
      into the other one; derive Debug, PartialEq, Eq, Clone, and derive Clone on `Bucket`) and `pub
      fn moves(capacity_1: u8, capacity_2: u8, goal: u8, start_bucket: &Bucket) ->
      Option<Vec<Action>>` returning a shortest valid plan whose first action fills the starting
      bucket. Its length must equal `solve`'s moves.
    checks:
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs]}
  - prompt: >-
      Add unit tests inside src/lib.rs in a `#[cfg(test)] mod tests` block: at least four `#[test]`
      functions covering a classic case, an impossible goal, a zero goal and `moves`. Run `cargo test
      --offline`.
    checks:
      - {kind: file_regex, path: src/lib.rs, pattern: '#\[test\]', min_count: 4}
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs]}
  - prompt: >-
      Refactor src/lib.rs: introduce a private `struct State { one: u8, two: u8 }` with a method `fn
      successors(&self, ...)` that returns the possible next actions and states, and use it in the
      search. No behaviour change; keep all tests passing.
    checks:
      - {kind: file_regex, path: src/lib.rs, pattern: ^\s*struct State\b}
      - {kind: file_regex, path: src/lib.rs, pattern: fn successors\(}
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs]}
  - prompt: >-
      Small API change: derive `Clone` and `Copy` on `Bucket` and `BucketStats`, and add `pub fn
      other(&self) -> Bucket` on `Bucket` returning the opposite bucket.
    checks:
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs, tests/hidden_api.rs]}
  - prompt: >-
      New requirement: add `pub fn solve_best(capacity_1: u8, capacity_2: u8, goal: u8) ->
      Option<(Bucket, BucketStats)>` that tries both starting buckets and returns the starting bucket
      together with the stats of the plan with fewer moves (Bucket::One on a tie), or `None` when
      neither start works.
    checks:
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs, tests/hidden_api.rs, tests/hidden_best.rs]}
  - prompt: >-
      Create README.md with a `## Rules` section describing the allowed actions and the forbidden
      state and a `## API` section describing `solve`, `moves` and `Bucket::other`.
    checks:
      - {kind: doc_sections, path: README.md, headings: [rules, api]}
      - {kind: file_regex, path: README.md, pattern: moves}
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs, tests/hidden_api.rs, tests/hidden_best.rs]}
  - prompt: >-
      Add rustdoc comments (`///`) with an `# Examples` section containing a doctest for both `solve`
      and `moves`. Run `cargo test --offline --doc`.
    checks:
      - {kind: file_regex, path: src/lib.rs, pattern: '# Examples', min_count: 2}
      - {kind: tests, runner: cmd, cmd: cargo test --offline --doc, expect_regex: 'test result: ok\. [1-9]', restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs, tests/hidden_api.rs, tests/hidden_best.rs]}
  - prompt: >-
      Add integration tests in a new file `tests/extra.rs`: at least five `#[test]` functions covering
      the goal ending in the other bucket, an impossible case, `moves` agreeing with `solve`,
      `Bucket::other` and copying the stats. Run `cargo test --offline`.
    checks:
      - {kind: file_regex, path: tests/extra.rs, pattern: '#\[test\]', min_count: 5}
      - {kind: tests, runner: rust, files: [tests/two-bucket.rs], restore: [tests/two-bucket.rs], hidden: [tests/hidden_edge.rs, tests/hidden_moves.rs, tests/hidden_api.rs, tests/hidden_best.rs]}
  - prompt: >-
      In three or four sentences, state the time and space complexity of the search in terms of the
      two capacities, and name the data structures responsible. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [O\(, visited, queue|VecDeque, state]}
