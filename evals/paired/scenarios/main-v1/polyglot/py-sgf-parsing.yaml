    import unittest
    from sgf_parsing import SgfTree, parse


    class ToSgfTest(unittest.TestCase):
        def test_empty_root(self):
            self.assertEqual(SgfTree().to_sgf(), "(;)")

        def test_single_node(self):
            self.assertEqual(SgfTree({"A": ["b"]}).to_sgf(), "(;A[b])")

        def test_multiple_values(self):
            self.assertEqual(SgfTree({"AB": ["aa", "bb"]}).to_sgf(), "(;AB[aa][bb])")

        def test_chain(self):
            tree = SgfTree({"FF": ["4"]}, [SgfTree({"B": ["aa"]}, [SgfTree({"W": ["ab"]})])])
            self.assertEqual(tree.to_sgf(), "(;FF[4];B[aa];W[ab])")

        def test_variations(self):
            tree = SgfTree({"FF": ["4"]}, [SgfTree({"B": ["aa"]}, [SgfTree({"W": ["ab"]})]),
                                           SgfTree({"B": ["dd"]}, [SgfTree({"W": ["ee"]})])])
            self.assertEqual(tree.to_sgf(), "(;FF[4](;B[aa];W[ab])(;B[dd];W[ee]))")

        def test_escaping(self):
            self.assertEqual(SgfTree({"C": ["a]b\\c"]}).to_sgf(), "(;C[a\\]b\\\\c])")

        def test_round_trip(self):
            for text in ["(;)", "(;A[B])", "(;FF[4]C[root];B[aa];W[ab])", "(;FF[4](;B[aa];W[ab])(;B[dd];W[ee]))", "(;A[x\\]y\\\\])"]:
                with self.subTest(text=text):
                    self.assertEqual(parse(text).to_sgf(), text)
