    import unittest
    from sgf_parsing import parse


    class NestedVariationsTest(unittest.TestCase):
        def test_nested_variations(self):
            t = parse("(;A[1](;B[2](;C[3])(;D[4]))(;E[5]))")
            self.assertEqual(t.properties, {"A": ["1"]})
            self.assertEqual(len(t.children), 2)
            b, e = t.children
            self.assertEqual(b.properties, {"B": ["2"]})
            self.assertEqual([c.properties for c in b.children], [{"C": ["3"]}, {"D": ["4"]}])
            self.assertEqual(e.properties, {"E": ["5"]})
            self.assertEqual(e.children, [])

        def test_parentheses_inside_values_of_variations(self):
            t = parse("(;A[1](;B[x)y])(;C[(z]))")
            self.assertEqual([c.properties for c in t.children], [{"B": ["x)y"]}, {"C": ["(z"]}])

        def test_chain_then_nested_variations(self):
            t = parse("(;A[1];B[2](;C[3];D[4])(;E[5]))")
            b = t.children[0]
            self.assertEqual(b.properties, {"B": ["2"]})
            self.assertEqual(len(b.children), 2)
            self.assertEqual(b.children[0].children[0].properties, {"D": ["4"]})

        def test_whitespace_between_nodes(self):
            t = parse("(;A[1]\n  ;B[2]\n  (;C[3])\n)")
            self.assertEqual(t.children[0].children[0].properties, {"C": ["3"]})

        def test_unclosed_variation_raises(self):
            with self.assertRaises(ValueError):
                parse("(;A[1](;B[2])")
  hidden_walk_test.py: |
    import unittest
    from sgf_parsing import parse


    def keys(nodes):
        return [next(iter(n.properties)) for n in nodes]


    class WalkTest(unittest.TestCase):
        def setUp(self):
            self.tree = parse("(;A[1](;B[2];C[3])(;D[4]))")

        def test_walk_is_depth_first_preorder(self):
            self.assertEqual(keys(self.tree.walk()), ["A", "B", "C", "D"])

        def test_main_line_follows_first_children(self):
            self.assertEqual(keys(self.tree.main_line()), ["A", "B", "C"])

        def test_count_nodes(self):
            self.assertEqual(self.tree.count_nodes(), 4)

        def test_single_node(self):
            t = parse("(;A[1])")
            self.assertEqual(keys(t.walk()), ["A"])
            self.assertEqual(keys(t.main_line()), ["A"])
            self.assertEqual(t.count_nodes(), 1)

        def test_walk_is_lazy(self):
            it = self.tree.walk()
            self.assertEqual(next(it), self.tree)
