    import unittest
    from sgf_parsing import parse_collection


    class CollectionTest(unittest.TestCase):
        def test_two_trees(self):
            trees = parse_collection("(;A[1])(;B[2])")
            self.assertEqual([t.properties for t in trees], [{"A": ["1"]}, {"B": ["2"]}])

        def test_whitespace_between_trees(self):
            trees = parse_collection("  (;A[1];B[2])\n\n(;C[3](;D[4])(;E[5]))\n")
            self.assertEqual(len(trees), 2)
            self.assertEqual(trees[0].children[0].properties, {"B": ["2"]})
            self.assertEqual(len(trees[1].children), 2)

        def test_empty_collection(self):
            self.assertEqual(parse_collection(""), [])
            self.assertEqual(parse_collection("  \n"), [])

        def test_garbage_between_trees(self):
            with self.assertRaises(ValueError):
                parse_collection("(;A[1])x(;B[2])")

        def test_unterminated_tree(self):
            with self.assertRaises(ValueError):
                parse_collection("(;A[1])(;B[2]")

        def test_tree_without_nodes(self):
            with self.assertRaises(ValueError):
                parse_collection("(;A[1])()")
  hidden_deep_test.py: |
    import time
    import unittest
    from sgf_parsing import parse


    class DeepGameTest(unittest.TestCase):
        def test_long_single_line_of_play(self):
            n = 20000
            text = "(" + ";B[aa]" * n + ")"
            start = time.perf_counter()
            tree = parse(text)
            self.assertEqual(tree.count_nodes(), n)
            self.assertEqual(len(tree.main_line()), n)
            self.assertEqual(tree.to_sgf(), text)
            self.assertLess(time.perf_counter() - start, 3.0)

        def test_long_line_with_a_variation_at_the_end(self):
            text = "(" + ";W[bb]" * 5000 + "(;B[aa])(;B[cc]))"
            tree = parse(text)
            self.assertEqual(tree.count_nodes(), 5002)
            self.assertEqual(tree.to_sgf(), text)

        def test_wide_tree(self):
            text = "(;R[x]" + "(;B[aa])" * 3000 + ")"
            tree = parse(text)
            self.assertEqual(len(tree.children), 3000)
            self.assertEqual(tree.to_sgf(), text)
  hidden_get_test.py: |
    import unittest
    from sgf_parsing import parse, SgfTree


    class GetTest(unittest.TestCase):
        def setUp(self):
            self.node = parse("(;AB[aa][bb]C[root])")

        def test_get_returns_first_value(self):
            self.assertEqual(self.node.get("AB"), "aa")
            self.assertEqual(self.node.get("C"), "root")

        def test_get_missing_is_none_or_default(self):
            self.assertIsNone(self.node.get("ZZ"))
            self.assertEqual(self.node.get("ZZ", "none"), "none")

        def test_get_all_returns_every_value(self):
            self.assertEqual(self.node.get_all("AB"), ["aa", "bb"])
            self.assertEqual(self.node.get_all("ZZ"), [])

        def test_get_all_returns_a_copy(self):
            self.node.get_all("AB").append("cc")
            self.assertEqual(self.node.get_all("AB"), ["aa", "bb"])

        def test_empty_node(self):
            self.assertIsNone(SgfTree().get("A"))
  hidden_crlf_test.py: |
    import unittest
    from sgf_parsing import parse, parse_collection


    class LineEndingTest(unittest.TestCase):
        def test_crlf_in_value_is_a_single_newline(self):
            self.assertEqual(parse("(;C[a\r\nb])").properties, {"C": ["a\nb"]})

        def test_lone_cr_is_a_newline(self):
            self.assertEqual(parse("(;C[a\rb])").properties, {"C": ["a\nb"]})

        def test_escaped_crlf_is_a_soft_line_break(self):
            self.assertEqual(parse("(;C[a\\\r\nb])").properties, {"C": ["ab"]})

        def test_crlf_between_nodes(self):
            t = parse("(;A[1]\r\n;B[2]\r\n)")
            self.assertEqual(t.children[0].properties, {"B": ["2"]})

        def test_collection_with_crlf(self):
            trees = parse_collection("(;A[x\r\ny])\r\n(;B[2])\r\n")
            self.assertEqual(trees[0].properties, {"A": ["x\ny"]})
            self.assertEqual(len(trees), 2)
