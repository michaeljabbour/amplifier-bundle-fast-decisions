    import json
    import unittest
    from rest_api import RestAPI


    def user(name):
        return {"name": name, "owes": {}, "owed_by": {}, "balance": 0.0}


    def names(response):
        return [u["name"] for u in json.loads(response)["users"]]


    class SortedByNameTest(unittest.TestCase):
        def setUp(self):
            self.api = RestAPI({"users": [user("Chuck"), user("Adam"), user("Bob")]})

        def test_all_users_sorted(self):
            self.assertEqual(names(self.api.get("/users")), ["Adam", "Bob", "Chuck"])

        def test_requested_users_sorted(self):
            payload = json.dumps({"users": ["Chuck", "Adam"]})
            self.assertEqual(names(self.api.get("/users", payload)), ["Adam", "Chuck"])

        def test_iou_response_sorted(self):
            payload = json.dumps({"lender": "Chuck", "borrower": "Adam", "amount": 3})
            self.assertEqual(names(self.api.post("/iou", payload)), ["Adam", "Chuck"])

        def test_unknown_names_are_ignored(self):
            payload = json.dumps({"users": ["Zed", "Bob"]})
            self.assertEqual(names(self.api.get("/users", payload)), ["Bob"])

        def test_empty_database(self):
            self.assertEqual(json.loads(RestAPI({"users": []}).get("/users")), {"users": []})
  hidden_errors_test.py: |
    import json
    import unittest
    from rest_api import RestAPI


    def user(name):
        return {"name": name, "owes": {}, "owed_by": {}, "balance": 0.0}


    def names(response):
        return [u["name"] for u in json.loads(response)["users"]]


    def error(response):
        return json.loads(response)["error"]


    class ErrorResponseTest(unittest.TestCase):
        def setUp(self):
            self.api = RestAPI({"users": [user("Adam"), user("Bob")]})

        def post(self, url, **payload):
            return self.api.post(url, json.dumps(payload))

        def test_duplicate_user(self):
            self.assertEqual(error(self.post("/add", user="Adam")), "user already exists")
            self.assertEqual(len(json.loads(self.api.get("/users"))["users"]), 2)

        def test_missing_user_name(self):
            self.assertEqual(error(self.post("/add")), "user name required")
            self.assertEqual(error(self.post("/add", user="")), "user name required")

        def test_unknown_lender_or_borrower(self):
            self.assertEqual(error(self.post("/iou", lender="Zed", borrower="Bob", amount=1)), "unknown user")
            self.assertEqual(error(self.post("/iou", lender="Adam", borrower="Zed", amount=1)), "unknown user")

        def test_same_lender_and_borrower(self):
            self.assertEqual(error(self.post("/iou", lender="Adam", borrower="Adam", amount=1)), "lender and borrower must differ")

        def test_bad_amounts(self):
            for amount in (0, -3, "5", None, True):
                with self.subTest(amount=amount):
                    self.assertEqual(error(self.post("/iou", lender="Adam", borrower="Bob", amount=amount)), "amount must be positive")

        def test_invalid_json(self):
            self.assertEqual(error(self.api.post("/add", "{not json")), "invalid payload")
            self.assertEqual(error(self.api.get("/users", "[")), "invalid payload")

        def test_unknown_route(self):
            self.assertEqual(error(self.api.get("/nope")), "unknown route")
            self.assertEqual(error(self.api.post("/nope", "{}")), "unknown route")

        def test_failed_iou_changes_nothing(self):
            self.post("/iou", lender="Adam", borrower="Zed", amount=5)
            self.assertEqual(json.loads(self.api.get("/users"))["users"], [user("Adam"), user("Bob")])
