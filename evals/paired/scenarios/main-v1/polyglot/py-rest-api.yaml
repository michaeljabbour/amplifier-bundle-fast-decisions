    import json
    import unittest
    from rest_api import RestAPI


    def user(name):
        return {"name": name, "owes": {}, "owed_by": {}, "balance": 0.0}


    def names(response):
        return [u["name"] for u in json.loads(response)["users"]]


    class DebtsTest(unittest.TestCase):
        def setUp(self):
            self.api = RestAPI({"users": [user("Chuck"), user("Adam"), user("Bob")]})

        def iou(self, lender, borrower, amount):
            self.api.post("/iou", json.dumps({"lender": lender, "borrower": borrower, "amount": amount}))

        def debts(self, payload=None):
            return json.loads(self.api.get("/debts", None if payload is None else json.dumps(payload)))["debts"]

        def test_no_debts(self):
            self.assertEqual(self.debts(), [])

        def test_single_debt(self):
            self.iou("Adam", "Bob", 4.5)
            self.assertEqual(self.debts(), [{"from": "Bob", "to": "Adam", "amount": 4.5}])

        def test_sorted_by_debtor_then_creditor(self):
            self.iou("Chuck", "Bob", 1)
            self.iou("Adam", "Bob", 2)
            self.iou("Bob", "Adam", 7)
            self.assertEqual(self.debts(), [
                {"from": "Adam", "to": "Bob", "amount": 5},
                {"from": "Bob", "to": "Chuck", "amount": 1},
            ])

        def test_netted_debts_disappear(self):
            self.iou("Adam", "Bob", 3)
            self.iou("Bob", "Adam", 3)
            self.assertEqual(self.debts(), [])

        def test_filter_by_debtor(self):
            self.iou("Adam", "Bob", 2)
            self.iou("Adam", "Chuck", 3)
            self.assertEqual(self.debts({"users": ["Chuck"]}), [{"from": "Chuck", "to": "Adam", "amount": 3}])
  hidden_money_test.py: |
    import json
    import unittest
    from rest_api import RestAPI


    def user(name):
        return {"name": name, "owes": {}, "owed_by": {}, "balance": 0.0}


    def names(response):
        return [u["name"] for u in json.loads(response)["users"]]


    class MoneyTest(unittest.TestCase):
        def setUp(self):
            self.api = RestAPI({"users": [user("Adam"), user("Bob")]})

        def iou(self, lender, borrower, amount):
            return json.loads(self.api.post("/iou", json.dumps({"lender": lender, "borrower": borrower, "amount": amount})))["users"]

        def test_cents_add_up_exactly(self):
            self.iou("Adam", "Bob", 0.1)
            adam, bob = self.iou("Adam", "Bob", 0.2)
            self.assertEqual(adam["owed_by"], {"Bob": 0.3})
            self.assertEqual(adam["balance"], 0.3)
            self.assertEqual(bob["owes"], {"Adam": 0.3})
            self.assertEqual(bob["balance"], -0.3)

        def test_ten_dimes_make_a_dollar(self):
            for _ in range(10):
                adam, bob = self.iou("Adam", "Bob", 0.1)
            self.assertEqual(adam["owed_by"], {"Bob": 1.0})
            self.assertEqual(bob["balance"], -1.0)

        def test_netting_leaves_no_float_dust(self):
            self.iou("Adam", "Bob", 0.3)
            adam, bob = self.iou("Bob", "Adam", 0.1)
            self.assertEqual(adam["owed_by"], {"Bob": 0.2})
            self.assertEqual(bob["owes"], {"Adam": 0.2})

        def test_exact_repayment_clears_both_sides(self):
            self.iou("Adam", "Bob", 0.7)
            adam, bob = self.iou("Bob", "Adam", 0.7)
            self.assertEqual((adam["owed_by"], adam["owes"], adam["balance"]), ({}, {}, 0))
            self.assertEqual((bob["owed_by"], bob["owes"], bob["balance"]), ({}, {}, 0))
