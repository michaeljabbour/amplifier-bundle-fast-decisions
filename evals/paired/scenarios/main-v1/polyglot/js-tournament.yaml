hidden_files:
  jest_shim.mjs: |
    import { describe as d, test as t } from 'node:test';
    import assert from 'node:assert/strict';

    const ctx = globalThis;
    ctx.describe = (name, fn) => d(name, fn);
    ctx.test = (name, fn) => t(name, fn);
    ctx.xtest = ctx.test;
    ctx.it = ctx.test;

    const matchErr = (e) => (err) => {
      if (e === undefined) return true;
      if (e instanceof Error) return err.message === e.message;
      if (typeof e === 'string') return String(err.message).includes(e);
      if (e instanceof RegExp) return e.test(err.message);
      if (typeof e === 'function') return err instanceof e;
      return true;
    };

    ctx.expect = (actual) => ({
      toEqual: (e) => assert.deepEqual(actual, e),
      toBe: (e) => assert.strictEqual(actual, e),
      toBeCloseTo: (e, digits = 2) => assert.ok(Math.abs(actual - e) < 10 ** -digits / 2, `${actual} is not close to ${e}`),
      toBeTruthy: () => assert.ok(actual),
      toBeFalsy: () => assert.ok(!actual),
      toThrow: (e) => assert.throws(actual, matchErr(e)),
      not: { toEqual: (e) => assert.notDeepEqual(actual, e), toBe: (e) => assert.notStrictEqual(actual, e) },
    });
  hidden_edge.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally } from './tournament.js';

    test('blank lines and a trailing newline are ignored', () => {
      const plain = tournamentTally('Allegoric Alaskans;Blithering Badgers;win');
      assert.equal(tournamentTally('Allegoric Alaskans;Blithering Badgers;win\n\n'), plain);
      assert.equal(tournamentTally('\nAllegoric Alaskans;Blithering Badgers;win\n\n\n'), plain);
    });

    test('unknown results and malformed lines are skipped', () => {
      const out = tournamentTally('A;B;win\nA;C;foo\nbad line\nA;B\nA;B;win;extra\nC;A;loss');
      assert.equal(
        out,
        [HEADER, row('A', 2, 2, 0, 0, 6), row('B', 1, 0, 0, 1, 0), row('C', 1, 0, 0, 1, 0)].join('\n'),
      );
    });

    test('only malformed lines give just the header', () => {
      assert.equal(tournamentTally('hello\n;;\nA;B;nope'), HEADER);
    });
  hidden_sort.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally } from './tournament.js';

    test('default order is points then name', () => {
      assert.equal(tournamentTally('Zed;Amy;win'), [HEADER, row('Zed', 1, 1, 0, 0, 3), row('Amy', 1, 0, 0, 1, 0)].join('\n'));
    });

    test('sort by name', () => {
      const out = tournamentTally('Zed;Amy;win', { sort: 'name' });
      assert.equal(out, [HEADER, row('Amy', 1, 0, 0, 1, 0), row('Zed', 1, 1, 0, 0, 3)].join('\n'));
    });

    test('explicit points sort and unknown values fall back to the default', () => {
      const plain = tournamentTally('Zed;Amy;win');
      assert.equal(tournamentTally('Zed;Amy;win', { sort: 'points' }), plain);
      assert.equal(tournamentTally('Zed;Amy;win', { sort: 'whatever' }), plain);
      assert.equal(tournamentTally('Zed;Amy;win', {}), plain);
    });
  hidden_results.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally, parseResults } from './tournament.js';

    test('parseResults returns one row per team', () => {
      assert.deepEqual(parseResults('Zed;Amy;win\nAmy;Bob;draw'), [
        { team: 'Zed', mp: 1, w: 1, d: 0, l: 0, p: 3 },
        { team: 'Amy', mp: 2, w: 0, d: 1, l: 1, p: 1 },
        { team: 'Bob', mp: 1, w: 0, d: 1, l: 0, p: 1 },
      ]);
    });

    test('parseResults on nothing', () => {
      assert.deepEqual(parseResults(''), []);
      assert.deepEqual(parseResults('x;y;z'), []);
    });

    test('parseResults honours the sort option', () => {
      assert.deepEqual(parseResults('Zed;Amy;win', { sort: 'name' }).map((r) => r.team), ['Amy', 'Zed']);
    });

    test('tournamentTally is unchanged', () => {
      assert.equal(tournamentTally('Zed;Amy;win'), [HEADER, row('Zed', 1, 1, 0, 0, 3), row('Amy', 1, 0, 0, 1, 0)].join('\n'));
    });
  hidden_points.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally, parseResults } from './tournament.js';

    test('custom points for a win', () => {
      const rows = parseResults('A;B;win\nC;D;draw', { points: { win: 2 } });
      assert.deepEqual(rows.map((r) => [r.team, r.p]), [['A', 2], ['C', 1], ['D', 1], ['B', 0]]);
    });

    test('a draw can be worth more than a win', () => {
      const out = tournamentTally('A;B;win\nC;D;draw', { points: { win: 1, draw: 3 } });
      assert.equal(
        out,
        [HEADER, row('C', 1, 0, 1, 0, 3), row('D', 1, 0, 1, 0, 3), row('A', 1, 1, 0, 0, 1), row('B', 1, 0, 0, 1, 0)].join('\n'),
      );
    });

    test('defaults are 3 and 1', () => {
      assert.deepEqual(parseResults('A;B;win\nC;D;draw', { points: {} }).map((r) => r.p), [3, 1, 1, 0]);
    });
  hidden_trunc.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally } from './tournament.js';

    test('long names are cut to 30 characters in the table', () => {
      const long = 'Extraordinarily Long Team Name FC';
      const out = tournamentTally(`${long};Short;win`);
      assert.equal(out, [HEADER, row(long.slice(0, 30), 1, 1, 0, 0, 3), row('Short', 1, 0, 0, 1, 0)].join('\n'));
      assert.ok(out.split('\n').every((l) => l.length === HEADER.length));
    });

    test('teams that share the first 30 characters stay separate', () => {
      const a = 'Same Prefix Of Thirty Characte-A';
      const b = 'Same Prefix Of Thirty Characte-B';
      const lines = tournamentTally(`${a};${b};draw`).split('\n');
      assert.equal(lines.length, 3);
      assert.equal(lines[1], row(a.slice(0, 30), 1, 0, 1, 0, 1));
    });
  hidden_array.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally, parseResults } from './tournament.js';

    test('an array of lines works like a string', () => {
      assert.equal(tournamentTally(['A;B;win', 'C;D;draw']), tournamentTally('A;B;win\nC;D;draw'));
      assert.deepEqual(parseResults(['A;B;win']), parseResults('A;B;win'));
    });

    test('an empty array gives the header', () => {
      assert.equal(tournamentTally([]), HEADER);
    });

    test('malformed entries in an array are skipped', () => {
      assert.equal(tournamentTally(['A;B;win', '', 'junk']), tournamentTally('A;B;win'));
    });
  hidden_json.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    const HEADER = 'Team                           | MP |  W |  D |  L |  P';
    const n = (v) => String(v).padStart(2);
    const row = (name, mp, w, d, l, p) => `${name.padEnd(30)} | ${n(mp)} | ${n(w)} | ${n(d)} | ${n(l)} | ${n(p)}`;
    import { tournamentTally, parseResults } from './tournament.js';

    test('json format', () => {
      const input = 'Zed;Amy;win\nAmy;Bob;draw';
      assert.deepEqual(JSON.parse(tournamentTally(input, { format: 'json' })), parseResults(input));
    });

    test('json format honours sort and points', () => {
      const rows = JSON.parse(tournamentTally('Zed;Amy;win', { format: 'json', sort: 'name', points: { win: 5 } }));
      assert.deepEqual(rows.map((r) => [r.team, r.p]), [['Amy', 0], ['Zed', 5]]);
    });

    test('json of nothing is an empty array', () => {
      assert.equal(tournamentTally('', { format: 'json' }), '[]');
    });

    test('default format is still the table', () => {
      assert.ok(tournamentTally('A;B;win').startsWith('Team'));
    });
