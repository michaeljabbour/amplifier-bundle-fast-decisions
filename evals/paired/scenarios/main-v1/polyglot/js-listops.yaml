  jest_shim.mjs: |
    import { describe as d, test as t } from 'node:test';
    import assert from 'node:assert/strict';

    const ctx = globalThis;
    ctx.describe = (name, fn) => d(name, fn);
    ctx.test = (name, fn) => t(name, fn);
    ctx.xtest = ctx.test;
    ctx.it = ctx.test;

    const matchErr = (e) => (err) => {
      if (e === undefined) return true;
      if (e instanceof Error) return err.message === e.message;
      if (typeof e === 'string') return String(err.message).includes(e);
      if (e instanceof RegExp) return e.test(err.message);
      if (typeof e === 'function') return err instanceof e;
      return true;
    };

    ctx.expect = (actual) => ({
      toEqual: (e) => assert.deepEqual(actual, e),
      toBe: (e) => assert.strictEqual(actual, e),
      toBeCloseTo: (e, digits = 2) => assert.ok(Math.abs(actual - e) < 10 ** -digits / 2, `${actual} is not close to ${e}`),
      toBeTruthy: () => assert.ok(actual),
      toBeFalsy: () => assert.ok(!actual),
      toThrow: (e) => assert.throws(actual, matchErr(e)),
      not: { toEqual: (e) => assert.notDeepEqual(actual, e), toBe: (e) => assert.notStrictEqual(actual, e) },
    });
  hidden_take.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    import { List } from './list-ops.js';

    test('take', () => {
      const l = new List([1, 2, 3]);
      assert.deepEqual(l.take(2).values, [1, 2]);
      assert.deepEqual(l.take(0).values, []);
      assert.deepEqual(l.take(-1).values, []);
      assert.deepEqual(l.take(10).values, [1, 2, 3]);
    });

    test('drop', () => {
      const l = new List([1, 2, 3]);
      assert.deepEqual(l.drop(1).values, [2, 3]);
      assert.deepEqual(l.drop(0).values, [1, 2, 3]);
      assert.deepEqual(l.drop(-2).values, [1, 2, 3]);
      assert.deepEqual(l.drop(10).values, []);
    });

    test('take and drop on an empty list', () => {
      assert.deepEqual(new List().take(3).values, []);
      assert.deepEqual(new List().drop(3).values, []);
    });
  hidden_immutable.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    import { List } from './list-ops.js';

    test('append leaves both lists unchanged', () => {
      const a = new List([1, 2]);
      const b = new List([3]);
      const c = a.append(b);
      assert.deepEqual(c.values, [1, 2, 3]);
      assert.deepEqual(a.values, [1, 2]);
      assert.deepEqual(b.values, [3]);
      assert.notStrictEqual(c, a);
    });

    test('concat leaves everything unchanged', () => {
      const a = new List([1]);
      const rest = new List([new List([2]), new List([3, 4])]);
      const c = a.concat(rest);
      assert.deepEqual(c.values, [1, 2, 3, 4]);
      assert.deepEqual(a.values, [1]);
      assert.equal(rest.values.length, 2);
      assert.deepEqual(rest.values[1].values, [3, 4]);
    });

    test('the constructor copies its argument', () => {
      const arr = [1, 2];
      const l = new List(arr);
      arr.push(3);
      assert.deepEqual(l.values, [1, 2]);
    });

    test('reverse, map and filter do not touch the receiver', () => {
      const l = new List([1, 2, 3]);
      l.reverse();
      l.map((x) => x + 1);
      l.filter((x) => x > 1);
      assert.deepEqual(l.values, [1, 2, 3]);
    });

    test('chained appends do not grow the first list', () => {
      const a = new List([1]);
      a.append(new List([2])).append(new List([3]));
      assert.deepEqual(a.values, [1]);
    });
  hidden_iter.test.mjs: |
    import { test } from 'node:test';
    import assert from 'node:assert/strict';
    import { List } from './list-ops.js';

    test('a list is iterable', () => {
      assert.deepEqual([...new List([1, 2, 3])], [1, 2, 3]);
      const seen = [];
      for (const x of new List(['a', 'b'])) seen.push(x);
      assert.deepEqual(seen, ['a', 'b']);
      assert.deepEqual([...new List()], []);
    });

    test('toArray returns a copy', () => {
      const l = new List([1, 2]);
      const arr = l.toArray();
      assert.deepEqual(arr, [1, 2]);
      arr.push(3);
      assert.deepEqual(l.toArray(), [1, 2]);
    });

    test('toArray keeps nested lists as they are', () => {
      const inner = new List([1]);
      assert.equal(new List([inner]).toArray()[0], inner);
    });
turns:
  - prompt: >-
