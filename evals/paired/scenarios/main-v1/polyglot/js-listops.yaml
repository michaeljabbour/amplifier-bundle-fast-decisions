    checks:
      - {kind: tests, runner: cmd, cmd: sed "s#from './list-ops'#from './list-ops.js'#" list-ops.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_take.test.mjs hidden_immutable.test.mjs hidden_iter.test.mjs, expect_regex: '# fail 0', restore: [list-ops.spec.js], hidden: [jest_shim.mjs, hidden_take.test.mjs, hidden_immutable.test.mjs, hidden_iter.test.mjs], timeout: 120}
