  - prompt: >-
      Fix a design problem: no method may modify the list it is called on or any list passed in.
      `append` and `concat` must return new lists, and the constructor must copy the array it is given
      instead of keeping a reference to it.
    checks:
      - {kind: tests, runner: cmd, cmd: sed "s#from './list-ops'#from './list-ops.js'#" list-ops.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_take.test.mjs hidden_immutable.test.mjs, expect_regex: '# fail 0', restore: [list-ops.spec.js], hidden: [jest_shim.mjs, hidden_take.test.mjs, hidden_immutable.test.mjs], timeout: 120}
  - prompt: >-
      Add your own tests in a new file `extra.test.mjs` using `node:test` and `node:assert/strict`
      (importing from ./list-ops.js): at least five `test(` cases covering immutability, folds,
      `take`/`drop` and `reverse`. Run it with `node --test extra.test.mjs`.
    checks:
      - {kind: file_regex, path: extra.test.mjs, pattern: \btest\(, min_count: 5}
      - {kind: tests, runner: cmd, cmd: node --test --test-reporter=tap extra.test.mjs, expect_regex: '# pass [1-9]', restore: [], hidden: [], timeout: 120}
      - {kind: tests, runner: cmd, cmd: sed "s#from './list-ops'#from './list-ops.js'#" list-ops.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_take.test.mjs hidden_immutable.test.mjs, expect_regex: '# fail 0', restore: [list-ops.spec.js], hidden: [jest_shim.mjs, hidden_take.test.mjs, hidden_immutable.test.mjs], timeout: 120}
  - prompt: >-
      Refactor list-ops.js so that `map`, `filter`, `length` and `reverse` are all implemented with
      `foldl` or `foldr` (through `this.foldl(...)` / `this.foldr(...)`) instead of their own loops.
      No behaviour change; keep all tests passing.
    checks:
      - {kind: file_regex, path: list-ops.js, pattern: 'this\.fold[lr]\(', min_count: 4}
      - {kind: tests, runner: cmd, cmd: sed "s#from './list-ops'#from './list-ops.js'#" list-ops.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_take.test.mjs hidden_immutable.test.mjs, expect_regex: '# fail 0', restore: [list-ops.spec.js], hidden: [jest_shim.mjs, hidden_take.test.mjs, hidden_immutable.test.mjs], timeout: 120}
  - prompt: >-
      Make `List` iterable (`for (const x of list)` and `[...list]` yield the items in order) and add
