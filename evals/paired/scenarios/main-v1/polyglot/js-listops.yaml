      pass, without using the built-in array methods for these operations (jest is not installed here,
      so check with plain node). Do not edit the provided spec file.
    checks:
      - {kind: tests, runner: cmd, cmd: 'sed "s#from ''./list-ops''#from ''./list-ops.js''#" list-ops.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs ', expect_regex: '# fail 0', restore: [list-ops.spec.js], hidden: [jest_shim.mjs], timeout: 120}
  - prompt: >-
