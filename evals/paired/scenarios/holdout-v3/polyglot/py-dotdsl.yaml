    import unittest

    from dot_dsl import ATTR, EDGE, NODE, Edge, Graph, Node


    class NeighborsTest(unittest.TestCase):
        def setUp(self):
            self.g = Graph([
                (NODE, "a", {}), (NODE, "b", {}), (NODE, "c", {}),
                (EDGE, "a", "b", {}), (EDGE, "b", "c", {}), (EDGE, "a", "c", {}),
            ])

        def test_neighbors_in_edge_order(self):
            self.assertEqual(self.g.neighbors("b"), ["a", "c"])
            self.assertEqual(self.g.neighbors("a"), ["b", "c"])

        def test_unknown_name_has_no_neighbors(self):
            self.assertEqual(self.g.neighbors("zz"), [])

        def test_no_duplicates_for_parallel_edges(self):
            g = Graph([(EDGE, "a", "b", {}), (EDGE, "b", "a", {"x": "1"})])
            self.assertEqual(g.neighbors("a"), ["b"])

        def test_self_loop(self):
            self.assertEqual(Graph([(EDGE, "a", "a", {})]).neighbors("a"), ["a"])

        def test_node_lookup(self):
            self.assertEqual(self.g.node("b"), Node("b", {}))
            with self.assertRaises(KeyError):
                self.g.node("zz")
  hidden_dup_test.py: |
    import unittest

    from dot_dsl import ATTR, EDGE, NODE, Edge, Graph, Node


    class DuplicateNodeTest(unittest.TestCase):
        def test_duplicate_node_name(self):
            with self.assertRaises(ValueError) as err:
                Graph([(NODE, "a", {}), (NODE, "a", {"x": "1"})])
            self.assertEqual(err.exception.args[0], "Duplicate node: a")

        def test_distinct_names_are_fine(self):
            self.assertEqual(len(Graph([(NODE, "a", {}), (NODE, "b", {})]).nodes), 2)

        def test_malformed_node_is_reported_before_duplicates(self):
            with self.assertRaises(ValueError) as err:
                Graph([(NODE, "a", {}), (NODE, "a", {}, 1)])
            self.assertEqual(err.exception.args[0], "Node is malformed")
  hidden_sub_test.py: |
    import unittest

    from dot_dsl import ATTR, EDGE, NODE, Edge, Graph, Node


    class SubgraphTest(unittest.TestCase):
        def setUp(self):
            self.g = Graph([
                (ATTR, "title", "T"),
                (NODE, "a", {"color": "green"}), (NODE, "b", {}), (NODE, "c", {}),
                (EDGE, "a", "b", {"w": "1"}), (EDGE, "b", "c", {}), (EDGE, "a", "c", {}),
            ])

        def test_keeps_only_requested_nodes_and_edges_between_them(self):
            s = self.g.subgraph(["a", "b"])
            self.assertEqual(s.nodes, [Node("a", {"color": "green"}), Node("b", {})])
            self.assertEqual(s.edges, [Edge("a", "b", {"w": "1"})])

        def test_graph_attributes_are_kept(self):
            self.assertEqual(self.g.subgraph(["c"]).attrs, {"title": "T"})

        def test_unknown_names_are_ignored(self):
            self.assertEqual(self.g.subgraph(["zz"]).nodes, [])

        def test_result_is_independent_of_the_original(self):
            s = self.g.subgraph(["a"])
            s.nodes[0].attrs["color"] = "red"
            s.attrs["title"] = "other"
            self.assertEqual(self.g.nodes[0].attrs, {"color": "green"})
            self.assertEqual(self.g.attrs, {"title": "T"})

        def test_original_order_is_kept(self):
            self.assertEqual([n.name for n in self.g.subgraph(["c", "a"]).nodes], ["a", "c"])
turns:
  - prompt: >-
      Implement the `Graph` class in dot_dsl.py (Node and Edge are provided) as described in
      .docs/instructions.md and .docs/instructions.append.md: `Graph(data)` takes a list of tuples
      `(ATTR, key, value)`, `(NODE, name, attrs)` and `(EDGE, src, dst, attrs)` and exposes `nodes`,
      `edges` and `attrs` (a dict) in input order. A non-list raises `TypeError("Graph data
      malformed")`, an item with fewer than two parts `TypeError("Graph item incomplete")`, and
      malformed attribute/node/edge items or an unknown kind raise `ValueError` with the messages the
      tests expect. Run the tests with `python3 -m pytest -q dot_dsl_test.py`.
    checks:
      - {kind: tests, runner: python, files: [dot_dsl_test.py], restore: [dot_dsl_test.py]}
  - prompt: >-
      In three to five sentences explain how `Graph.__init__` validates its input: in which order the
      checks happen, which exception type is used for each kind of problem and why a `TypeError` is
      used for some and a `ValueError` for others. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [TypeError, ValueError, len|length, item], any: [malformed, incomplete, unknown]}
  - prompt: >-
      `Node("a", {}) == 3` currently raises an AttributeError instead of being False, and comparing a
      Node with an Edge blows up the same way. Make equality return NotImplemented for foreign types
      (for both Node and Edge) so `==` is simply False and `!=` True, and add a readable `__repr__`
      for both: `Node('a', {'color': 'green'})` and `Edge('a', 'b', {})`.
    checks:
      - {kind: tests, runner: python, files: [dot_dsl_test.py, hidden_eq_test.py], restore: [dot_dsl_test.py], hidden: [hidden_eq_test.py]}
  - prompt: >-
      Add `Graph.to_dot()` returning the graph in DOT text: `graph {` first, then one line per graph
      attribute (`  foo="1";`), per node (`  a;` or `  a [color="green", shape="box"];`) and per edge
      (`  a -- b;` or `  a -- b [color="blue"];`), then `}`. Every line between the braces is indented by exactly
