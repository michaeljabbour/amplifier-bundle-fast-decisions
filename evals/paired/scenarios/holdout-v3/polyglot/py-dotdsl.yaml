    import unittest

    from dot_dsl import ATTR, EDGE, NODE, Edge, Graph, Node


    class ToDotTest(unittest.TestCase):
        def test_empty_graph(self):
            self.assertEqual(Graph().to_dot(), "graph {\n}\n")

        def test_full_graph(self):
            g = Graph([
                (ATTR, "foo", "1"),
                (NODE, "a", {"color": "green"}),
                (NODE, "b", {}),
                (EDGE, "a", "b", {"color": "blue"}),
            ])
            self.assertEqual(g.to_dot(), 'graph {\n  foo="1";\n  a [color="green"];\n  b;\n  a -- b [color="blue"];\n}\n')

        def test_several_attributes(self):
            g = Graph([(NODE, "a", {"color": "green", "shape": "box"})])
            self.assertEqual(g.to_dot(), 'graph {\n  a [color="green", shape="box"];\n}\n')

        def test_quotes_are_escaped(self):
            g = Graph([(NODE, "a", {"label": 'say "hi"'})])
            self.assertEqual(g.to_dot(), 'graph {\n  a [label="say \\"hi\\""];\n}\n')

        def test_edge_without_attributes(self):
            g = Graph([(EDGE, "a", "b", {})])
            self.assertEqual(g.to_dot(), "graph {\n  a -- b;\n}\n")
