    import unittest

    from dot_dsl import ATTR, EDGE, NODE, Edge, Graph, Node


    class EqReprTest(unittest.TestCase):
        def test_node_is_not_equal_to_other_types(self):
            self.assertFalse(Node("a", {}) == 3)
            self.assertFalse(Node("a", {}) == "a")
            self.assertTrue(Node("a", {}) != None)

        def test_edge_is_not_equal_to_other_types(self):
            self.assertFalse(Edge("a", "b", {}) == ("a", "b", {}))
            self.assertFalse(Edge("a", "b", {}) == Node("a", {}))

        def test_node_is_not_an_edge(self):
            self.assertNotEqual(Node("a", {}), Edge("a", "a", {}))

        def test_equal_values_still_equal(self):
            self.assertEqual(Node("a", {"x": "1"}), Node("a", {"x": "1"}))
            self.assertEqual(Edge("a", "b", {}), Edge("a", "b", {}))

        def test_repr(self):
            self.assertEqual(repr(Node("a", {"color": "green"})), "Node('a', {'color': 'green'})")
            self.assertEqual(repr(Edge("a", "b", {})), "Edge('a', 'b', {})")
