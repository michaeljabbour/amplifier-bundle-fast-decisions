source:
  desc: >-
    Aider polyglot-benchmark javascript/queen-attack (Exercism), outside the S2 slice; grown with
    notation, path, immutability and board-rendering turns
  repo: https://github.com/Aider-AI/polyglot-benchmark
  sha: 7e0611e77b54e2dea774cdc0aa00cf9f7ed6144f
workspace:
  kind: git
  repo: https://github.com/Aider-AI/polyglot-benchmark
