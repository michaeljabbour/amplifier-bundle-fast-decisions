      - {kind: tests, runner: python, files: [zipper_test.py], restore: [zipper_test.py]}
  - prompt: >-
      In three to five sentences explain what the zipper stores for each step down (the trail), how
      `up()` uses it to rebuild the parent, and why the edits do not change the tree you started from.
      Do not change any files.
