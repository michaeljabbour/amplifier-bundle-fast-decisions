    import copy
    import unittest

    from zipper import Zipper

    LEAF3 = {"value": 3, "left": None, "right": None}
    TREE = {
        "value": 1,
        "left": {"value": 2, "left": None, "right": dict(LEAF3)},
        "right": {"value": 4, "left": None, "right": None},
    }


    class PathTest(unittest.TestCase):
        def test_root(self):
            z = Zipper.from_tree(copy.deepcopy(TREE))
            self.assertEqual((z.depth(), z.path(), z.is_root()), (0, [], True))

        def test_one_step(self):
            z = Zipper.from_tree(copy.deepcopy(TREE)).left()
            self.assertEqual((z.depth(), z.path(), z.is_root()), (1, ["left"], False))

        def test_two_steps_and_leaf(self):
            z = Zipper.from_tree(copy.deepcopy(TREE)).left().right()
            self.assertEqual((z.depth(), z.path()), (2, ["left", "right"]))
            self.assertTrue(z.is_leaf())
            self.assertFalse(Zipper.from_tree(copy.deepcopy(TREE)).left().is_leaf())

        def test_up_shortens_the_path(self):
            z = Zipper.from_tree(copy.deepcopy(TREE)).left().right().up()
            self.assertEqual(z.path(), ["left"])
            self.assertEqual(z.depth(), 1)

        def test_set_value_keeps_the_path(self):
            z = Zipper.from_tree(copy.deepcopy(TREE)).right().set_value(9)
            self.assertEqual(z.path(), ["right"])
  hidden_find_test.py: |
    import copy
    import unittest

    from zipper import Zipper

    LEAF3 = {"value": 3, "left": None, "right": None}
    TREE = {
        "value": 1,
        "left": {"value": 2, "left": None, "right": dict(LEAF3)},
        "right": {"value": 4, "left": None, "right": None},
    }


    class FindTest(unittest.TestCase):
        def setUp(self):
            self.z = Zipper.from_tree(copy.deepcopy(TREE))

        def test_root_returns_to_the_top(self):
            z = self.z.left().right().root()
            self.assertEqual((z.value(), z.path()), (1, []))

        def test_find_in_the_whole_tree(self):
            self.assertEqual(self.z.find(3).path(), ["left", "right"])
            self.assertEqual(self.z.find(4).path(), ["right"])
            self.assertEqual(self.z.find(1).path(), [])
            self.assertIsNone(self.z.find(99))

        def test_find_only_searches_the_subtree(self):
            self.assertIsNone(self.z.left().find(4))
            self.assertIsNone(self.z.right().find(2))
            self.assertEqual(self.z.left().find(3).path(), ["left", "right"])

        def test_preorder_first_match_wins(self):
            tree = {"value": 5, "left": {"value": 7, "left": None, "right": None}, "right": {"value": 7, "left": None, "right": None}}
            self.assertEqual(Zipper.from_tree(tree).find(7).path(), ["left"])

        def test_found_zipper_can_go_up(self):
            self.assertEqual(self.z.find(3).up().value(), 2)

        def test_original_is_not_moved(self):
            self.z.find(3)
            self.assertEqual(self.z.path(), [])
  hidden_swap_test.py: |
    import copy
    import unittest

    from zipper import Zipper

    LEAF3 = {"value": 3, "left": None, "right": None}
    TREE = {
        "value": 1,
        "left": {"value": 2, "left": None, "right": dict(LEAF3)},
        "right": {"value": 4, "left": None, "right": None},
    }


    MIRRORED = {
        "value": 1,
        "left": {"value": 4, "left": None, "right": None},
        "right": {"value": 2, "left": {"value": 3, "left": None, "right": None}, "right": None},
    }


    class SwapTest(unittest.TestCase):
        def setUp(self):
            self.z = Zipper.from_tree(copy.deepcopy(TREE))

        def test_swap_children(self):
            tree = self.z.swap_children().to_tree()
            self.assertEqual((tree["left"]["value"], tree["right"]["value"]), (4, 2))
            self.assertEqual(tree["right"]["right"], LEAF3)

        def test_swap_on_a_leaf_changes_nothing(self):
            self.assertEqual(self.z.right().swap_children().to_tree(), TREE)

        def test_mirror_the_whole_tree(self):
            self.assertEqual(self.z.mirror().to_tree(), MIRRORED)

        def test_mirror_only_the_focus(self):
            tree = self.z.left().mirror().up().to_tree()
            self.assertEqual(tree["left"], {"value": 2, "left": LEAF3, "right": None})
            self.assertEqual(tree["right"], TREE["right"])

        def test_original_tree_is_untouched(self):
            self.z.mirror()
            self.assertEqual(self.z.to_tree(), TREE)

        def test_mirror_twice_is_identity(self):
            self.assertEqual(self.z.mirror().mirror().to_tree(), TREE)
  hidden_eq_test.py: |
    import copy
    import unittest

    from zipper import Zipper

    LEAF3 = {"value": 3, "left": None, "right": None}
    TREE = {
        "value": 1,
        "left": {"value": 2, "left": None, "right": dict(LEAF3)},
        "right": {"value": 4, "left": None, "right": None},
    }


    class EqReprTest(unittest.TestCase):
        def test_equal_for_equal_trees(self):
            self.assertEqual(Zipper.from_tree(copy.deepcopy(TREE)), Zipper.from_tree(copy.deepcopy(TREE)))

        def test_up_returns_an_equal_zipper(self):
            self.assertEqual(Zipper.from_tree(copy.deepcopy(TREE)).left().up(), Zipper.from_tree(copy.deepcopy(TREE)))

        def test_different_focus_is_different(self):
            self.assertNotEqual(Zipper.from_tree(copy.deepcopy(TREE)).left(), Zipper.from_tree(copy.deepcopy(TREE)))

        def test_different_value_is_different(self):
            z = Zipper.from_tree(copy.deepcopy(TREE))
            self.assertNotEqual(z.set_value(9), z)

        def test_different_paths_to_the_same_focus(self):
            z = Zipper.from_tree(copy.deepcopy(TREE))
            self.assertEqual(z.left().up().right(), z.right())

        def test_other_types_are_never_equal(self):
            self.assertFalse(Zipper.from_tree(copy.deepcopy(TREE)) == 3)

        def test_repr(self):
            z = Zipper.from_tree(copy.deepcopy(TREE)).left().right()
            self.assertEqual(repr(z), "Zipper(path=['left', 'right'], value=3)")
turns:
  - prompt: >-
      Implement the `Zipper` class in zipper.py as described in .docs/instructions.md:
      `Zipper.from_tree(tree)` (trees are dicts with `value`, `left` and `right`, an absent child is
      None), `value()`, `set_value(v)`, `left()`, `right()`, `up()`, `set_left(tree)`,
      `set_right(tree)` and `to_tree()`. Moves that are impossible (left/right of a missing child, up
      from the root) return None, and the edits return a zipper without changing the tree you started
      from. Run the tests with `python3 -m pytest -q zipper_test.py`.
