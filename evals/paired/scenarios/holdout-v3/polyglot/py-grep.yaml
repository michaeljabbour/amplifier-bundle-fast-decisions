    import os
    import tempfile
    import unittest

    from grep import grep


    class FileCase(unittest.TestCase):
        def setUp(self):
            self._dir = tempfile.TemporaryDirectory()
            self.addCleanup(self._dir.cleanup)
            self.a = self.write("a.txt", "alpha one\nBeta two\nalpha three\ngamma\n")
            self.b = self.write("b.txt", "delta\nalphabet soup\nepsilon alpha\n")

        def write(self, name, text):
            path = os.path.join(self._dir.name, name)
            with open(path, "w") as handle:
                handle.write(text)
            return path


    class CombinedFlagsTest(FileCase):
        def test_ni(self):
            self.assertEqual(grep("ALPHA", "-ni", [self.a]), "1:alpha one\n3:alpha three\n")

        def test_nx(self):
            self.assertEqual(grep("gamma", "-nx", [self.a]), "4:gamma\n")

        def test_vc(self):
            self.assertEqual(grep("alpha", "-vc", [self.a]), "2\n")

        def test_lv(self):
            self.assertEqual(grep("alpha", "-lv", [self.a]), f"{self.a}\n")

        def test_separate_flags_still_work(self):
            self.assertEqual(grep("ALPHA", "-n -i", [self.a]), "1:alpha one\n3:alpha three\n")
  hidden_word_test.py: |
    import os
    import tempfile
    import unittest

    from grep import grep


    class FileCase(unittest.TestCase):
        def setUp(self):
            self._dir = tempfile.TemporaryDirectory()
            self.addCleanup(self._dir.cleanup)
            self.a = self.write("a.txt", "alpha one\nBeta two\nalpha three\ngamma\n")
            self.b = self.write("b.txt", "delta\nalphabet soup\nepsilon alpha\n")

        def write(self, name, text):
            path = os.path.join(self._dir.name, name)
            with open(path, "w") as handle:
                handle.write(text)
            return path


    class WordTest(FileCase):
        def test_alphabet_is_not_a_word_match(self):
            self.assertEqual(grep("alpha", "-w", [self.b]), "epsilon alpha\n")

        def test_plain_words(self):
            self.assertEqual(grep("alpha", "-w", [self.a]), "alpha one\nalpha three\n")

        def test_with_ignore_case(self):
            self.assertEqual(grep("ALPHA", "-wi", [self.b]), "epsilon alpha\n")

        def test_with_count(self):
            self.assertEqual(grep("alpha", "-wc", [self.b]), "1\n")

        def test_whole_line_wins(self):
            self.assertEqual(grep("alpha", "-w -x", [self.b]), "")

        def test_pattern_is_literal(self):
            c = self.write("c.txt", "a.b here\naxb there\n")
            self.assertEqual(grep("a.b", "-w", [c]), "a.b here\n")
