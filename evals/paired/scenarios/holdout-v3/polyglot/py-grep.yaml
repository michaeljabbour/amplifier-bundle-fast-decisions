  hidden_count_test.py: |
    import os
    import tempfile
    import unittest

    from grep import grep


    class FileCase(unittest.TestCase):
        def setUp(self):
            self._dir = tempfile.TemporaryDirectory()
            self.addCleanup(self._dir.cleanup)
            self.a = self.write("a.txt", "alpha one\nBeta two\nalpha three\ngamma\n")
            self.b = self.write("b.txt", "delta\nalphabet soup\nepsilon alpha\n")

        def write(self, name, text):
            path = os.path.join(self._dir.name, name)
            with open(path, "w") as handle:
                handle.write(text)
            return path


    class CountTest(FileCase):
        def test_single_file(self):
            self.assertEqual(grep("alpha", "-c", [self.a]), "2\n")

        def test_several_files_are_prefixed(self):
            self.assertEqual(grep("alpha", "-c", [self.a, self.b]), f"{self.a}:2\n{self.b}:2\n")

        def test_zero_matches(self):
            self.assertEqual(grep("zzz", "-c", [self.a]), "0\n")

        def test_with_ignore_case(self):
            self.assertEqual(grep("beta", "-c -i", [self.a]), "1\n")

        def test_with_invert(self):
            self.assertEqual(grep("alpha", "-c -v", [self.a]), "2\n")

        def test_names_only_wins_over_count(self):
            self.assertEqual(grep("alpha", "-c -l", [self.a, self.b]), f"{self.a}\n{self.b}\n")
