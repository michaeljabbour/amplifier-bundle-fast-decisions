    checks:
      - {kind: file_regex, path: simple-linked-list.js, pattern: \*_elements\(\)}
      - {kind: file_regex, path: simple-linked-list.js, pattern: 'for \(let (?:e|previous) = ', absent: true}
      - {kind: tests, runner: cmd, cmd: sed "s#from './simple-linked-list'#from './simple-linked-list.js'#" simple-linked-list.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_iter.test.mjs hidden_pop.test.mjs hidden_at.test.mjs hidden_str.test.mjs hidden_eq.test.mjs, expect_regex: '# fail 0', restore: [simple-linked-list.spec.js], hidden: [jest_shim.mjs, hidden_iter.test.mjs, hidden_pop.test.mjs, hidden_at.test.mjs, hidden_str.test.mjs, hidden_eq.test.mjs], timeout: 120}
  - prompt: >-
      Review the changes you made in this session as a code reviewer would: list each file you changed
      or added, what changed, and any remaining edge case you did not cover. Do not change any files.
    checks:
      - {kind: keyed_facts, all: [simple-linked-list\.js, test], any: [edge, risk, not cover, remaining]}
