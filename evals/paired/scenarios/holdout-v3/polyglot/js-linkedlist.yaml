    checks:
      - {kind: file_regex, path: simple-linked-list.js, pattern: '(?s)/\*\*(?=(?:(?!\*/).)*head)(?=(?:(?!\*/).)*from)(?=(?:(?!\*/).)*iterable)(?:(?!\*/).)*\*/\s*export class List'}
      - {kind: tests, runner: cmd, cmd: sed "s#from './simple-linked-list'#from './simple-linked-list.js'#" simple-linked-list.spec.js > spec_run.test.mjs && node --import ./jest_shim.mjs --test --test-reporter=tap spec_run.test.mjs hidden_iter.test.mjs hidden_pop.test.mjs hidden_at.test.mjs hidden_str.test.mjs, expect_regex: '# fail 0', restore: [simple-linked-list.spec.js], hidden: [jest_shim.mjs, hidden_iter.test.mjs, hidden_pop.test.mjs, hidden_at.test.mjs, hidden_str.test.mjs], timeout: 120}
  - prompt: >-
