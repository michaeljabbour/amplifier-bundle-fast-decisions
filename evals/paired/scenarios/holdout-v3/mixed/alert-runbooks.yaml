    runner: cmd
    cmd: python3 _grade.py t5
    hidden:
    - _grade.py
    timeout: 60
- prompt: Do the same for all remaining alerts (P3 and P4). Every alert in data/alerts.csv must now have a runbook.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t6
    hidden:
    - _grade.py
    timeout: 60
- prompt: Which alerts escalate after 10 minutes or less? List their alert ids. Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - AL-107
    - AL-110
    - AL-116
    - AL-119
    - AL-122
    - AL-137
    - AL-140
- prompt: 'Write docs/escalation-matrix.md with a table (columns team, P1, P2, P3, P4, total): one row per team in data/teams.csv
    order, counting the alerts it owns at each severity, plus the row total.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t8
    hidden:
    - _grade.py
    timeout: 60
- prompt: 'Add a sixth column `runbook` to the table in docs/runbooks/index.md: a relative markdown link `[<alert_id>](<alert_id>.md)`
    for each row. Keep the row order.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t9
    hidden:
    - _grade.py
    timeout: 60
- prompt: Add a '## Runbooks' section to README.md that links docs/runbooks/index.md and docs/escalation-matrix.md and says
    every alert in data/alerts.csv has a page.
