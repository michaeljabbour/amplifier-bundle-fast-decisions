turns:
- prompt: How many alerts are defined at each severity (P1, P2, P3, P4) in data/alerts.csv? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - P1\D{0,6}(?<![\d.,])3(?:\.0+)?(?!\d|[.,]\d)
    - P2\D{0,6}(?<![\d.,])4(?:\.0+)?(?!\d|[.,]\d)
    - P3\D{0,6}(?<![\d.,])4(?:\.0+)?(?!\d|[.,]\d)
    - P4\D{0,6}(?<![\d.,])3(?:\.0+)?(?!\d|[.,]\d)
- prompt: Which team owns the most alerts, and how many? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - \bsearch\b
    - (?<![\d.,])5(?:\.0+)?(?!\d|[.,]\d)
- prompt: Create docs/runbooks/index.md titled `# Runbooks` with a table (columns alert_id, name, severity, service, owner)
    listing every alert, sorted by severity (P1 first) and then alert_id.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t3
    hidden:
    - _grade.py
    timeout: 60
- prompt: 'Create one runbook page per P1 alert as docs/runbooks/<alert_id>.md with exactly this layout: `# <name>`; `## Trigger`
    with the threshold in backticks, the service in backticks and its tier from data/services.csv in parentheses (e.g. `error_rate_5m
    > 5%` on service `ledger` (tier1).); `## Severity` containing only the severity; `## Owner` with `<team>, on-call <oncall
    email>, channel <channel>` from data/teams.csv; `## Escalation` saying `Escalate after <N> minutes.`'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t4
    hidden:
    - _grade.py
    timeout: 60
- prompt: Do the same for every P2 alert (same layout, same sources).
