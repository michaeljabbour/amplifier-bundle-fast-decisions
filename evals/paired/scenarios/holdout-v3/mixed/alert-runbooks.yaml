  - kind: file_regex
    path: README.md
    pattern: docs/runbooks/index\.md
  - kind: file_regex
    path: README.md
    pattern: docs/escalation-matrix\.md
  - kind: file_regex
    path: README.md
    pattern: data/alerts\.csv
    min_count: 2
