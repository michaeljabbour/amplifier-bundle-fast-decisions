turns:
- prompt: How many pages are under docs/<section>/ (every .md file in a section sub-folder), and how many internal links across
    them point to a file that does not exist? A link is `[text](target)`; resolve the target relative to the page's folder
    and ignore any `#fragment`. Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - (?<![\d.,])3,?2,?0(?:\.0+)?(?!\d|[.,]\d)
    - (?<![\d.,])1,?2(?:\.0+)?(?!\d|[.,]\d)
- prompt: 'Write docs/_reports/broken-links.md: a table (columns source, target) with one row per broken link: the page path
    relative to docs/ and the link target exactly as written; sorted by source, then target.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t2
    hidden:
    - _grade.py
    timeout: 60
- prompt: Right now, how many section pages have no inbound link at all from any other section page (links to missing files
    do not count, self-links do not count)? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - (?<![\d.,])3,?2(?:\.0+)?(?!\d|[.,]\d)
- prompt: 'docs/RENAMES.txt lists pages that were renamed (old -> new). Fix every broken link by pointing it at the renamed
    page: keep the link text and any `#fragment`, change only the path (relative to the linking page). Do not touch other
    lines.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t4
    hidden:
    - _grade.py
    timeout: 60
  gap_before_s: 420
- prompt: 'Create docs/tags.md: for every tag used in the `Tags:` lines of the section pages a `## <tag>` heading (alphabetical)
    followed by a bullet per page with that tag, `- [<page title>](<path relative to docs/>)`, sorted by title.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t5
    hidden:
    - _grade.py
    timeout: 60
- prompt: Which tag is used by the most pages, and by how many? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - \bcli\b
    - (?<![\d.,])6,?9(?:\.0+)?(?!\d|[.,]\d)
- prompt: 'Create docs/<section>/index.md for every section: a `# <Section>` title (section folder name capitalised, e.g.
    `# Guides`) and a bullet per page of that section, `- [<title>](<file name>)`, sorted by title. Do not list index.md itself.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t7
    hidden:
    - _grade.py
    timeout: 60
- prompt: 'Add scripts/linkcheck.py [--root DIR] (default docs): it walks DIR for *.md files and checks every `[text](target)`
    link that is not http(s), mailto or a bare #anchor; the target (fragment removed) resolved against the linking file''s
    folder must be an existing .md file under DIR. Print `BROKEN: <file relative to DIR> -> <target as written>` sorted, exit
    1; or print `ok` and exit 0.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t8
    hidden:
    - _grade.py
    timeout: 60
- prompt: 'Now that the renamed links are fixed, write docs/_reports/orphans.md: `# Orphan pages` and a bullet `- <path relative
    to docs/>` for every section page with no inbound link from another section page, sorted by path.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t9
    hidden:
    - _grade.py
    timeout: 60
  gap_before_s: 420
- prompt: Add a '## Maintenance' section to README.md that explains `python3 scripts/linkcheck.py`, points at docs/_reports/broken-links.md
    and docs/_reports/orphans.md, and mentions docs/RENAMES.txt.
  checks:
  - kind: doc_sections
    path: README.md
    headings:
    - Maintenance
  - kind: file_regex
    path: README.md
    pattern: scripts/linkcheck\.py
  - kind: file_regex
    path: README.md
    pattern: docs/_reports/orphans\.md
  - kind: file_regex
    path: README.md
    pattern: docs/RENAMES\.txt
