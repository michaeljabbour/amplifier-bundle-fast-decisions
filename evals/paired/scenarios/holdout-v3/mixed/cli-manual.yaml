      """taskq command line."""
      import argparse, json, os, sys


      def path():
          return os.path.join(os.environ.get("TASKQ_HOME", os.path.expanduser("~/.taskq")), "tasks.json")


      def load():
          return json.load(open(path(), encoding='utf-8')) if os.path.exists(path()) else []


      def save(items):
          os.makedirs(os.path.dirname(path()), exist_ok=True)
          json.dump(items, open(path(), 'w', encoding='utf-8'))


      def build():
          p = argparse.ArgumentParser(prog="taskq", description="Tiny task queue")
          sub = p.add_subparsers(dest="cmd", required=True)
          s = sub.add_parser("add", help="Add a task")
          s.add_argument("title", help="Task title")
          s.add_argument("--priority", type=int, default=3, choices=[1, 2, 3, 4, 5], help="Priority from 1 (high) to 5")
          s.add_argument("--due", help="Due date as YYYY-MM-DD")
          s.add_argument("--tag", action='append', help="Tag to attach (repeatable)")
          s = sub.add_parser("list", help="List tasks")
          s.add_argument("--status", default='open', choices=['open', 'done', 'all'], help="Which tasks to show")
          s.add_argument("--tag", help="Only tasks with this tag")
          s.add_argument("--limit", type=int, default=20, help="Maximum rows to print")
          s = sub.add_parser("done", help="Mark a task done")
          s.add_argument("id", type=int, help="Task id")
          s = sub.add_parser("export", help="Export tasks")
          s.add_argument("--format", default='json', choices=['json', 'csv'], help="Output format")
          s.add_argument("--output", default='-', help="File to write, - for stdout")
          s = sub.add_parser("purge", help="Delete finished tasks")
          s.add_argument("--dry-run", action="store_true", help="Only report what would be deleted")
          s = sub.add_parser("stats", help="Show task counts")
          return p


      def main(argv=None):
          a = build().parse_args(argv)
          items = load()
          if a.cmd == "add":
              n = max([t["id"] for t in items] + [0]) + 1
              items.append({"id": n, "title": a.title, "priority": a.priority, "due": a.due, "tags": a.tag or [], "done": False})
              save(items)
              print(f"added #{n}")
          elif a.cmd == "list":
              rows = [t for t in items if (a.status == "all" or t["done"] == (a.status == "done")) and (not a.tag or a.tag in t["tags"])]
              for t in sorted(rows, key=lambda t: (t["priority"], t["id"]))[: a.limit]:
                  print(f"#{t['id']} [P{t['priority']}] {t['title']}" + (f" (due {t['due']})" if t["due"] else ""))
          elif a.cmd == "done":
              for t in items:
                  if t["id"] == a.id:
                      t["done"] = True
                      save(items)
                      print(f"done #{a.id}")
                      return 0
              print(f"error: no task with id {a.id}", file=sys.stderr)
              return 3
          elif a.cmd == "export":
              out = json.dumps(items) if a.format == "json" else "\n".join(f"{t['id']},{t['title']}" for t in items)
              if a.output == "-":
                  print(out)
              else:
                  open(a.output, 'w', encoding='utf-8').write(out)
          elif a.cmd == "purge":
              gone = [t for t in items if t["done"]]
              if a.dry_run:
                  print(f"would purge {len(gone)} tasks")
              else:
                  save([t for t in items if not t["done"]])
                  print(f"purged {len(gone)} tasks")
          elif a.cmd == "stats":
              print(f"open: {sum(1 for t in items if not t['done'])}")
              print(f"done: {sum(1 for t in items if t['done'])}")
          return 0


      if __name__ == "__main__":
          sys.exit(main())
    README.md: |
      # taskq

      A tiny task queue. Run it with `python3 -m taskq <command>`; data lives in `$TASKQ_HOME/tasks.json` (default `~/.taskq`).
