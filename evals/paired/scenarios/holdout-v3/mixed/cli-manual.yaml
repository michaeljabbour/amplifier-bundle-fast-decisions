    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t2():
        heads = [re.sub(r'^#+\s*', '', l).strip() for l in read('docs/cli.md').splitlines() if l.startswith('### ')]
        need(heads == ['add', 'list', 'done', 'export', 'purge', 'stats'], 'command headings: ' + str(heads))
        for c, h in {'add': 'Add a task', 'list': 'List tasks', 'done': 'Mark a task done', 'export': 'Export tasks', 'purge': 'Delete finished tasks', 'stats': 'Show task counts'}.items():
            need(h in ' '.join(md_lines('docs/cli.md', '^' + c + '$')), 'description missing under ' + c)
        need(any(l.startswith('## Commands') for l in read('docs/cli.md').splitlines()), 'missing ## Commands')


    def t3():
        for c, opts in {'add': {'--priority': '`3`', '--due': '-', '--tag': '-'}, 'list': {'--status': '`open`', '--tag': '-', '--limit': '`20`'}, 'export': {'--format': '`json`', '--output': '`-`'}, 'purge': {'--dry-run': 'off'}}.items():
            rows = md_rows('docs/cli.md', '^' + c + '$')
            need(rows, 'no option table under ' + c)
            got = {r[0].strip('` '): r[1].strip() for r in rows[1:] if len(r) >= 3}
            need(got == opts, f'{c} options {got} != {opts}')
        for c, d in {'add': ['Priority from 1 (high) to 5', 'Due date as YYYY-MM-DD', 'Tag to attach (repeatable)'], 'list': ['Which tasks to show', 'Only tasks with this tag', 'Maximum rows to print'], 'export': ['Output format', 'File to write, - for stdout'], 'purge': ['Only report what would be deleted']}.items():
            body = ' '.join(md_lines('docs/cli.md', '^' + c + '$'))
            for h in d:
                need(h in body, 'description missing: ' + h)


    def t5():
        rows = md_rows('docs/cli.md', 'exit codes')
        got = {r[0].strip('` '): r[1].lower() for r in rows[1:] if len(r) >= 2}
        need(set(got) == {'0', '2', '3'}, 'exit codes listed: ' + str(sorted(got)))
        need('success' in got['0'] or 'ok' in got['0'], 'code 0 meaning')
        need('usage' in got['2'] or 'argument' in got['2'], 'code 2 meaning')
        need('not found' in got['3'] or 'no task' in got['3'] or 'unknown' in got['3'], 'code 3 meaning')


    def t6():
        import tempfile, os
        body = '\n'.join(md_lines('docs/cli.md', 'examples'))
        m = re.search(r'```(?:console|shell|sh|bash)?\n(.*?)```', body, re.S)
        need(m, 'no fenced example block under Examples')
        steps, cur = [], None
        for ln in m.group(1).splitlines():
            if ln.startswith('$ '):
                cur = [ln[2:], []]
                steps.append(cur)
            elif cur is not None and ln.strip():
                cur[1].append(ln.rstrip())
        need([c for c, _ in steps] == ['taskq add "Write docs" --priority 2 --due 2025-05-01', 'taskq add "Fix bug"', 'taskq list', 'taskq done 1', 'taskq stats', 'taskq purge --dry-run'], 'example commands: ' + str([c for c, _ in steps]))
        home = tempfile.mkdtemp()
        env = dict(os.environ, TASKQ_HOME=home)
        import shlex
        for c, want in steps:
            argv = ['python3', '-m', 'taskq'] + shlex.split(c)[1:]
            p = subprocess.run(argv, cwd=W, capture_output=True, text=True, env=env, timeout=30)
            need(p.returncode == 0, c + ' failed: ' + p.stderr[-200:])
            need([l.rstrip() for l in p.stdout.splitlines()] == want, f'{c}: documented output {want} != real {p.stdout.splitlines()}')


    def t8():
        txt = read('docs/cli.md')
        m = re.search(r'^##\s+Contents\s*\n(.*?)(?=^#)', txt, re.M | re.S)
        need(m, 'no ## Contents section before the first other heading')
        links = re.findall(r'\[([^\]]+)\]\(#([^)]+)\)', m.group(1))
        need([l[0] for l in links] == ['add', 'list', 'done', 'export', 'purge', 'stats'] and all(a == t for t, a in links), 'toc entries: ' + str(links))
        need(txt.index('## Contents') < txt.index('## Commands'), 'Contents must precede Commands')


    def t9():
        t = read('docs/taskq.1')
        need(re.search(r'^\.TH\s+TASKQ\s+1', t, re.M), 'missing .TH TASKQ 1')
        for sh in ['NAME', 'SYNOPSIS', 'COMMANDS', 'OPTIONS', 'EXIT STATUS']:
            need(re.search(r'^\.SH\s+' + sh + r'\s*$', t, re.M), 'missing .SH ' + sh)
        for c in ['add', 'list', 'done', 'export', 'purge', 'stats']:
            need(re.search(r'^\.B\s+' + c + r'\s*$', t, re.M), 'command not listed: ' + c)
        for o in ['--dry-run', '--due', '--format', '--limit', '--output', '--priority', '--status', '--tag']:
            need(re.search(r'^\.B\s+' + re.escape(o) + r'\s*$', t, re.M), 'option not listed: ' + o)


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn) and sys.argv[1] in ['t2', 't3', 't5', 't6', 't8', 't9'], "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
