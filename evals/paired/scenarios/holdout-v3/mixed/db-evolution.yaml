    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t3():
        chk_json('out/plan.json', {'order': ['005', '009', '004', '010', '011', '012', '003', '006', '002', '007', '008', '013', '001'], 'destructive': ['002', '003', '006', '011']})


    def t5():
        chk_json('out/plan.json', {'order': ['005', '009', '004', '010', '011', '012', '003', '006', '002', '007', '008', '013', '001'], 'destructive': ['002', '003', '006', '011'], 'tables': {'sessions': ['005', '004', '003'], 'orders': ['009', '010', '011', '006', '001'], 'users': ['010', '007'], 'invoices': ['011', '012', '008'], 'tags': ['012'], 'audit': ['002'], 'payments': ['013']}, 'conflicts': [['001', '006'], ['001', '009'], ['001', '010'], ['001', '011'], ['003', '004'], ['003', '005'], ['004', '005'], ['006', '009'], ['006', '010'], ['006', '011'], ['007', '010'], ['008', '011'], ['009', '010'], ['009', '011'], ['010', '011'], ['011', '012']]}, tol=0)


    def t6():
        rows = md_rows('docs/rollout.md', 'order')
        got = [(r[1], r[2].lower()) for r in rows[1:] if len(r) >= 3 and r[0].strip().isdigit()]
        need(got == [('005', 'no'), ('009', 'no'), ('004', 'no'), ('010', 'no'), ('011', 'yes'), ('012', 'no'), ('003', 'yes'), ('006', 'yes'), ('002', 'yes'), ('007', 'no'), ('008', 'no'), ('013', 'no'), ('001', 'no')], 'rollout table rows: ' + str(got[:4]))
        need([int(r[0]) for r in rows[1:] if r[0].strip().isdigit()] == list(range(1, 13 + 1)), 'step numbers')


    def t7():
        got = [ln.strip() for ln in read('out/rollback.sql').splitlines() if ln.strip()]
        need(got == ['ALTER TABLE orders DROP COLUMN c001;', 'ALTER TABLE payments DROP COLUMN c013;', 'DROP TABLE invoices;', 'DROP TABLE users;', '-- IRREVERSIBLE: 002', '-- IRREVERSIBLE: 006', '-- IRREVERSIBLE: 003', 'ALTER TABLE invoices DROP COLUMN c012;', '-- IRREVERSIBLE: 011', 'ALTER TABLE orders DROP COLUMN c010;', 'ALTER TABLE sessions DROP COLUMN c004;', 'DROP TABLE orders;', 'DROP TABLE sessions;'], 'rollback lines differ: ' + str(got[:4]))


    def t8():
        for rel, text in {'_alt/migrations/027_add_items.sql': '-- migration: 027_add_items\n-- depends: none\n-- touches: items, users\n-- destructive: yes\n\nALTER TABLE items DROP COLUMN legacy_027;\n', '_alt/migrations/021_rework_invoices.sql': '-- migration: 021_rework_invoices\n-- depends: 027\n-- touches: invoices\n-- destructive: no\n-- creates: invoices\n-- down: DROP TABLE invoices;\n\nCREATE TABLE invoices (id INTEGER PRIMARY KEY);\n', '_alt/migrations/025_extend_items.sql': '-- migration: 025_extend_items\n-- depends: 027\n-- touches: items\n-- destructive: no\n-- creates: items\n-- down: DROP TABLE items;\n\nCREATE TABLE items (id INTEGER PRIMARY KEY);\n', '_alt/migrations/026_backfill_users.sql': '-- migration: 026_backfill_users\n-- depends: 025, 027\n-- touches: users\n-- destructive: no\n-- down: ALTER TABLE users DROP COLUMN c026;\n\nALTER TABLE users ADD COLUMN c026 TEXT;\n', '_alt/migrations/023_extend_invoices.sql': '-- migration: 023_extend_invoices\n-- depends: none\n-- touches: invoices\n-- destructive: no\n\nALTER TABLE invoices ADD COLUMN c023 TEXT;\n', '_alt/migrations/022_extend_invoices.sql': '-- migration: 022_extend_invoices\n-- depends: 021, 027\n-- touches: invoices\n-- destructive: no\n-- down: ALTER TABLE invoices DROP COLUMN c022;\n\nALTER TABLE invoices ADD COLUMN c022 TEXT;\n', '_alt/migrations/024_extend_payments.sql': '-- migration: 024_extend_payments\n-- depends: none\n-- touches: payments, users\n-- destructive: no\n-- creates: payments\n-- down: DROP TABLE payments;\n\nCREATE TABLE payments (id INTEGER PRIMARY KEY);\n'}.items():
            p = W / rel
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(text, encoding='utf-8')
        need((W / 'scripts/plan.py').exists(), 'missing scripts/plan.py')
        chk_cmd_json('python3 scripts/plan.py --dir _alt/migrations', {'order': ['023', '024', '027', '021', '022', '025', '026'], 'destructive': ['027'], 'tables': {'invoices': ['023', '021', '022'], 'payments': ['024'], 'users': ['024', '027', '026'], 'items': ['027', '025']}, 'conflicts': [['021', '023'], ['022', '023'], ['024', '026'], ['024', '027']]}, tol=0)
        chk_cmd_json('python3 scripts/plan.py', {'order': ['005', '009', '004', '010', '011', '012', '003', '006', '002', '007', '008', '013', '001'], 'destructive': ['002', '003', '006', '011'], 'tables': {'sessions': ['005', '004', '003'], 'orders': ['009', '010', '011', '006', '001'], 'users': ['010', '007'], 'invoices': ['011', '012', '008'], 'tags': ['012'], 'audit': ['002'], 'payments': ['013']}, 'conflicts': [['001', '006'], ['001', '009'], ['001', '010'], ['001', '011'], ['003', '004'], ['003', '005'], ['004', '005'], ['006', '009'], ['006', '010'], ['006', '011'], ['007', '010'], ['008', '011'], ['009', '010'], ['009', '011'], ['010', '011'], ['011', '012']]}, tol=0)


    def t10():
        chk_json('out/plan.json', {'order': ['005', '009', '004', '010', '011', '012', '003', '006', '002', '007', '008', '013', '001', '014'], 'destructive': ['002', '003', '006', '011'], 'tables': {'sessions': ['005', '004', '003'], 'orders': ['009', '010', '011', '006', '001', '014'], 'users': ['010', '007'], 'invoices': ['011', '012', '008'], 'tags': ['012'], 'audit': ['002'], 'payments': ['013']}, 'conflicts': [['001', '006'], ['001', '009'], ['001', '010'], ['001', '011'], ['001', '014'], ['003', '004'], ['003', '005'], ['004', '005'], ['006', '009'], ['006', '010'], ['006', '011'], ['006', '014'], ['007', '010'], ['008', '011'], ['009', '010'], ['009', '011'], ['010', '011'], ['010', '014'], ['011', '012'], ['011', '014']]}, tol=0)


    def t11():
        got = [ln.strip() for ln in read('out/rollback.sql').splitlines() if ln.strip()]
        need(got == ['DROP INDEX idx_orders_created;', 'ALTER TABLE orders DROP COLUMN c001;', 'ALTER TABLE payments DROP COLUMN c013;', 'DROP TABLE invoices;', 'DROP TABLE users;', '-- IRREVERSIBLE: 002', '-- IRREVERSIBLE: 006', '-- IRREVERSIBLE: 003', 'ALTER TABLE invoices DROP COLUMN c012;', '-- IRREVERSIBLE: 011', 'ALTER TABLE orders DROP COLUMN c010;', 'ALTER TABLE sessions DROP COLUMN c004;', 'DROP TABLE orders;', 'DROP TABLE sessions;'], 'rollback lines differ: ' + str(got[:4]))


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn) and sys.argv[1] in ['t10', 't11', 't3', 't5', 't6', 't7', 't8'], "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
