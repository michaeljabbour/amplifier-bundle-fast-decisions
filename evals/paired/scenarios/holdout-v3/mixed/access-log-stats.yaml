      # access-logs

      Log format (one request per line, files in `logs/`):

      `<ip> - - [<dd/Mon/yyyy:HH:MM:SS +0000>] "<METHOD> <target> HTTP/1.1" <status> <bytes> <seconds>`

      A line that does not match this format exactly is malformed. Blank lines are not lines.
