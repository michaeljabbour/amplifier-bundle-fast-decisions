to a monorepo\n\n- Status: Rejected\n- Date: 2025-02-25\n- Supersedes: none\n- Superseded by: none\n\n## Context\n\nThree repositories drift apart.\n\n## Decision\n\nStay with separate repositories and share code through a package.\n\n## Consequences\n\nRelease coordination stays manual.\n', 'docs/adr/0007-jobs-sqs.md': '# ADR-0007: Use SQS instead of RabbitMQ\n\n- Status: Accepted\n- Date: 2025-03-05\n- Supersedes: ADR-0004\n- Superseded by: none\n\n## Context\n\nRunning RabbitMQ costs more on-call time than the jobs justify.\n\n## Decision\n\nMove background jobs to the managed SQS service.\n\n## Consequences\n\nNo broker to patch; message size is capped at 256 KB.\n', 'docs/adr/0008-structured-logs.md': '# ADR-0008: Emit structured JSON logs\n\n- Status: Accepted\n- Date: 2025-03-12\n- Supersedes: none\n- Superseded by: none\n\n## Context\n\nGrepping free-text logs does not scale.\n\n## Decision\n\nAll services log one JSON object per line.\n\n## Consequences\n\nLog tooling must parse JSON; local reading is harder.\n', 'docs/adr/0009-feature-flags.md': '# ADR-0009: Use a feature flag service\n\n- Status: Proposed\n- Date: 2025-03-19\n- Supersedes: none\n- Superseded by: none\n\n## Context\n\nReleases are coupled to deploys.\n\n## Decision\n\nEvaluate a hosted flag service for a quarter.\n\n## Consequences\n\nDecision deferred until the trial ends.\n', 'docs/adr/0010-api-v2.md': '# ADR-0010: Replace /v1 with /v2 in 2026\n\n- Status: Accepted\n- Date: 2025-03-27\n- Supersedes: none\n- Superseded by: none\n\n## Context\n\nThe /v1 pagination model cannot be extended.\n\n## Decision\n\nIntroduce /v2 with cursor pagination and sunset /v1 in 2026.\n\n## Consequences\n\nTwo versions run side by side for a year.\n', 'docs/adr/0011-cache-redis.md': '# ADR-0011: Move the cache to Redis\n\n- Status: Accepted\n- Date: 2025-04-02\n- Supersedes: ADR-0005\n- Superseded by: none\n\n## Context\n\nPer-instance caches show inconsistent prices.\n\n## Decision\n\nUse a shared Redis 7 cache with a 60 second TTL.\n\n## Consequences\n\nA new dependency; cache is consistent across instances.\n', 'docs/adr/0012-sunset-v1.md': '# ADR-0012: Announce the /v1 sunset date\n\n- Status: Proposed\n- Date: 2025-04-09\n- Supersedes: none\n- Superseded by: none\n\n## Context\n\nPartners need a date to plan against.\n\n## Decision\n\nPropose 2026-06-30 as the /v1 shutdown date.\n\n## Consequences\n\nPartner communication is required before acceptance.\n'}.items():
