# holdout-v3 batch B (docs, 10 turns): Turn meeting-note decisions into architecture decision records: numbering by date, exact section content, supersession chains, an index, an ADR linter, and a second batch of notes that changes the chain.
id: adr-records
task_type: docs
language: markdown
split: holdout
default_gap_s: 10
source:
  desc: 'Turn meeting-note decisions into architecture decision records: numbering by date, exact section content, supersession
    chains, an index, an ADR linter, and a second batch of notes that changes the chain.'
  kind: self-authored deterministic workspace
  adapted_from:
  - new self-authored decision notes; ADR-writing theme (cf. amplifier-agent documentation tasks)
workspace:
  kind: inline
  files:
    notes/2025-01-14-use-postgres.txt: |
      slug: use-postgres
      title: Use PostgreSQL for orders
      date: 2025-01-14
      status: accepted
      replaces: none
      context: Orders outgrew the single SQLite file and need concurrent writers.
      decision: Store orders in PostgreSQL 15 behind a repository interface.
      consequences: We must run and back up a database server; migrations become mandatory.
    notes/2025-01-21-adopt-rest.txt: |
      slug: adopt-rest
      title: Expose a REST API
      date: 2025-01-21
      status: accepted
      replaces: none
      context: Partners ask for a stable integration surface.
      decision: Publish a versioned REST API under /v1 with JSON bodies.
      consequences: Clients get a stable contract; breaking changes require /v2.
    notes/2025-02-03-graphql-gateway.txt: |
      slug: graphql-gateway
      title: Add a GraphQL gateway
      date: 2025-02-03
      status: rejected
      replaces: none
      context: The mobile team wanted flexible queries.
      decision: Do not build a GraphQL gateway this year.
      consequences: Mobile keeps using REST with a few purpose-built endpoints.
    notes/2025-02-11-queue-rabbit.txt: |
      slug: queue-rabbit
      title: Use RabbitMQ for background jobs
      date: 2025-02-11
      status: accepted
      replaces: none
      context: Email and export jobs block request threads.
      decision: Run jobs through RabbitMQ with a worker pool of 8.
      consequences: Operations owns another stateful service; jobs gain retries.
    notes/2025-02-18-cache-memory.txt: |
      slug: cache-memory
      title: Cache lookups in process memory
      date: 2025-02-18
      status: accepted
      replaces: none
      context: Catalogue reads dominate traffic.
      decision: Keep a 60 second in-process cache for catalogue reads.
      consequences: Each instance warms its own cache; staleness is bounded by 60 seconds.
    notes/2025-02-25-monorepo.txt: |
      slug: monorepo
      title: Move to a monorepo
      date: 2025-02-25
      status: rejected
      replaces: none
      context: Three repositories drift apart.
      decision: Stay with separate repositories and share code through a package.
      consequences: Release coordination stays manual.
    notes/2025-03-05-jobs-sqs.txt: |
      slug: jobs-sqs
      title: Use SQS instead of RabbitMQ
      date: 2025-03-05
      status: accepted
      replaces: queue-rabbit
      context: Running RabbitMQ costs more on-call time than the jobs justify.
      decision: Move background jobs to the managed SQS service.
      consequences: No broker to patch; message size is capped at 256 KB.
    notes/2025-03-12-structured-logs.txt: |
      slug: structured-logs
      title: Emit structured JSON logs
      date: 2025-03-12
      status: accepted
      replaces: none
      context: Grepping free-text logs does not scale.
      decision: All services log one JSON object per line.
      consequences: Log tooling must parse JSON; local reading is harder.
    notes/2025-03-19-feature-flags.txt: |
      slug: feature-flags
      title: Use a feature flag service
      date: 2025-03-19
      status: proposed
      replaces: none
      context: Releases are coupled to deploys.
      decision: Evaluate a hosted flag service for a quarter.
      consequences: Decision deferred until the trial ends.
    notes/2025-03-27-api-v2.txt: |
      slug: api-v2
      title: Replace /v1 with /v2 in 2026
      date: 2025-03-27
      status: accepted
      replaces: none
      context: The /v1 pagination model cannot be extended.
      decision: Introduce /v2 with cursor pagination and sunset /v1 in 2026.
      consequences: Two versions run side by side for a year.
    notes/2025-04-02-cache-redis.txt: |
      slug: cache-redis
      title: Move the cache to Redis
      date: 2025-04-02
      status: accepted
      replaces: cache-memory
      context: Per-instance caches show inconsistent prices.
      decision: Use a shared Redis 7 cache with a 60 second TTL.
      consequences: A new dependency; cache is consistent across instances.
    notes/2025-04-09-sunset-v1.txt: |
      slug: sunset-v1
      title: Announce the /v1 sunset date
      date: 2025-04-09
      status: proposed
      replaces: none
      context: Partners need a date to plan against.
      decision: Propose 2026-06-30 as the /v1 shutdown date.
      consequences: Partner communication is required before acceptance.
    README.md: |
      # decisions

      `notes/` holds one decision note per file (`slug`, `title`, `date`, `status`, `replaces`, `context`, `decision`, `consequences`). Architecture decision records go in `docs/adr/` as `NNNN-<slug>.md`, numbered 0001, 0002, ... in order of the note's date (ties by slug).
