hidden_files:
  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t2():
        cur, got = None, {}
        for ln in read('docs/reference.md').splitlines():
            if ln.startswith('## '):
                cur = ln[3:].strip()
                got[cur] = []
            elif ln.startswith('### ') and cur:
                got[cur].append(ln[4:].strip())
        need(got == {'geom.shapes': ['area_rect', 'area_circle', 'area_triangle', 'perimeter_rect'], 'geom.transform': ['translate', 'scale', 'rotate'], 'geom.stats': ['centroid', 'bounding_box']}, 'headings differ: ' + str(got))


    def t3():
        for name, sig in {'area_rect': 'def area_rect(w: float, h: float) -> float', 'area_circle': 'def area_circle(r: float, precision: int = 2) -> float', 'area_triangle': 'def area_triangle(a: float, b: float, c: float) -> float', 'perimeter_rect': 'def perimeter_rect(w: float, h: float) -> float', 'translate': 'def translate(points, dx: float = 0.0, dy: float = 0.0)', 'scale': 'def scale(points, factor: float, origin=(0.0, 0.0))', 'rotate': 'def rotate(points, degrees: float, origin=(0.0, 0.0), precision: int = 6)', 'centroid': 'def centroid(points)', 'bounding_box': 'def bounding_box(points)'}.items():
            body = '\n'.join(md_lines('docs/reference.md', '^' + name + '$'))
            m = re.search(r'```python\n(.*?)```', body, re.S)
            need(m, 'no python block under ' + name)
            need(sig in m.group(1), f'signature for {name}: want {sig}, block has {m.group(1).strip()}')


    def t5():
        for name, rs in {'area_rect': ['ValueError'], 'area_circle': ['ValueError'], 'area_triangle': ['ValueError'], 'perimeter_rect': [], 'translate': [], 'scale': [], 'rotate': [], 'centroid': ['ValueError'], 'bounding_box': ['ValueError']}.items():
            body = '\n'.join(md_lines('docs/reference.md', '^' + name + '$'))
            if rs:
                m = re.search(r'^\*\*Raises:\*\*\s*(.*)$', body, re.M)
                need(m, 'no **Raises:** line under ' + name)
                got = sorted(x.strip('` ') for x in m.group(1).split(','))
                need(got == rs, f'{name} raises {got} != {rs}')
            else:
                need('**Raises:**' not in body, name + ' wrongly documents Raises')


    def t6():
        for name, d in {'area_circle': {'precision': '2'}, 'translate': {'dx': '0.0', 'dy': '0.0'}, 'scale': {'origin': '(0.0, 0.0)'}, 'rotate': {'origin': '(0.0, 0.0)', 'precision': '6'}}.items():
            rows = md_rows('docs/reference.md', '^' + name + '$')
            need(rows, 'no defaults table under ' + name)
            got = {r[0].strip('` '): r[1].strip('` ') for r in rows[1:] if len(r) >= 2}
            need(got == d, f'{name} defaults {got} != {d}')
        for name in ['area_rect', 'area_triangle', 'perimeter_rect', 'centroid', 'bounding_box']:
            need(not md_rows('docs/reference.md', '^' + name + '$'), name + ' has no defaults, so no table')


    def t7():
        import importlib, sys
        sys.path.insert(0, os.getcwd())
        sh = importlib.import_module('geom.shapes')
        need(sh.perimeter_triangle(3, 4, 5) == 12, 'perimeter_triangle(3,4,5)')
        try:
            sh.perimeter_triangle(1, 2, 9)
            fail('no ValueError for impossible triangle')
        except ValueError:
            pass
        need(sh.area_rect(2, 3) == 6, 'existing code broken')
        body = '\n'.join(md_lines('docs/reference.md', '^perimeter_triangle$'))
        need('def perimeter_triangle(a: float, b: float, c: float) -> float' in body, 'signature block missing')
        need(re.search(r'^\*\*Raises:\*\*.*ValueError', body, re.M), 'Raises line missing')
        heads = [l for l in read('docs/reference.md').splitlines() if l.startswith('### ')]
        need(heads.index('### perimeter_triangle') == heads.index('### perimeter_rect') + 1, 'must follow perimeter_rect in source order')


    def t8():
        d = W / '_altpkg' / 'demo'
        d.mkdir(parents=True, exist_ok=True)
        (d / 'm.py').write_text('def alpha(x):\n    return x\n\n\ndef beta(x):\n    return x\n\n\ndef _hidden():\n    pass\n', encoding='utf-8')
        (W / '_altpkg' / 'ref.md').write_text('# ref\n\n## demo.m\n\n### alpha\n\ntext\n', encoding='utf-8')
        need((W / 'scripts/check_docs.py').exists(), 'missing scripts/check_docs.py')
        chk_cmd_out('python3 scripts/check_docs.py --src _altpkg/demo --docs _altpkg/ref.md', ['MISSING: demo.m.beta'], expect_rc=1)
        chk_cmd_out('python3 scripts/check_docs.py', ['ok'])


    def t9():
        rows = md_rows('docs/index.md', 'module summary')
        got = [(r[0].strip('` '), int(num(r[1])), r[2]) for r in rows[1:] if len(r) >= 3]
        need(sorted(got) == [('geom.shapes', 5, 'Areas and perimeters of simple shapes.'), ('geom.stats', 2, 'Summary statistics for point sets.'), ('geom.transform', 3, 'Point transformations on lists of (x, y) tuples.')], 'module summary rows: ' + str(got))


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn) and sys.argv[1] in ['t2', 't3', 't5', 't6', 't7', 't8', 't9'], "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
