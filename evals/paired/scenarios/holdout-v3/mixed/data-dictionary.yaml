    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t2():
        rows = md_rows('docs/data-dictionary.md', 'columns')
        need(rows and [c.lower() for c in rows[0][:3]] == ['column', 'type', 'nulls'], 'header: ' + str(rows[:1]))
        got = {r[0].strip('` '): [r[1], int(num(r[2]))] for r in rows[1:] if len(r) >= 3}
        want = {'order_id': ['text', 0], 'customer_id': ['text', 0], 'country': ['text', 31], 'channel': ['text', 0], 'order_date': ['date', 0], 'total': ['decimal', 0], 'discount_pct': ['integer', 39], 'shipped': ['boolean', 0], 'notes': ['text', 89]}
        need(got == want, 'type/nulls differ: ' + str({k: (got.get(k), v) for k, v in want.items() if got.get(k) != v}))
        need(list(got) == ['order_id', 'customer_id', 'country', 'channel', 'order_date', 'total', 'discount_pct', 'shipped', 'notes'], 'column order')


    def t4():
        rows = md_rows('docs/data-dictionary.md', 'columns')
        need([c.lower() for c in rows[0][:6]] == ['column', 'type', 'nulls', 'distinct', 'min', 'max'], 'header: ' + str(rows[:1]))
        got = {r[0].strip('` '): [r[1], int(num(r[2])), int(num(r[3])), r[4].strip('` '), r[5].strip('` ')] for r in rows[1:] if len(r) >= 6}
        want = {'order_id': ['text', 0, 180, '-', '-'], 'customer_id': ['text', 0, 52, '-', '-'], 'country': ['text', 31, 5, '-', '-'], 'channel': ['text', 0, 3, '-', '-'], 'order_date': ['date', 0, 75, '2025-01-01', '2025-03-28'], 'total': ['decimal', 0, 180, '5.39', '398.07'], 'discount_pct': ['integer', 39, 4, '0', '15'], 'shipped': ['boolean', 0, 2, '-', '-'], 'notes': ['text', 89, 3, '-', '-']}
        need(got == want, 'differs: ' + str({k: (got.get(k), v) for k, v in want.items() if got.get(k) != v}))


    def t5():
        txt = read('docs/data-dictionary.md')
        m = re.search(r'^## Categorical values\s*$(.*?)(?=^## |\Z)', txt, re.M | re.S)
        need(m, 'missing ## Categorical values')
        got = {}
        for mm in re.finditer(r'^- `(\w+)`:\s*(.*)$', m.group(1), re.M):
            got[mm.group(1)] = [x.strip('` ') for x in mm.group(2).split(',')]
        need(got == {'country': ['DE', 'ES', 'FR', 'UK', 'US'], 'channel': ['app', 'store', 'web'], 'discount_pct': ['0', '10', '15', '5'], 'notes': ['call first', 'gift', 'rush']}, f'categorical lists differ: {got}')


    def t7():
        rows = md_rows('docs/data-dictionary.md', 'revenue by channel')
        got = {r[0].strip('` '): num(r[1]) for r in rows[1:] if len(r) >= 2}
        need(sorted(got) == ['app', 'store', 'web'] and all(abs(got[k] - v) <= 0.011 for k, v in {'app': 14566.63, 'web': 13918.99, 'store': 9916.64}.items()), 'channel sums: ' + str(got))
        need(len(rows[1:]) == 3, 'three rows')


    def t8():
        import tempfile
        (W / '_alt').mkdir(exist_ok=True)
        (W / '_alt/t.csv').write_text('id,flag,amount,day,note\n1,true,2.5,2025-01-02,\n2,false,10.25,2025-01-09,x\n3,true,,2025-02-01,x\n', encoding='utf-8')
        need((W / 'scripts/profile.py').exists(), 'missing scripts/profile.py')
        chk_cmd_json('python3 scripts/profile.py --csv _alt/t.csv', {
            'id': {'type': 'integer', 'nulls': 0, 'distinct': 3, 'min': '1', 'max': '3'},
            'flag': {'type': 'boolean', 'nulls': 0, 'distinct': 2, 'min': '-', 'max': '-'},
            'amount': {'type': 'decimal', 'nulls': 1, 'distinct': 2, 'min': '2.50', 'max': '10.25'},
            'day': {'type': 'date', 'nulls': 0, 'distinct': 3, 'min': '2025-01-02', 'max': '2025-02-01'},
            'note': {'type': 'text', 'nulls': 1, 'distinct': 1, 'min': '-', 'max': '-'}}, tol=0)
        chk_cmd_json('python3 scripts/profile.py', {'order_id': {'type': 'text', 'nulls': 0, 'distinct': 180, 'min': '-', 'max': '-'}, 'customer_id': {'type': 'text', 'nulls': 0, 'distinct': 52, 'min': '-', 'max': '-'}, 'country': {'type': 'text', 'nulls': 31, 'distinct': 5, 'min': '-', 'max': '-'}, 'channel': {'type': 'text', 'nulls': 0, 'distinct': 3, 'min': '-', 'max': '-'}, 'order_date': {'type': 'date', 'nulls': 0, 'distinct': 75, 'min': '2025-01-01', 'max': '2025-03-28'}, 'total': {'type': 'decimal', 'nulls': 0, 'distinct': 180, 'min': '5.39', 'max': '398.07'}, 'discount_pct': {'type': 'integer', 'nulls': 39, 'distinct': 4, 'min': '0', 'max': '15'}, 'shipped': {'type': 'boolean', 'nulls': 0, 'distinct': 2, 'min': '-', 'max': '-'}, 'notes': {'type': 'text', 'nulls': 89, 'distinct': 3, 'min': '-', 'max': '-'}}, tol=0)


    def t9():
        rows = md_rows('docs/data-dictionary.md', 'columns')
        got = {r[0].strip('` '): [r[1], int(num(r[2])), int(num(r[3])), r[4].strip('` '), r[5].strip('` ')] for r in rows[1:] if len(r) >= 6}
        want = {'order_id': ['text', 0, 180, '-', '-'], 'customer_id': ['text', 0, 56, '-', '-'], 'country': ['text', 47, 5, '-', '-'], 'channel': ['text', 0, 3, '-', '-'], 'order_date': ['date', 0, 81, '2025-01-01', '2025-03-28'], 'total': ['decimal', 0, 240, '5.39', '399.01'], 'discount_pct': ['integer', 50, 4, '0', '15'], 'shipped': ['boolean', 0, 2, '-', '-'], 'notes': ['text', 118, 3, '-', '-']}
        need(got == want, 'refresh profile differs: ' + str({k: (got.get(k), v) for k, v in want.items() if got.get(k) != v}))
        need('240' in read('docs/data-dictionary.md'), 'mention the new row count 240')


    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn) and sys.argv[1] in ['t2', 't4', 't5', 't7', 't8', 't9'], "unknown check " + str(sys.argv[1:]))
        fn()
