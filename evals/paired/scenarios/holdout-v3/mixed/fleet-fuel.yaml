    - Data quality
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t7
    hidden:
    - _grade.py
    timeout: 60
- prompt: 'Add scripts/fuel.py: it prints a JSON object {vehicle: l_per_100km} (2 decimals, same rules as out/economy.csv,
    anomalous rows ignored). --csv PATH selects the fuel log (default data/fuel_log.csv); vehicles.csv is read from the same
