      # fleet-fuel

      `data/fuel_log.csv` holds one row per fill-up (date, vehicle, odometer_km, litres, price_per_l, station).
      `data/vehicles.csv` lists tank capacity per vehicle. Cost of a fill = litres x price_per_l rounded to 2 decimals.
