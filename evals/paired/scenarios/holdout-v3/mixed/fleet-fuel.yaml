    if __name__ == "__main__":
        fn = globals().get(sys.argv[1]) if len(sys.argv) > 1 else None
        need(callable(fn) and sys.argv[1] in ['t3', 't5', 't7', 't8'], "unknown check " + str(sys.argv[1:]))
        fn()
        print("OK")
turns:
- prompt: How many fill-up rows are in data/fuel_log.csv, how many distinct vehicles appear, and what is the total of the
    litres column over all rows (1 decimal)? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - (?<![\d.,])1,?6,?8(?:\.0+)?(?!\d|[.,]\d)
    - (?<![\d.,])1,?2(?:\.0+)?(?!\d|[.,]\d)
    - (?<![\d.,])1,?0,?1,?5,?3\.10*(?!\d|[.,]\d)
- prompt: 'Some fills are physically impossible: litres larger than the vehicle''s tank_l in data/vehicles.csv. How many such
    rows are there, and which vehicles are involved? Do not change any files.'
  checks:
  - kind: keyed_facts
    all:
    - (?<![\d.,])3(?:\.0+)?(?!\d|[.,]\d)
    - V-04
    - V-05
    - V-06
- prompt: 'Create out/anomalies.json: a JSON list with one object {vehicle, date, reason} per bad row. reason is `over_tank`
    (litres > tank_l) or `odometer_decrease` (odometer lower than the vehicle''s previous kept fill-up by date; a row flagged
    earlier does not become the reference). If both apply use odometer_decrease.'
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t3
    hidden:
    - _grade.py
    timeout: 60
- prompt: Ignoring every row listed in out/anomalies.json, what is the total fuel spend over the remaining rows? A fill costs
    litres x price_per_l rounded to 2 decimals; give the sum to 2 decimals. Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - (?<![\d.,])1,?5,?7,?3,?0\.540*(?!\d|[.,]\d)
- prompt: Write out/economy.csv with columns vehicle, km, litres, l_per_100km over the non-anomalous rows only. Per vehicle,
    order its rows by date; the first kept row is only a baseline; km is the sum of odometer differences between consecutive
    kept rows and litres is the sum of the litres of every kept row except the baseline. l_per_100km = litres / km * 100 rounded
    to 2 decimals (litres to 1 decimal). Sort by l_per_100km ascending.
  checks:
  - kind: tests
    runner: cmd
    cmd: python3 _grade.py t5
    hidden:
    - _grade.py
    timeout: 60
- prompt: Using out/economy.csv, which vehicle is the most economical and which the least, and what are their l_per_100km
    values? Do not change any files.
  checks:
  - kind: keyed_facts
    all:
    - V-03
    - (?<![\d.,])6\.550*(?!\d|[.,]\d)
    - V-11
    - (?<![\d.,])1,?7\.230*(?!\d|[.,]\d)
- prompt: Write report.md with level-2 sections Summary, Monthly spend and Data quality. Monthly spend is a table (month as
    YYYY-MM in the first column, spend in the second, 2 decimals) over non-anomalous rows only.
  checks:
  - kind: doc_sections
