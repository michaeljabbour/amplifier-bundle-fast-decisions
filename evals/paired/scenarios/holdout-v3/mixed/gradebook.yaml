  _grade.py: |
    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t3():
        import csv
        need((W / 'out/final.csv').exists(), 'missing out/final.csv')
        rd = list(csv.DictReader(open('out/final.csv', encoding='utf-8', newline='')))
        need(rd and list(rd[0].keys()) == ['id', 'homework_avg', 'exams_avg', 'participation_avg', 'final', 'letter'], 'header ' + str(rd and list(rd[0])))
        got = [[r['id'], round(float(r['homework_avg']), 2), round(float(r['exams_avg']), 2), round(float(r['participation_avg']), 2), round(float(r['final']), 2), r['letter']] for r in rd]
        want = [['S103', 86.43, 97.5, 86.67, 91.99, 'A'], ['S119', 95.0, 89.0, 93.33, 91.83, 'A'], ['S111', 92.62, 88.0, 93.33, 90.38, 'A'], ['S113', 92.86, 88.5, 86.67, 90.06, 'A'], ['S121', 85.95, 91.0, 80.0, 87.88, 'B'], ['S101', 83.57, 87.0, 86.67, 85.6, 'B'], ['S112', 85.71, 83.0, 80.0, 83.79, 'B'], ['S116', 77.62, 79.0, 80.0, 78.55, 'C'], ['S128', 75.71, 81.0, 60.0, 76.79, 'C'], ['S125', 78.1, 63.5, 80.0, 70.99, 'C'], ['S123', 78.57, 63.5, 73.33, 70.51, 'C'], ['S105', 75.95, 68.0, 53.33, 69.71, 'D'], ['S117', 72.62, 69.0, 60.0, 69.55, 'D'], ['S126', 68.33, 65.5, 73.33, 67.42, 'D'], ['S129', 65.0, 63.0, 73.33, 64.83, 'D'], ['S100', 64.05, 65.5, 60.0, 64.37, 'D'], ['S108', 59.52, 68.0, 60.0, 63.81, 'D'], ['S118', 63.1, 63.5, 66.67, 63.65, 'D'], ['S122', 83.1, 40.0, 86.67, 61.9, 'D'], ['S124', 59.52, 64.0, 53.33, 61.14, 'D'], ['S120', 60.71, 60.0, 53.33, 59.62, 'F'], ['S127', 60.48, 58.5, 60.0, 59.44, 'F'], ['S114', 60.24, 54.0, 46.67, 55.76, 'F'], ['S107', 58.1, 51.0, 60.0, 54.74, 'F'], ['S115', 57.86, 52.5, 53.33, 54.73, 'F'], ['S109', 73.1, 33.5, 66.67, 52.65, 'F'], ['S104', 68.1, 38.5, 60.0, 52.49, 'F'], ['S106', 49.76, 52.5, 60.0, 52.15, 'F'], ['S110', 56.43, 49.0, 40.0, 51.07, 'F'], ['S102', 47.38, 53.0, 46.67, 50.12, 'F']]
        need([g[0] for g in got] == [w[0] for w in want], 'order/ids differ: ' + str([g[0] for g in got][:4]))
        for g, w in zip(got, want):
            need(all(abs(a - b) <= 0.011 for a, b in zip(g[1:5], w[1:5])) and g[5] == w[5], f'{g} != {w}')


    def t5():
        chk_table('report.md', 'distribution', {'A': 4, 'B': 3, 'C': 4, 'D': 9, 'F': 10})
        rows = md_rows('report.md', 'top')
        got = [(r[0], num(r[1])) for r in rows if len(r) >= 2 and r[0].startswith('S') and num(r[1]) is not None]
        need([g[0] for g in got[:3]] == ['S103', 'S119', 'S111'] and all(abs(g[1] - w) <= 0.011 for g, w in zip(got, [91.99, 91.83, 90.38])), 'top 3 table: ' + str(got[:3]))


    def t6():
        import csv
