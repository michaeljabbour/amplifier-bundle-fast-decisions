    README.md: |
      # gradebook

      Weights: homework 40%, exams 50%, participation 10%. Each score is a percentage of the assignment's max (data/assignments.csv). A missing score row counts as 0. For homework the lowest percentage per student is dropped.
      Letter: A >= 90, B >= 80, C >= 70, D >= 60, otherwise F, using the final grade rounded to 2 decimals.
