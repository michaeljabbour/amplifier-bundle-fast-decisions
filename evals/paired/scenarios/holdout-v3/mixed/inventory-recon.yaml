    import csv, json, os, re, subprocess, sys
    from pathlib import Path

    W = Path(".")


    def fail(msg):
        print("FAIL:", msg)
        sys.exit(1)


    def need(cond, msg):
        if not cond:
            fail(msg)


    def read(rel):
        p = W / rel
        need(p.exists(), f"missing {rel}")
        return p.read_text(encoding="utf-8")


    def load_json(rel):
        try:
            return json.loads(read(rel))
        except ValueError as e:
            fail(f"{rel} is not valid JSON: {e}")


    def close(a, b, tol=0.011):
        try:
            return abs(float(a) - float(b)) <= tol
        except (TypeError, ValueError):
            return False


    def num(s):
        m = re.search(r"-?\d[\d,]*\.?\d*", str(s))
        return float(m.group(0).replace(",", "")) if m else None


    def run(cmd, timeout=60, stdin=None):
        p = subprocess.run(cmd, shell=True, cwd=W, capture_output=True, text=True, timeout=timeout, input=stdin)
        return p.returncode, p.stdout, p.stderr


    def md_lines(rel, under=None):
        lines = read(rel).splitlines()
        if not under:
            return lines
        out, on, lvl = [], False, 0
        for ln in lines:
            m = re.match(r"^(#+)\s+(.*)", ln)
            if m:
                if on and len(m.group(1)) <= lvl:
                    break
                if not on and re.search(under, m.group(2), re.I):
                    on, lvl = True, len(m.group(1))
                continue
            if on:
                out.append(ln)
        need(on, f"no heading matching {under!r} in {rel}")
        return out


    def md_rows(rel, under=None):
        rows = []
        for ln in md_lines(rel, under):
            if ln.strip().startswith("|") and not re.match(r"^\s*\|[\s:|-]+\|\s*$", ln):
                rows.append([c.strip() for c in ln.strip().strip("|").split("|")])
        return rows


    def cmp(got, want, tol, path):
        if isinstance(want, dict):
            need(isinstance(got, dict), f"{path}: expected an object, got {type(got).__name__}")
            for k, v in want.items():
                need(k in got, f"{path}.{k}: missing")
                cmp(got[k], v, tol, f"{path}.{k}")
        elif isinstance(want, list):
            need(isinstance(got, list) and len(got) == len(want), f"{path}: expected list of {len(want)}, got {got!r}")
            for i, (g, w) in enumerate(zip(got, want)):
                cmp(g, w, tol, f"{path}[{i}]")
        elif isinstance(want, bool) or want is None or isinstance(want, str):
            need(got == want, f"{path}: {got!r} != {want!r}")
        else:
            need(not isinstance(got, bool) and close(got, want, tol), f"{path}: {got!r} != {want!r}")


    def chk_json(rel, exp, tol=0.051):
        cmp(load_json(rel), exp, tol, rel)


    def chk_table(rel, under, exp, col=1, tol=0.051):
        rows = md_rows(rel, under)
        need(rows, f"no table under {under!r} in {rel}")
        got = {r[0].strip("* `"): num(r[col]) for r in rows if len(r) > col and num(r[col]) is not None}
        for k, v in exp.items():
            need(k in got and close(got[k], v, tol), f"{k}: {got.get(k)} != {v}")


    def chk_cmd_json(cmd, exp, tol=0.051, stdin=None):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == 0, f"`{cmd}` exited {rc}: {err[-200:]}")
        try:
            d = json.loads(out)
        except ValueError as e:
            fail(f"`{cmd}` stdout is not JSON: {e}")
        cmp(d, exp, tol, cmd)


    def chk_cmd_out(cmd, lines, stdin=None, expect_rc=0):
        rc, out, err = run(cmd, stdin=stdin)
        need(rc == expect_rc, f"`{cmd}` exited {rc} (want {expect_rc}): {err[-200:]}")
        got = [ln.rstrip() for ln in out.strip().splitlines()]
        need(got == list(lines), f"`{cmd}` output {got[:8]} != {list(lines)[:8]}")


    def t3():
        chk_json('out/variance.json', {'rows_counted': 69, 'mismatched': 24, 'net_variance_units': -40, 'abs_variance_units': 128, 'variance_value': -1455.43})


    def t6():
        chk_table('report.md', 'by warehouse', {'WH-A': -1754.6, 'WH-B': 299.17})


    def t6b():
        rows = md_rows('report.md', 'top 5')
        need(len(rows) >= 6, 'need header + 5 rows')
        got = [r for r in rows[1:] if r[0].startswith('SKU-')]
        need([r[0] for r in got] == ['SKU-1007', 'SKU-1077', 'SKU-1329', 'SKU-1329', 'SKU-1189'], 'top-5 order: ' + str([r[0] for r in got]))
        need([int(num(r[-1])) for r in got] == [17, 9, 9, 9, 7], 'absolute variances')


    def t7():
        import csv
        need((W / 'out/reorder.csv').exists(), 'missing out/reorder.csv')
        with open('out/reorder.csv', encoding='utf-8', newline='') as f:
            rd = list(csv.DictReader(f))
        need(rd and list(rd[0].keys()) == ['sku', 'on_hand', 'open_inbound', 'reorder_point', 'shortfall'], 'header: ' + str(rd and list(rd[0].keys())))
        got = [[r['sku'], int(r['on_hand']), int(r['open_inbound']), int(r['shortfall'])] for r in rd]
        need(got == [['SKU-1000', 18, 0, 21], ['SKU-1154', 28, 0, 17], ['SKU-1210', 23, 0, 15], ['SKU-1042', 19, 0, 13], ['SKU-1196', 17, 0, 7], ['SKU-1294', 38, 0, 5], ['SKU-1245', 34, 0, 4], ['SKU-1168', 31, 0, 3], ['SKU-1224', 8, 0, 3], ['SKU-1147', 38, 0, 1]], 'rows differ: ' + str(got[:4]))


    def t10():
        import os
        for rel, text in {'data/skus.csv': 'sku,name,unit_cost,reorder_point,supplier\nSKU-1000,Washer D29,47.95,27,Acme\nSKU-1007,Bearing C48,5.62,38,Delta\nSKU-1014,Sensor G50,34.94,35,Acme\nSKU-1021,Spring E15,46.00,40,Acme\nSKU-1028,Clamp H38,3.94,22,Acme\n', 'data/system_stock.csv': 'sku,warehouse,qty_system\nSKU-1000,WH-A,32\nSKU-1000,WH-B,27\nSKU-1000,WH-C,12\nSKU-1007,WH-A,14\nSKU-1007,WH-B,13\nSKU-1007,WH-C,26\nSKU-1014,WH-A,10\nSKU-1014,WH-B,19\nSKU-1014,WH-C,21\nSKU-1021,WH-A,0\nSKU-1021,WH-B,6\nSKU-1021,WH-C,26\nSKU-1028,WH-A,19\nSKU-1028,WH-B,20\nSKU-1028,WH-C,23\n', 'data/cycle_counts.csv': 'sku,warehouse,qty_counted,counted_on\nSKU-1000,WH-A,32,2025-02-22\nSKU-1000,WH-C,12,2025-02-27\nSKU-1007,WH-A,20,2025-02-26\nSKU-1007,WH-C,25,2025-02-21\nSKU-1014,WH-A,16,2025-02-24\nSKU-1014,WH-B,19,2025-02-21\nSKU-1014,WH-C,22,2025-02-27\nSKU-1021,WH-A,0,2025-02-25\nSKU-1021,WH-B,6,2025-02-28\nSKU-1021,WH-C,26,2025-02-24\nSKU-1028,WH-A,19,2025-02-25\nSKU-1028,WH-C,23,2025-02-20\n', 'data/inbound.csv': 'po,sku,qty,eta,status\nPO-4400,SKU-1000,25,2025-03-27,open\nPO-4401,SKU-1021,25,2025-03-20,cancelled\nPO-4402,SKU-1014,50,2025-03-17,open\nPO-4403,SKU-1021,20,2025-03-26,open\nPO-4404,SKU-1007,50,2025-03-11,open\nPO-4405,SKU-1021,50,2025-03-25,received\n'}.items():
            p = W / '_alt' / rel
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(text, encoding='utf-8')
        need((W / 'scripts/recon.py').exists(), 'missing scripts/recon.py')
