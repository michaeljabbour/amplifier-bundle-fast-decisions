    README.md: |
      # stockroom

      Monthly stock reconciliation inputs live in `data/`:

      - `skus.csv` - sku, name, unit_cost, reorder_point, supplier
      - `system_stock.csv` - the ERP stock snapshot taken 2025-03-01 (sku, warehouse, qty_system)
      - `cycle_counts.csv` - physical counts (sku, warehouse, qty_counted, counted_on). Counts dated before 2025-03-01 are stale.
      - `inbound.csv` - purchase orders (po, sku, qty, eta, status = open | received | cancelled)

      Variance = qty_counted - qty_system. Outputs go to `out/`; helper scripts go to `scripts/`.
protected:
- data/skus.csv
- data/system_stock.csv
- data/cycle_counts.csv
- data/inbound.csv
