hidden_files:
  hidden/test_exc.py: |
    import pytest

    from validators.utils import ValidationError, validator


    @validator
    def boom(value):
        return 1 / 0


    @validator
    def picky(value):
        if value < 0:
            raise ValueError("negative")
        return True


    def test_programming_errors_propagate():
        with pytest.raises(ZeroDivisionError):
            boom(1)


    def test_value_errors_become_validation_errors_with_reason():
        result = picky(-1)
        assert isinstance(result, ValidationError)
        assert result.reason == "negative"


    @validator
    def encoder(value):
        return value.encode("ascii") is not None


    @validator
    def measure(value):
        return len(value) > 0


    def test_unicode_errors_become_validation_errors():
        result = encoder("caf\u00e9")
        assert isinstance(result, ValidationError)
        assert "ascii" in result.reason


    def test_type_errors_become_validation_errors():
        result = measure(None)
        assert isinstance(result, ValidationError)
        assert result.reason
  hidden/test_env.py: |
    import pytest

    from validators import slug
    from validators.utils import ValidationError


    def test_only_the_string_True_enables_raising(monkeypatch):
        monkeypatch.setenv("RAISE_VALIDATION_ERROR", "0")
        assert isinstance(slug("bad.slug"), ValidationError)
        monkeypatch.setenv("RAISE_VALIDATION_ERROR", "no")
        assert isinstance(slug("bad.slug"), ValidationError)


    def test_True_raises(monkeypatch):
        monkeypatch.setenv("RAISE_VALIDATION_ERROR", "True")
        with pytest.raises(ValidationError):
            slug("bad.slug")


    def test_unset_does_not_raise(monkeypatch):
        monkeypatch.delenv("RAISE_VALIDATION_ERROR", raising=False)
        assert not slug("bad.slug")
        assert slug("good-slug")
  hidden/test_repr.py: |
    from validators import slug


    def test_repr_lists_only_the_arguments():
        assert repr(slug("my.slug")) == "ValidationError(func=slug, args={'value': 'my.slug'})"


    def test_str_matches_repr():
        err = slug("my.slug")
        assert str(err) == repr(err)
