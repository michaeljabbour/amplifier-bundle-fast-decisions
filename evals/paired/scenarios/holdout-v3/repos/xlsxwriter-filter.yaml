    import io
    import unittest
    import zipfile

    from xlsxwriter import Workbook
    from xlsxwriter.exceptions import OverlappingRange


    def _book():
        buf = io.BytesIO()
        return Workbook(buf, {"in_memory": True}), buf


    def _parts(workbook, buf):
        workbook.close()
        z = zipfile.ZipFile(buf)
        return z.namelist(), z.read("xl/worksheets/sheet1.xml").decode()


    class TestFilterBodyOverlap(unittest.TestCase):
        def test_autofilter_over_table_body(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.add_table("A3:C8", {"autofilter": False})
            with self.assertRaises(OverlappingRange):
                ws.autofilter("A1:C5")
            names, xml = _parts(wb, buf)
            self.assertNotIn("<autoFilter", xml)
            self.assertIn("xl/tables/table1.xml", names)

        def test_table_over_existing_autofilter(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.autofilter("A1:C5")
            with self.assertRaises(OverlappingRange):
                ws.add_table("A3:C8")
            names, xml = _parts(wb, buf)
            self.assertNotIn("xl/tables/table1.xml", names)
            self.assertEqual(xml.count("<autoFilter"), 1)

        def test_adjacent_and_disjoint_ranges_are_fine(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.autofilter("A1:C5")
            ws.add_table("A6:C9")
            ws.add_table("E1:G4")
            names, xml = _parts(wb, buf)
            self.assertIn("xl/tables/table2.xml", names)
            self.assertEqual(xml.count("<autoFilter"), 1)

        def test_header_row_overlap_still_raises(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.add_table("A1:C5", {"autofilter": True})
            with self.assertRaises(OverlappingRange):
                ws.autofilter("A1:C5")
  xlsxwriter/test/workbook/test_filter_overlap_message_hidden.py: |
    import io
    import unittest
    import zipfile

    from xlsxwriter import Workbook
    from xlsxwriter.exceptions import OverlappingRange


    def _book():
        buf = io.BytesIO()
        return Workbook(buf, {"in_memory": True}), buf


    def _parts(workbook, buf):
        workbook.close()
        z = zipfile.ZipFile(buf)
        return z.namelist(), z.read("xl/worksheets/sheet1.xml").decode()


    class TestFilterOverlapMessages(unittest.TestCase):
        def test_autofilter_message_names_both_ranges(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.add_table("A3:C8", {"autofilter": False})
            with self.assertRaises(OverlappingRange) as cm:
                ws.autofilter("A1:C5")
            message = str(cm.exception)
            self.assertIn("A1:C5", message)
            self.assertIn("A3:C8", message)
            self.assertIn("autofilter", message.lower())
            wb.close()

        def test_table_message_names_both_ranges(self):
            wb, buf = _book()
            ws = wb.add_worksheet()
            ws.autofilter("A1:C5")
            with self.assertRaises(OverlappingRange) as cm:
                ws.add_table("A3:C8")
            message = str(cm.exception)
            self.assertIn("A1:C5", message)
            self.assertIn("A3:C8", message)
            self.assertIn("autofilter", message.lower())
            wb.close()
turns:
  - prompt: >-
      XlsxWriter writes a corrupt file when a worksheet autofilter and a table autofilter sit on the
      same range: `ws.add_table("A1:C5", {"autofilter": True})` followed by `ws.autofilter("A1:C5")`
      (or the two calls in the opposite order) is accepted silently and Excel then reports the file as
      damaged. It should raise `xlsxwriter.exceptions.OverlappingRange` like the other overlap checks
      in worksheet.py. Please find where the two filters are recorded and fix it. Run the tests from
      this directory with `python3 -m pytest -q xlsxwriter/test/workbook/test_overlap_exceptions.py`.
    checks:
      - {kind: tests, runner: python, files: [xlsxwriter/test/workbook/test_overlap_exceptions.py], hidden: [xlsxwriter/test/workbook/test_overlap_exceptions.py]}
