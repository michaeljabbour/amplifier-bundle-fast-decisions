hidden_files:
  hidden/test_required.py: |
    import pytest

    from cssselect import ExpressionError, GenericTranslator, HTMLTranslator, parse

    REQUIRED = "@required and (name(.) = 'input' or name(.) = 'select' or name(.) = 'textarea')"


    def test_html_translator_matches_required_form_controls():
        assert HTMLTranslator().css_to_xpath("input:required") == f"descendant-or-self::input[{REQUIRED}]"
        assert HTMLTranslator().css_to_xpath("INPUT:required") == f"descendant-or-self::input[{REQUIRED}]"


    def test_combines_with_other_conditions():
        xpath = HTMLTranslator().css_to_xpath("input.big:required")
        assert xpath == (
            "descendant-or-self::input[(@class and contains(concat(' ', normalize-space(@class), ' '), ' big ')) "
            f"and ({REQUIRED})]"
        )


    def test_generic_translator_never_matches():
        assert GenericTranslator().css_to_xpath("input:required") == "descendant-or-self::input[0]"


    def test_other_unknown_pseudo_classes_still_fail():
        with pytest.raises(ExpressionError):
            HTMLTranslator().css_to_xpath("input:optional")


    def test_specificity_counts_as_a_class():
        assert parse("input:required")[0].specificity() == (0, 1, 1)
