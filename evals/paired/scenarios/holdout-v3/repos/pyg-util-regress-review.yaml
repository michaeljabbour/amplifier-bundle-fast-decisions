    from pygments.util import duplicates_removed


    def test_order_is_preserved():
        assert duplicates_removed(["b", "a", "b", "c", "a"]) == ["b", "a", "c"]


    def test_already_seen_items_are_skipped_and_order_kept():
        assert duplicates_removed(["z", "a", "q"], already_seen=("a",)) == ["z", "q"]


    def test_unorderable_mix_does_not_crash():
        assert duplicates_removed([3, "a", 3, (1, 2)]) == [3, "a", (1, 2)]
