    from pygments.util import shebang_matches


    def test_flags_after_the_interpreter_are_ignored():
        assert shebang_matches("#!/usr/bin/perl -w", "perl")
        assert shebang_matches("#!/usr/bin/env python3 -u\nprint(1)", r"python(3)?")


    def test_non_matching_interpreter():
        assert not shebang_matches("#!/usr/bin/perl -w", "python")
        assert not shebang_matches("print(1)", "python")
