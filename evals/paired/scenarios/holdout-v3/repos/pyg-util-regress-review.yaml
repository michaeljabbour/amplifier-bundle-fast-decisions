    import pytest

    from pygments.util import OptionError, get_bool_opt


    def test_string_values_are_case_insensitive():
        assert get_bool_opt({"x": "True"}, "x") is True
        assert get_bool_opt({"x": "YES"}, "x") is True
        assert get_bool_opt({"x": "Off"}, "x") is False
        assert get_bool_opt({"x": "0"}, "x") is False


    def test_non_strings_pass_through():
        assert get_bool_opt({"x": True}, "x") is True
        assert get_bool_opt({"x": 0}, "x") is False


    def test_garbage_still_rejected():
        with pytest.raises(OptionError):
            get_bool_opt({"x": "maybe"}, "x")
