  jsonschema/tests/test_json_pointer_hidden.py: |
    from unittest import TestCase

    from jsonschema import Draft202012Validator, exceptions


    class TestJsonPointer(TestCase):
        def _err(self, path):
            return exceptions.ValidationError(
                path=path, message="1", validator="foo", instance="i",
            )

        def test_empty_path_is_the_whole_document(self):
            self.assertEqual(self._err([]).json_pointer, "")

        def test_simple_path(self):
            self.assertEqual(self._err(["a", 0, "b"]).json_pointer, "/a/0/b")

        def test_escaping(self):
            self.assertEqual(self._err(["a/b", "c~d", "e~/f"]).json_pointer, "/a~1b/c~0d/e~0~1f")

        def test_empty_key(self):
            self.assertEqual(self._err([""]).json_pointer, "/")
            self.assertEqual(self._err(["a", ""]).json_pointer, "/a/")

        def test_space_is_not_escaped(self):
            self.assertEqual(self._err(["a b"]).json_pointer, "/a b")

        def test_from_real_validation(self):
            schema = {"properties": {"x/y": {"items": {"type": "integer"}}}}
            (error,) = Draft202012Validator(schema).iter_errors({"x/y": [1, "s"]})
            self.assertEqual(error.json_pointer, "/x~1y/1")
turns:
  - prompt: >-
      `ValidationError.json_path` produces ambiguous or invalid JSON paths for keys that are not plain
      identifiers. A property called `a b`, `a.b`, `1` or `it's` currently renders as `$.a b`,
      `$.a.b`, `$.1` and `$.it's`. Keys that match `[a-zA-Z][a-zA-Z0-9_]*` should keep the dot form
      (`$.x`), integers stay `[0]`, and everything else (including the empty string, `_`, `-`,
      brackets and quotes) must use quoted bracket notation like `$['a b']`, with a backslash and a
      single quote inside the key escaped by a backslash. Please fix it in the jsonschema package. Run
      the tests from this directory with `python3 -m pytest -q jsonschema/tests/test_exceptions.py`.
