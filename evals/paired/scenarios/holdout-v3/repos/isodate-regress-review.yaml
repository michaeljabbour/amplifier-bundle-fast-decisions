hidden_files:
  hidden/test_sign.py: |
    from datetime import timedelta

    from isodate import parse_duration
    from isodate.duration import Duration


    def test_negative_timedelta():
        assert parse_duration("-P1D") == timedelta(days=-1)
        assert parse_duration("-PT90M") == timedelta(minutes=-90)


    def test_negative_duration():
        assert parse_duration("-P1Y") == Duration(years=-1)
  hidden/test_or.py: |
    from datetime import timedelta

    from isodate import parse_duration
    from isodate.duration import Duration


    def test_years_only_stays_a_duration():
        result = parse_duration("P1Y")
        assert isinstance(result, Duration)
        assert result.years == 1


    def test_months_only_stays_a_duration():
        result = parse_duration("P3M")
        assert isinstance(result, Duration) and result.months == 3


    def test_days_only_is_timedelta():
        assert parse_duration("P2DT3H") == timedelta(days=2, hours=3)
  hidden/test_rx.py: |
    from datetime import timedelta

    from isodate import parse_duration


    def test_decimal_comma_seconds():
        assert parse_duration("PT1,5S") == timedelta(seconds=1.5)


    def test_decimal_point_seconds():
        assert parse_duration("PT1.5S") == timedelta(seconds=1.5)


    def test_decimal_comma_in_other_units():
        assert parse_duration("PT0,5H") == timedelta(minutes=30)
  hidden/test_neg.py: |
    from datetime import timedelta

    from isodate import duration_isoformat
    from isodate.duration import Duration


    def test_negative_timedelta_has_sign():
        assert duration_isoformat(timedelta(days=-1)) == "-P1D"


    def test_negative_duration_with_only_days_has_sign():
        assert duration_isoformat(Duration(days=-1)) == "-P1D"


    def test_positive_has_no_sign():
        assert duration_isoformat(Duration(years=1, days=1)) == "P1Y1D"
