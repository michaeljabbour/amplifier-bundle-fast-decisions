workspace: {kind: git, repo: 'https://github.com/stefankoegl/python-json-patch.git', sha: d8e1a6e244728c04229d601bc9a384d9b034c603, local_hint: ~/dev/afast-paired-src/python-json-patch}
hidden_files:
  hidden/test_len_paths.py: |
    from jsonpatch import JsonPatch


    OPS = [
        {"op": "add", "path": "/a", "value": 1},
        {"op": "move", "from": "/a", "path": "/b"},
        {"op": "remove", "path": "/b"},
    ]


    def test_len_counts_operations():
        assert len(JsonPatch(OPS)) == 3
        assert len(JsonPatch([])) == 0


    def test_bool_is_unchanged():
        assert bool(JsonPatch(OPS))
        assert not JsonPatch([])


    def test_paths_in_order():
        assert JsonPatch(OPS).paths() == ["/a", "/b", "/b"]


    def test_paths_of_empty_patch():
        assert JsonPatch([]).paths() == []


    def test_paths_use_target_not_source():
        assert JsonPatch([{"op": "copy", "from": "/x", "path": "/y"}]).paths() == ["/y"]
