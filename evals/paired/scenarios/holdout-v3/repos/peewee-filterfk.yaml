    import unittest

    from peewee import CharField, ForeignKeyField, Model, SqliteDatabase, TextField

    db = SqliteDatabase(":memory:")


    class Base(Model):
        class Meta:
            database = db


    class User(Base):
        username = CharField(null=True)


    class Tweet(Base):
        user = ForeignKeyField(User, null=True, backref="tweets")
        content = TextField(null=True)


    class TestIsNull(unittest.TestCase):
        def setUp(self):
            db.connect(reuse_if_open=True)
            db.create_tables([User, Tweet])
            a = User.create(username="a")
            b = User.create(username=None)
            Tweet.create(user=a, content="x")
            Tweet.create(user=b, content=None)
            Tweet.create(user=None, content="z")

        def tearDown(self):
            db.drop_tables([Tweet, User])

        def _contents(self, query):
            return sorted(str(t.content) for t in query)

        def test_isnull_true(self):
            self.assertEqual(self._contents(Tweet.select().filter(content__isnull=True)), ["None"])

        def test_isnull_false(self):
            self.assertEqual(self._contents(Tweet.select().filter(content__isnull=False)), ["x", "z"])

        def test_isnull_across_a_join(self):
            query = Tweet.select().filter(user__username__isnull=False)
            self.assertEqual(self._contents(query), ["x"])
            query = Tweet.select().filter(user__username__isnull=True)
            self.assertEqual(self._contents(query), ["None"])

        def test_sql_uses_is_null_and_is_not_null(self):
            sql, _ = Tweet.select().filter(content__isnull=True).sql()
            self.assertIn("IS NULL", sql)
            sql, _ = Tweet.select().filter(content__isnull=False).sql()
            self.assertIn("IS NOT NULL", sql)

        def test_existing_is_null_spelling_still_works(self):
            self.assertEqual(self._contents(Tweet.select().filter(content__is_null=True)), ["None"])
turns:
  - prompt: >-
      peewee's Django-style `filter()` builds the wrong query when a lookup path ends in `None`. With
      `Tweet.user` a foreign key to `User`, `Tweet.select().filter(user__username=None)` should join
      `user` and test `username IS NULL`, but the join is skipped. And
      `Favorite.select().filter(tweet__user=None)` (or `tweet__user=3`) should compare the
      `tweet.user_id` column of the joined tweet table and not join the `user` table at all. Please
      find the cause in `peewee.py` (look at how filter kwargs are converted to nodes) and fix it. Run
      the tests from this directory with `python3 -m pytest -q tests/model_sql.py
      "tests/models.py::TestDjangoFilterRegression"`.
    checks:
      - {kind: tests, runner: python, files: [tests/model_sql.py, 'tests/models.py::TestDjangoFilterRegression'], hidden: [tests/model_sql.py, tests/models.py]}
