    checks:
      - {kind: keyed_facts, all: [Condition\.wait, Semaphore\.acquire, Event\.wait, with_timeout, add_timeout]}
  - prompt: >-
      One more problem in the same area: `q.get(timeout="soon")` raises a TypeError (fine), but the
      queue is left corrupted, the abandoned getter is still registered, so the next `put_nowait(1)`
