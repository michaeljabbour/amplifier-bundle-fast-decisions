      should raise `tornado.gen.TimeoutError` right away when they would have to block; when the
      semaphore is available an acquire with zero timeout must still succeed. Fix it in
      tornado/locks.py.
    checks:
      - {kind: tests, runner: python, files: [tornado/test/locks_zero_hidden_test.py, tornado/test/locks_test.py, tornado/test/queues_test.py], hidden: [tornado/test/locks_zero_hidden_test.py, tornado/test/locks_test.py, tornado/test/queues_test.py]}
  - prompt: >-
      Document the zero-timeout behaviour in the docstrings of `Queue.get` and `Queue.put` in
      tornado/queues.py: one sentence each saying that a timeout of zero (or a zero timedelta) means
      do not wait, raising TimeoutError at once if the operation cannot complete immediately.
      Docstrings only.
    checks:
      - {kind: file_regex, path: tornado/queues.py, pattern: '(?i)\bzero\b', min_count: 2}
