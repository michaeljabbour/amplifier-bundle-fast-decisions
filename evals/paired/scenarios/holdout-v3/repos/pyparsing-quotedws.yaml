    from unittest import TestCase

    import pyparsing as pp


    class TestQuotedStringDefaultWhitespace(TestCase):
        def test_leading_newline_delimiter_matches_by_default(self):
            q = pp.QuotedString("\n;", multiline=True)
            self.assertEqual(q.parse_string("\n;Hi \n mum!\n;").as_list(), ["Hi \n mum!"])

        def test_leading_space_delimiter(self):
            q = pp.QuotedString(" '", end_quote_char="' ")
            self.assertEqual(q.parse_string(" 'abc' ").as_list(), ["abc"])

        def test_search_string_with_newline_delimiter(self):
            q = pp.QuotedString("\n;", multiline=True)
            self.assertEqual(q.search_string("lsjdf \n;Hi\n; sldjf").as_list(), [["Hi"]])

        def test_ordinary_quotes_still_skip_leading_whitespace(self):
            self.assertEqual(pp.QuotedString('"').parse_string('   "x"').as_list(), ["x"])
            self.assertEqual(pp.QuotedString("<<", end_quote_char=">>").parse_string("\n <<x>>").as_list(), ["x"])

        def test_context_independent_of_global_whitespace_setting(self):
            q = pp.QuotedString("\n;", multiline=True)
            self.assertEqual(q.parse_string("\n;a\n;").as_list(), ["a"])
            self.assertEqual((pp.Literal("k") + q).parse_string("k\n;a\n;").as_list(), ["k", "a"])
  tests/test_quoted_messages_hidden.py: |
    from unittest import TestCase

    import pyparsing as pp


    class TestQuotedStringValidationMessages(TestCase):
        def test_empty_and_blank_quote_chars_are_rejected_with_a_clear_message(self):
            for bad in ("", "   ", "\n"):
                with self.assertRaisesRegex(ValueError, "quote_char cannot be empty or all whitespace"):
                    pp.QuotedString(bad)

        def test_end_quote_char_message_names_the_argument(self):
            for bad in ("", "   ", "\n"):
                with self.assertRaisesRegex(ValueError, "end_quote_char cannot be empty or all whitespace"):
                    pp.QuotedString('"', end_quote_char=bad)

        def test_valid_delimiters_with_whitespace_are_accepted(self):
            pp.QuotedString("\n;", multiline=True)
            pp.QuotedString("<<", end_quote_char=" >>")
turns:
  - prompt: >-
      pyparsing's `QuotedString` silently drops whitespace that is part of a multi-character
      delimiter. `QuotedString("\n;", multiline=True)` is meant to match text between a
      newline-semicolon pair, but its quote_char ends up as just `";"`, so the newline is ignored and
      matching starts and ends at the wrong positions (issue #492). Delimiters that are empty or
      entirely whitespace must still raise ValueError, and the same goes for `end_quote_char`. Find
      the cause in the pyparsing package and fix it. Run the tests from this directory with `python3
      -m pytest -q -k QuotedString tests/test_unit.py`.
    checks:
      - {kind: tests, runner: python, files: [-k, QuotedString, tests/test_unit.py], hidden: [tests/test_unit.py]}
  - prompt: >-
      In three to five sentences explain the root cause: which constructor step changed the delimiter,
      why that was harmless for single-character quotes, and what the validation was really for. Do
      not change any files.
    checks:
      - {kind: keyed_facts, all: [strip, quote_char, end_quote_char], any: [empty, whitespace, validat]}
  - prompt: >-
      Add a test file `tests/test_quoted_ws_extra.py` (unittest style, like the others) with at least
      four tests: a leading newline delimiter is kept (use
      `pp.ParserElement.set_default_whitespace_chars("")` inside `ppt.reset_pyparsing_context()`), a
      trailing space in the end delimiter is kept and the same text without the space no longer
      matches, `end_quote_char` is stored unstripped, and blank delimiters are still rejected. Run it.
    checks:
      - {kind: file_regex, path: tests/test_quoted_ws_extra.py, pattern: ^    def test_, min_count: 4}
      - {kind: tests, runner: python, files: [tests/test_quoted_ws_extra.py]}
  - prompt: >-
      There is still a catch: the newline delimiter only works when the global default whitespace is
      cleared, because the element skips leading whitespace before matching, so
      `pp.QuotedString("\n;", multiline=True).parse_string("\n;Hi \n mum!\n;")` fails by default
      (`Expected string enclosed in '\n;', found ';'`). A QuotedString whose opening delimiter starts
      with a whitespace character must not skip leading whitespace by itself, so that this works with
      the default settings (also for `search_string`, and inside `Literal("k") + q`). Ordinary quotes
      such as `"` must keep skipping leading whitespace.
    checks:
      - {kind: tests, runner: python, files: [-k, QuotedString, tests/test_quoted_default_ws_hidden.py, tests/test_unit.py], hidden: [tests/test_quoted_default_ws_hidden.py, tests/test_unit.py]}
