- prompt: What does `tomlkit.parse(text)` return, does `dumps(parse(text)) == text` hold, and what item types appear for a title string, a table, an inline list and an array of tables? Run it on a document with comments, a table, a multi-line array and two `[[products]]` entries. Do not change repository files.
  checks:
  - kind: keyed_facts
    all: [TOMLDocument, 'True', String, Table, Array, AoT]
- prompt: 'Show what happens to comments and layout when you edit a parsed document: change `owner.name` to ''Tim'' and add a new top-level key `new = 1`. Where does the new key end up in the output and what stays untouched? Run it. Do not change repository files.'
  checks:
  - kind: keyed_facts
    all: [comment, name = \"Tim\", new = 1, before|above|first|top-level|root, preserv|unchanged|untouched|kept]
- prompt: 'What does `doc.unwrap()` return and why would you use it? Also: how many names are in `tomlkit.__all__`? Run both. Do not change repository files.'
  checks:
