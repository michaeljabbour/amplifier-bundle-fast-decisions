# holdout-v3 repos scenario (10 turns, explain): python-poetry/tomlkit at 0518af2 (0.15.1): explain round-trip parsing, item types, editing, errors and the public API by running the checkout, then add tomlkit.is_valid against hidden tests with export, tests and changelog
id: tomlkit-roundtrip-explain
task_type: explain
language: python
split: holdout
source: {desc: 'python-poetry/tomlkit at 0518af2 (0.15.1): explain round-trip parsing, item types, editing, errors and the public API by running the checkout, then add tomlkit.is_valid against hidden tests with export, tests and changelog', repo: 'https://github.com/python-poetry/tomlkit.git', sha: 0518af253901e57872c03835db6fe9bacab40ee7}
workspace: {kind: git, repo: 'https://github.com/python-poetry/tomlkit.git', sha: 0518af253901e57872c03835db6fe9bacab40ee7, local_hint: ~/dev/afast-paired-src/_v3c/tomlkit}
hidden_files:
  hidden/test_is_valid.py: |
    import tomlkit

    from tomlkit import is_valid


    def test_valid_documents():
        assert is_valid("a = 1") is True
        assert is_valid("") is True
        assert is_valid(b"a = 1") is True
        assert is_valid("[t]\nx = [1, 2]\n") is True


    def test_invalid_documents():
        assert is_valid("a = ") is False
        assert is_valid("a = 1\na = 2") is False
        assert is_valid("[t") is False


    def test_exported_and_sorted():
        assert "is_valid" in tomlkit.__all__
        assert tomlkit.is_valid is tomlkit.api.is_valid
        assert tomlkit.__all__ == sorted(tomlkit.__all__)
        assert len(tomlkit.__all__) == 28
turns:
- prompt: Give me a one-line role for each module in the tomlkit/ package and say where the tests and docs are. Do not change any files.
