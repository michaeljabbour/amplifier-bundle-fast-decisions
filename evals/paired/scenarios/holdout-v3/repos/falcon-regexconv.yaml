    import falcon
    import falcon.testing as testing

    from falcon.routing import converters


    class Item:
        def on_get(self, req, resp, code):
            resp.media = {'code': code}


    def test_default_is_case_sensitive():
        assert converters.RegexConverter('[a-z]+').convert('ABC') is None


    def test_ignorecase_matches_any_case():
        c = converters.RegexConverter('[a-z]+', ignorecase=True)
        assert c.convert('ABC') == 'ABC'
        assert c.convert('abc') == 'abc'
        assert c.convert('ab1') is None


    def test_ignorecase_in_a_route_template():
        app = falcon.App()
        app.add_route("/items/{code:regex('[a-z]+', ignorecase=True)}", Item())
        client = testing.TestClient(app)
        assert client.simulate_get('/items/AbC').json == {'code': 'AbC'}
        assert client.simulate_get('/items/ab1').status_code == 404


    def test_invalid_pattern_message_is_unchanged_with_ignorecase():
        import pytest

        with pytest.raises(ValueError, match='invalid regex pattern for RegexConverter'):
            converters.RegexConverter('[', ignorecase=True)
  tests/test_regex_pattern_type_hidden.py: |
    import pytest

    from falcon.routing import converters


    @pytest.mark.parametrize('bad', [b'abc', 12, None, ['a']])
    def test_non_string_pattern_raises_type_error(bad):
        with pytest.raises(TypeError, match='RegexConverter pattern must be a str'):
            converters.RegexConverter(bad)


    def test_type_error_names_the_offending_type():
        with pytest.raises(TypeError, match='bytes'):
            converters.RegexConverter(b'abc')


    def test_str_pattern_still_fine():
        assert converters.RegexConverter(r'\d+').convert('42') == '42'
