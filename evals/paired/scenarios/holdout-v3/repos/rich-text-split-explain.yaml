hidden_files:
  hidden/test_split_at.py: |
    from rich.text import Span, Text


    def make():
        text = Text("Hello World")
        text.stylize("bold", 0, 5)
        text.stylize("red", 3, 8)
        return text


    def test_plain_and_spans_are_rebased():
        left, right = make().split_at(5)
        assert (left.plain, right.plain) == ("Hello", " World")
        assert left.spans == [Span(0, 5, "bold"), Span(3, 5, "red")]
        assert right.spans == [Span(0, 3, "red")]


    def test_edges():
        text = make()
        left, right = text.split_at(0)
        assert (left.plain, right.plain) == ("", "Hello World")
        left, right = text.split_at(len(text))
        assert (left.plain, right.plain) == ("Hello World", "")


    def test_offsets_are_clamped():
        text = make()
        assert text.split_at(-3)[0].plain == ""
        assert text.split_at(-3)[1].plain == "Hello World"
        assert text.split_at(99)[1].plain == ""


    def test_base_style_and_justify_are_kept():
        left, right = Text("ab", style="red", justify="center").split_at(1)
        assert left.style == right.style == "red"
        assert left.justify == right.justify == "center"


    def test_original_is_unchanged():
        text = make()
        text.split_at(4)
        assert text.plain == "Hello World"
        assert text.spans == [Span(0, 5, "bold"), Span(3, 8, "red")]
