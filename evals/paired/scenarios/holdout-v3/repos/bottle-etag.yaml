    checks:
      - {kind: file_regex, path: bottle.py, pattern: '(?s)def static_file\(.*?If-None-Match.{0,600}?(?i:precedence|takes priority|ignored)'}
      - {kind: tests, runner: python, files: [test/test_sendfile.py], hidden: [test/test_sendfile.py]}
