- prompt: Add test_regressions.py to the repository root with at least four pytest tests that pin the three regressions (leading-zero index, unescape order, contains by parts) plus one positive prefix case. They must pass on the fixed code and fail when ANY of the three merged changes is put back (prove it by re-applying each one in a scratch copy).
  checks:
  - {kind: file_regex, path: test_regressions.py, pattern: ^def test_, min_count: 4}
  - {kind: tests, runner: cmd, cmd: 'O=$(mktemp -d) && python3 -m pytest -q -p no:cacheprovider test_regressions.py && cp jsonpointer.py $O/fixed.py && perl -0pi -e "s/return s\.replace\(''~1'', ''\/''\)\.replace\(''~0'', ''~''\)/return s.replace(''~0'', ''~'').replace(''~1'', ''\/'')/" jsonpointer.py && if python3 -m pytest -q -p no:cacheprovider test_regressions.py; then exit 1; fi && cp $O/fixed.py jsonpointer.py && perl -0pi -e ''s/return self\.parts\[:len\(ptr\.parts\)\] == ptr\.parts/return self.path.startswith(ptr.path)/'' jsonpointer.py && if python3 -m pytest -q -p no:cacheprovider test_regressions.py; then exit 1; fi && cp $O/fixed.py jsonpointer.py && perl -0pi -e ''s/_RE_ARRAY_INDEX\.fullmatch\(/_RE_ARRAY_INDEX.match(/'' jsonpointer.py && if python3 -m pytest -q -p no:cacheprovider test_regressions.py; then exit 1; fi && cp $O/fixed.py jsonpointer.py', timeout: 280}
- prompt: Explain how `JsonPointer.set` treats the '-' part and the `inplace` flag, and what `to_last` and `EndOfList` are for. Answer from jsonpointer.py. Do not change any files.
  checks:
  - kind: keyed_facts
    all: ['''-''|\"-\"|dash', append, inplace, deepcopy|cop(y|ies), to_last, EndOfList, Cannot set root in place|root]
- prompt: Write REVIEW.md in the repository root with level-2 sections Summary, Test suite gaps, get_part, unescape and contains describing what was wrong and how you fixed each, with one concrete input per section.
  checks:
  - kind: doc_sections
    path: REVIEW.md
    headings: [Summary, Test suite gaps, get_part, unescape, contains]
  - {kind: file_regex, path: REVIEW.md, pattern: ~01}
  - {kind: file_regex, path: REVIEW.md, pattern: /ab}
  - {kind: file_regex, path: REVIEW.md, pattern: fullmatch}
- prompt: 'Final check: list every file you changed or added in this session, what changed in each, and any behaviour of jsonpointer.py you would still want a test for. Do not change any files.'
  checks:
  - kind: keyed_facts
    all: [jsonpointer\.py, test_regressions\.py, REVIEW\.md, still|remaining|not covered|would add|edge|risk]
