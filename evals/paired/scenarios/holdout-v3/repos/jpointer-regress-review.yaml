  hidden/test_index.py: |
    import pytest

    from jsonpointer import JsonPointer, JsonPointerException, resolve_pointer


    def test_leading_zero_index_is_rejected():
        with pytest.raises(JsonPointerException):
            resolve_pointer([10, 20, 30], "/01")


    def test_trailing_garbage_index_is_rejected():
        with pytest.raises(JsonPointerException):
            resolve_pointer([10, 20, 30], "/1x")


    def test_plain_indexes_work():
        assert resolve_pointer([10, 20, 30], "/0") == 10
        assert resolve_pointer([10, 20, 30], "/2") == 30
        assert JsonPointer("/1").resolve([5, 6]) == 6
  hidden/test_unescape.py: |
    from jsonpointer import JsonPointer, escape, unescape


    def test_unescape_order_tilde_one_after_tilde_zero():
        assert unescape("~01") == "~1"
        assert JsonPointer("/~01").parts == ["~1"]


    def test_unescape_slash_and_tilde():
        assert unescape("a~1b~0c") == "a/b~c"


    def test_round_trip():
        for part in ("~1", "a/b", "~", "/~", "~01~10"):
            assert unescape(escape(part)) == part
        assert JsonPointer.from_parts(["~1"]).path == "/~01"
  hidden/test_contains.py: |
    from jsonpointer import JsonPointer


    def test_prefix_by_parts_not_by_characters():
        assert not JsonPointer("/ab").contains(JsonPointer("/a"))
        assert not JsonPointer("/a/b") in JsonPointer("/a/bc")


    def test_real_prefixes_are_contained():
        assert JsonPointer("/a/b").contains(JsonPointer("/a"))
        assert JsonPointer("/a") in JsonPointer("/a/b/c")
        assert JsonPointer("/a").contains(JsonPointer("/a"))
        assert JsonPointer("").contains(JsonPointer(""))
