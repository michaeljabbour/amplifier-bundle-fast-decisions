description: >-
  Hybrid orchestration: bounded Jev decisions with a read-only workspace tool
  and native metadata observation hooks. Shadow mode, external state disabled.
session:
  orchestrator:
    module: loop-fast-decisions
    source: fast-decisions:modules/loop-fast-decisions
    config:
      mode: shadow
      backend: jev
      allow_external_state: false
      timeout_ms: 750
      min_probability: 0.90
      min_margin: 0.20
      max_fast_streak: 3
      max_fast_per_turn: 12
      max_candidates: 12
      max_state_chars: 12000
      allowed_tools: [fast_workspace]
      upstream:
        max_iterations: 100
        extended_thinking: true
hooks:
  - module: hooks-fast-decisions
    source: fast-decisions:modules/hooks-fast-decisions
    config: {}
tools:
  - module: tool-fast-workspace
    source: fast-decisions:modules/tool-fast-workspace
    config:
      root: .
      max_bytes: 32768
