bundle:
  name: fast-decisions-jev-cua
  version: 0.1.0
  description: Opt-in observed-control computer-use selection through Jev; host execution remains separate.

tools:
  - module: tool-jev-cua
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/tool-jev-cua
    config:
      backend: jev
      allow_external_state: true
      timeout_ms: 3000
      # The bundle's read-shortcut gate (docs/evidence/2026-09-30-judge-benchmark).
      min_probability: 0.90
      min_margin: 0.20

context:
  include:
    - fast-decisions:context/jev-cua.md
