bundle:
  name: fast-decisions-behavior
  version: 0.1.0
  description: >-
    Fast-decision telemetry hook plus the read-only fast_workspace tool.
    The hook carries its own shadow config (mode: shadow by default): compose
    this behavior onto any orchestrator to get shadow measurement -- no
    orchestrator swap required. Orchestrator swaps (fast-path execution)
    remain opt-in via bundles/active.yaml.

hooks:
  - module: hooks-fast-decisions
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/hooks-fast-decisions
    config:
      mode: shadow
      # deterministic: in-process, offline scorer (external=False) -- the
      # shipped "shadow, external=false" rung actually measures something
      # instead of only ever hitting the external_state_not_enabled
      # fallback. Set backend: jev (and allow_external_state: true) to move
      # to the next rung. See docs/design/redesign-2026-09-17.md P3.
      backend: deterministic
      allow_external_state: false
      shadow_capacity: 64
      shadow_state_source: context_mount
      shadow_max_messages: 12
      shadow_snapshot_budget_ms: 25
      shadow_drain_ms: 2000
      max_state_chars: 12000
      max_questions: 8
      # Shadow-only (see router.py: "modify" is never honored at tool:pre in
      # the upstream loop, so this can never become active through this
      # seam). Defaulting it on costs nothing beyond one resolver probe per
      # session and turns a UAT/DTU session into a real proposal/agreement
      # trail instead of a wall of role_router_disabled abstains. See
      # docs/design/redesign-2026-09-17.md P4.
      role_router: true
      role_probe_timeout_ms: 2000
      role_router_tools:
        - delegate

tools:
  - module: tool-fast-workspace
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/tool-fast-workspace
    config:
      root: .
      max_bytes: 32768
