# The shipped orchestrator config (behaviors/fast-decisions.yaml) with the Apple MLX
# local judge instead of Jev and no external state; backend/model/mlx_url/
# allow_external_state are the only differences, held by tests/test_config_parity.py
# (regenerate with scripts/sync_active_bundles.py). No cost or quality result
# exists for the MLX judge on the routing decision: screen it before relying on it.
#
bundle:
  name: fast-decisions-active-mlx
  version: 0.1.0
  description: >-
    The shipped decision orchestrator (decide once per session, price gate,
    one effort per tier) judged by a local mlx_lm.server (Apple Silicon only)
    instead of Jev. Opt-in only.

includes:
  # foundation + the observer-only behavior (not bundle.md, whose behavior now
  # carries its own orchestrator config that would deep-merge into this one).
  - bundle: git+https://github.com/microsoft/amplifier-foundation@main
  - bundle: fast-decisions:behaviors/fast-decisions-shadow

session:
  orchestrator:
    module: loop-fast-decisions
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/loop-fast-decisions
    config:
      mode: active
      backend: mlx
      allow_external_state: false
      read_shortcut: false
      timeout_ms: 3000
      allowed_tools:
      - fast_workspace
      effort_routing:
        by_tier:
          cheap: medium
          strong: null
        by_host:
          claude-fable-5-1:
            strong: medium
      model_routing:
        start_model: claude-sonnet-5
        provider_match: anthropic
        start_policy: judge
        complex_min_prompt_chars: null
        decision_scope: session
        price_gate:
          enabled: true
        keep_on_host:
          task_types:
          - review
          - explain
        cheap_max_workspace_files: 300
        max_requests_before_escalation: null
        escalate_on_test_failure: false
        escalate_on_provider_error: true
      cache_keepalive:
        enabled: true
        interval_s: 270
        max_refreshes: 6
        min_prefix_tokens: 20000
        max_output_tokens: 1
      waste_guards:
        enabled: true
        repeat_stop: true
        retry_stop: true
        poll_wait: true
        identical_results: true
        poll_max_wait_s: 240
      observatory:
        enabled: true
        open_browser: always
        port: 8765
      model: mlx-community/Qwen3-0.6B-4bit
      mlx_url: http://127.0.0.1:8080
