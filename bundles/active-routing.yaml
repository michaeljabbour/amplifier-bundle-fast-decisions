# Screen-validated 2026-09-20 (one repetition): 40/40 aider-polyglot exercises
# at 26 s median working time (plain Amplifier 100 s; Claude Code 28 s / 35 of
# 40; Codex 35 s / 37 of 40), 20/20 on the synthetic battery; the plain-on-sonnet
# control scored 39/40 at 128 s, so the gain is attributable to routing +
# escalation, not the cheaper model alone. Repetition-confirmed results update
# this file via evals/apply_recommendation.py. Requires a provider that serves
# claude-sonnet-5 alongside the pinned model.
bundle:
  name: fast-decisions-active-routing
  version: 0.1.0
  description: >-
    Root fast-decisions bundle plus the decision orchestrator in active mode
    with phase-specific effort routing and opt-in model routing/escalation
    (HC03/HC04): a bounded fast path may substitute a prepared read-only
    action for an LLM turn, effort scales by phase, and the session starts on
    a cheaper model that escalates to claude-sonnet-5 on failure signals.
    Opt-in only.

includes:
  - bundle: fast-decisions:bundle.md

session:
  orchestrator:
    module: loop-fast-decisions
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/loop-fast-decisions
    config:
      mode: active
      backend: ollama
      # model: jev-1.13.0  # pin the version when thresholds are tuned; aliases move on release
      model: qwen3:0.6b
      timeout_ms: 500
      allow_external_state: false
      min_probability: 0.90
      min_margin: 0.20
      max_fast_streak: 3
      max_fast_per_turn: 12
      max_candidates: 12
      max_state_chars: 12000
      allowed_tools: [fast_workspace]
      effort_routing:
        orient: medium
        explore: low
        implement: high
        max_explore_requests: 6
        escalate_after_provider_errors: 1
      model_routing:
        start_model: claude-sonnet-5
        max_requests_before_escalation: 6
        escalate_on_test_failure: true
        escalate_on_provider_error: true
      upstream:
        max_iterations: 100
        extended_thinking: true
