# The orchestrator config below is the SAME config as behaviors/fast-decisions.yaml
# (Jev judge, price gate, decide once per session, one effort per tier). It is
# regenerated from that file by scripts/sync_active_bundles.py and held equal by
# tests/test_config_parity.py -- do not edit it by hand. Earlier revisions of this file
# carried a local Ollama judge, a 500 ms timeout and a per-phase effort map that
# silently disagreed with the shipped defaults.
#
bundle:
  name: fast-decisions-active-routing
  version: 0.2.0
  description: >-
    Foundation plus the observer-only behavior and the decision orchestrator
    in active mode, with the shipped defaults (see bundles/active.yaml). The
    same configuration composed without the root bundle. Opt-in.

includes:
  # foundation + the observer-only behavior (not bundle.md, whose behavior now
  # carries its own orchestrator config that would deep-merge into this one).
  - bundle: git+https://github.com/microsoft/amplifier-foundation@main
  - bundle: fast-decisions:behaviors/fast-decisions-shadow

session:
  orchestrator:
    module: loop-fast-decisions
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@main#subdirectory=modules/loop-fast-decisions
    config:
      mode: active
      backend: jev
      allow_external_state: true
      read_shortcut: false
      timeout_ms: 3000
      allowed_tools:
      - fast_workspace
      effort_routing:
        by_tier:
          cheap: medium
          strong: null
      model_routing:
        start_model: claude-sonnet-5
        provider_match: anthropic
        start_policy: judge
        decision_scope: session
        price_gate:
          enabled: true
        cheap_max_workspace_files: 300
        max_requests_before_escalation: null
        escalate_on_test_failure: false
        escalate_on_provider_error: true
      cache_keepalive:
        enabled: true
        interval_s: 270
        max_refreshes: 6
        min_prefix_tokens: 20000
        max_output_tokens: 1
      waste_guards:
        enabled: true
        repeat_stop: true
        retry_stop: true
        poll_wait: true
        identical_results: true
        poll_max_wait_s: 240
      observatory:
        enabled: true
        open_browser: always
        port: 8765
