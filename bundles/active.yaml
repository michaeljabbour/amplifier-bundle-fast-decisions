# Screen-validated 2026-09-20 (20-task and polyglot batteries, 1 repetition):
# ~0.55x plain Amplifier working time at equal quality. Confirmed-repetition
# results update this file via evals/apply_recommendation.py.
#
# A second rung, bundles/active-routing.yaml, adds phase-specific effort
# routing plus opt-in model routing/escalation on top of this same judge
# (screen-validated 2026-09-20, one repetition: 26 s median working time vs
# 100 s here, on 40/40 aider-polyglot exercises). It requires a provider
# that serves claude-sonnet-5 alongside the pinned judge model.
bundle:
  name: fast-decisions-active
  version: 0.1.0
  description: >-
    Root fast-decisions bundle plus the decision orchestrator in active mode:
    a bounded fast path may substitute a prepared read-only action for an LLM
    turn. Opt-in only.

includes:
  # A namespace-only include can resolve to an unrelated local registration
  # (for example an old benchmark checkout). Use the reviewed package revision.
  - bundle: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@40f7a93b8907fe6ee5acbb9124e263dbeebd8b89

session:
  orchestrator:
    module: loop-fast-decisions
    source: git+https://github.com/michaeljabbour/amplifier-bundle-fast-decisions@40f7a93b8907fe6ee5acbb9124e263dbeebd8b89#subdirectory=modules/loop-fast-decisions
    config:
      mode: active
      backend: ollama
      # model: jev-1.13.0  # pin the version when thresholds are tuned; aliases move on release
      model: qwen3:0.6b
      timeout_ms: 500
      allow_external_state: false
      min_probability: 0.90
      min_margin: 0.20
      max_fast_streak: 3
      max_fast_per_turn: 12
      max_candidates: 12
      max_state_chars: 12000
      allowed_tools: [fast_workspace]
      effort_routing:
        explore: low
        max_explore_requests: 6
        escalate_after_provider_errors: 1
      upstream:
        max_iterations: 100
        extended_thinking: true
