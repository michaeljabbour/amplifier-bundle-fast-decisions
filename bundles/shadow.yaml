bundle:
  name: fast-decisions-shadow
  version: 0.1.0
  description: >-
    DEPRECATED -- compose bundle.md (or behaviors/fast-decisions) instead;
    removed in 0.3.0. Shadow measurement now lives on the hook
    (hooks-fast-decisions, config: {mode: shadow, ...}) and composes onto
    any orchestrator, so this bundle no longer swaps session.orchestrator.
    It forwards to the root bundle unchanged: your orchestrator (loop-streaming
    by default) stays in place, and the shadow hook records what it would
    have chosen without ever overriding the model.

includes:
  - bundle: fast-decisions:bundle.md
