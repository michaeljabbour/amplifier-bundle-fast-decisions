[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "amplifier-module-loop-fast-decisions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@4cc86dd4eae36b40af38b4e2e70b9045649d2903",
]
[project.optional-dependencies]
jev = ["typesafe-sdk"]
# Retained for callers that already request this extra. The wrapped loop is
# required for every active session, including a host with an empty module cache.
upstream = []
[project.entry-points."amplifier.modules"]
loop-fast-decisions = "amplifier_module_loop_fast_decisions:mount"
[tool.setuptools.packages.find]
include = ["amplifier_module_loop_fast_decisions*"]
