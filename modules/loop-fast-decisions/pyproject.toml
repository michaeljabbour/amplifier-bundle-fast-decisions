[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "amplifier-module-loop-fast-decisions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@20aac7a9eb26034d230357f6aa6805f27c86df52", "typesafe-sdk"]
[project.entry-points."amplifier.modules"]
loop-fast-decisions = "amplifier_module_loop_fast_decisions:mount"
[tool.setuptools.packages.find]
include = ["amplifier_module_loop_fast_decisions*"]
